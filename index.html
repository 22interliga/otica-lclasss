<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Ótica lclass"/>
<meta name="theme-color" content="#e30613"/>
<title>Ótica lclass</title>
<link rel="manifest" href="manifest.webmanifest"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060d1a;--surface:#0f172a;--surface2:#080e1a;--border:#1e293b;--border2:#334155;
  --gold:#C9A84C;--gold2:#a07a30;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;
  --green:#10b981;--red:#ef4444;--purple:#818cf8;--yellow:#C9A84C;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
a{color:inherit;text-decoration:none}
input,select,textarea,button{font-family:'DM Sans',sans-serif}
button{cursor:pointer}

/* LAYOUT */
#app{display:flex;min-height:100vh}
#sidebar{width:220px;background:var(--surface2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .3s;flex-shrink:0;z-index:200}
#sidebar.collapsed{width:64px}
#main{flex:1;display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
#header{background:var(--surface2);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
#content{flex:1;padding:32px;overflow-y:auto;max-height:calc(100vh - 57px)}

/* SIDEBAR */
.logo-area{padding:22px 18px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10}
.logo-icon{background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:8px;padding:7px 9px;flex-shrink:0;font-size:18px}
.logo-text{font-family:'Playfair Display',serif;font-size:16px;font-weight:800;line-height:1}
.logo-sub{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
nav{flex:1;padding:10px 8px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10;padding:10px 12px;border-radius:8px;border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:500;transition:all .2s;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.nav-btn:hover{background:rgba(201,168,76,.08);color:var(--muted)}
.nav-btn.active{background:rgba(201,168,76,.12);color:var(--gold);font-weight:700}
.nav-btn svg{flex-shrink:0}
.nav-dot{margin-left:auto;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.collapse-btn{padding:10px 8px;border-top:1px solid var(--border)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.card-title{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}

/* STAT CARD */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.stat-glow{position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 12px 0 100%}
.stat-label{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-size:28px;font-weight:800;font-family:'Playfair Display',serif;color:var(--text);margin:8px 0 4px}
.stat-sub{font-size:12px;color:var(--muted)}
.stat-icon{border-radius:10px;padding:10px;display:flex}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--surface2);border-bottom:1px solid var(--border)}
th{padding:12px 16px;text-align:left;color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:var(--surface2)}
tbody tr:hover{background:rgba(201,168,76,.04)}

/* FORM */
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:5px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field label .req{color:var(--gold);margin-left:2px}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--dim)}
textarea.inp{resize:vertical;min-height:70px}
.err-msg{font-size:11px;color:var(--red);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;border:none;transition:all .2s;letter-spacing:.02em;white-space:nowrap}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0f172a}
.btn-secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-whatsapp{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:11px}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em}
.badge-green{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.badge-yellow{background:rgba(201,168,76,.15);color:#C9A84C;border:1px solid rgba(201,168,76,.3)}
.badge-gray{background:rgba(100,116,139,.15);color:#64748b;border:1px solid rgba(100,116,139,.3)}
.badge-purple{background:rgba(129,140,248,.15);color:#818cf8;border:1px solid rgba(129,140,248,.3)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:slideUp .25s}
.modal-sm{max-width:480px}
.modal-md{max-width:600px}
.modal-lg{max-width:860px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-header h2{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;margin:0}
.modal-body{padding:24px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border-radius:10px;padding:13px 20px;font-size:14px;z-index:9999;display:flex;align-items:center;gap:10;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:slideIn .3s;max-width:360px}

/* CHART */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:56px}
.bar-chart .bar{flex:1;border-radius:3px 3px 0 0;transition:height .6s}
.bar-chart .bar-label{font-size:9px;color:var(--dim);text-align:center;margin-top:3px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center}

/* EMPTY STATE */
.empty{padding:48px;text-align:center;color:var(--dim)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px}

/* SECTION DIVIDER */
.section-div{font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);padding-bottom:8px;margin:16px 0 12px}

/* WHATSAPP PREVIEW */
.wa-preview{background:#0d1e13;border:1px solid #1a3a22;border-radius:10px;padding:14px;font-size:13px;color:#d4e8d5;white-space:pre-wrap;line-height:1.6;font-family:monospace;max-height:280px;overflow-y:auto}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* PAGE HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;color:var(--text);margin-bottom:3px}
.page-sub{font-size:13px;color:var(--dim)}

/* SEARCH BAR */
.search-bar{position:relative;flex:1}
.search-bar input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px 9px 36px;color:var(--text);font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}

/* PROFILE */
.profile-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#0f172a}

/* CREDIÁRIO ACCORDION */
.cred-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
.cred-header{padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:background .15s}
.cred-header:hover{background:rgba(201,168,76,.04)}
.cred-body{border-top:1px solid var(--border);padding:0}

/* RECEITA CARD */
.receita-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border-color .2s}
.receita-card.ativa{border-color:rgba(201,168,76,.4)}

/* INFO GRID */
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--dim)}
.info-value{color:var(--text)}

/* RESPONSIVE */
@media(max-width:768px){
  #sidebar{width:64px}
  #sidebar .logo-text,.nav-btn span,.logo-sub,.collapse-btn span{display:none}
  #content{padding:12px}
  .grid2,.grid3,.grid5{grid-template-columns:1fr}
  .page-header{flex-direction:column}
  .modal{max-height:95vh}
  .modal-body{padding:16px}
  table{font-size:12px}
  th,td{padding:8px 10px}
  .stat-value{font-size:22px}
  .btn{padding:8px 14px;font-size:12px}
  .page-title{font-size:22px}
}
@media(max-width:480px){
  #content{padding:8px}
  .grid2{grid-template-columns:1fr}
  .modal-body{padding:12px}
  .btn-sm{padding:6px 10px;font-size:11px}
  #header{padding:10px 16px}
  .stat-value{font-size:20px}
}
/* Touch improvements */
button,a,.nav-btn,.lente-row{-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px!important}
::-webkit-scrollbar{width:3px;height:3px}

/* Bottom navigation */
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent;border:none;color:var(--dim);cursor:pointer;padding:6px 0;font-family:'DM Sans',sans-serif;transition:color .2s;min-height:52px}
.bnav-btn.active{color:var(--gold)}
.bnav-btn:active{opacity:.7}

/* When bottom nav visible, add padding to content */
@media(max-width:600px){
  #bottom-nav{display:block!important}
  #sidebar{display:none!important}
  #main{width:100%}
  #content{padding-bottom:72px}
  #header{padding:10px 16px}
}

<script>
// ═══════════════════════════════════════════════════════════
// PWA - Service Worker & Install Prompt
// ═══════════════════════════════════════════════════════════
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button in header
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'none';
  showToast('App instalado com sucesso!', 'success');
});

async function instalarApp() {
  if(!deferredPrompt) {
    showToast('Para instalar: use o menu do navegador → "Adicionar à tela inicial"', 'info');
    return;
  }
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  deferredPrompt = null;
}

// Service worker estático registrado por pwa.js.

// ═══════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════
const DB = {
  get(k){
    const raw=localStorage.getItem('otica_'+k);
    if(raw===null)return null;
    let dados;
    try{dados=JSON.parse(raw);}catch(e){throw new Error('Dados inválidos em otica_'+k);}
    if(!Array.isArray(dados)||dados.some(r=>r===null||typeof r!=='object'||Array.isArray(r)))throw new Error('Coleção inválida em otica_'+k);
    return dados;
  },
  set(k,v){
    DB.get(k); // Não sobrescrever uma coleção existente que não possa ser lida.
    if(['clientes','vendas','crediario','agenda'].includes(k))verificarIdsUnicos(v);
    localStorage.setItem('otica_'+k,JSON.stringify(v));
  },

function load(k){
  try{
    const salvo=DB.get(k);

    const padrao=defaultData[k];
    return padrao===undefined?[]:JSON.parse(JSON.stringify(padrao));

function exportarBackupDados(){
  const dados={};
  ['clientes','receitas','crediario','vendas','agenda','estoque'].forEach(k=>{
    const salvo=DB.get(k);
    dados[k]=salvo!==null&&salvo!==undefined ? salvo : [];
  });
  const backup={
    sistema:'otica-lclass',
    versaoBackup:1,
    exportadoEm:new Date().toISOString(),
    dados
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='backup-otica-lclass-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

// IDs são opacos: preservar texto completo, inclusive zeros iniciais.
function sameId(a,b){return a!=null&&b!=null&&String(a)===String(b);}
const cadastrosEmConferencia=new Set();
function registroCanonico(valor){
  if(Array.isArray(valor))return '['+valor.map(registroCanonico).join(',')+']';
  if(valor&&typeof valor==='object')return '{'+Object.keys(valor).sort().map(k=>JSON.stringify(k)+':'+registroCanonico(valor[k])).join(',')+'}';
  return JSON.stringify(valor);
}
function verificarIdsUnicos(registros){
  if(!Array.isArray(registros))throw new Error('A coleção deve ser uma lista');
  const ids=new Set();
  registros.forEach(r=>{
    if(!r||typeof r!=='object'||r.id==null||!['string','number'].includes(typeof r.id)||!String(r.id).trim()||(typeof r.id==='number'&&!Number.isSafeInteger(r.id)))throw new Error('Há registro com ID ausente ou inválido. Nenhum registro foi gravado.');
    const id=String(r.id);
    if(ids.has(id))throw new Error('Há IDs repetidos na coleção. Confira os registros antes de continuar.');
    ids.add(id);
  });
}
function textoComparacao(valor){return String(valor??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');}
function telefonesComparacao(r){
  return [r.celular,r.telefone].map(v=>{
    let n=String(v??'').replace(/\D/g,'');
    if([12,13].includes(n.length)&&n.startsWith('55'))n=n.slice(2);
    return n;
  }).filter(n=>n.length>=8);
}
function motivosClienteSemelhante(a,b){
  const motivos=[],cpf=r=>String(r.cpf??'').replace(/\D/g,'');
  if(textoComparacao(a.nome)&&textoComparacao(a.nome)===textoComparacao(b.nome))motivos.push('Nome coincidente');
  if(cpf(a).length===11&&cpf(a)===cpf(b))motivos.push('CPF coincidente');
  if(telefonesComparacao(a).some(t=>telefonesComparacao(b).includes(t)))motivos.push('Telefone coincidente (pode ser compartilhado)');
  return motivos;
}
function clientePossivelmenteIgual(a,b,clientes){
  if(a.clienteId!==undefined&&a.clienteId!==null&&a.clienteId!==''&&sameId(a.clienteId,b.clienteId))return true;
  const ca=clientes.find(c=>sameId(c.id,a.clienteId)),cb=clientes.find(c=>sameId(c.id,b.clienteId));
  return !!(ca&&cb&&motivosClienteSemelhante(ca,cb).length);
}
function motivosRegistroSemelhante(modulo,a,b,clientes=state.clientes){
  if(sameId(a.id,b.id))return ['ID já existente — inclusão bloqueada'];
  if(modulo==='clientes')return motivosClienteSemelhante(a,b);
  const mesmoCliente=clientePossivelmenteIgual(a,b,clientes);
  const descricao=r=>textoComparacao(r.descricao??r.produto??r.tipoExame);
  const mesmoTexto=!!descricao(a)&&descricao(a)===descricao(b);
  const mesmoValor=Number.isFinite(Number(a.total))&&Number.isFinite(Number(b.total))&&Number(a.total)===Number(b.total);
  if(modulo==='vendas'&&mesmoCliente&&((a.data&&a.data===b.data&&(mesmoTexto||mesmoValor))||(mesmoTexto&&mesmoValor)))return ['Cliente coincidente ou semelhante e produto, data ou valor semelhantes; pode ser outra compra legítima'];
  if(modulo==='crediario'&&mesmoCliente&&((a.dataPrimeira&&a.dataPrimeira===b.dataPrimeira&&(mesmoValor||mesmoTexto))||(mesmoTexto&&mesmoValor&&Number(a.parcelas)===Number(b.parcelas))))return ['Cliente coincidente ou semelhante e descrição, total, parcelas ou primeiro vencimento semelhantes'];
  const mesmoNomeLivre=textoComparacao(a.nomeLivre)&&textoComparacao(a.nomeLivre)===textoComparacao(b.nomeLivre);
  if(modulo==='agenda'&&(mesmoCliente||mesmoNomeLivre)&&a.data&&a.data===b.data&&(a.horario===b.horario||mesmoTexto))return ['Mesmo cliente ou nome livre, mesma data e horário ou exame semelhante'];
  return [];
}
function localizarDuplicidades(modulo,registro,lista,clientes=state.clientes,ignorarId){
  return lista.filter(r=>ignorarId===undefined||!sameId(r.id,ignorarId)).map(r=>({registro:r,motivos:motivosRegistroSemelhante(modulo,registro,r,clientes)})).filter(x=>x.motivos.length);
}
function resumoRegistroConferencia(modulo,r){
  const linhas=[['ID',r.id]];
  if(modulo==='clientes')linhas.push(['Nome',r.nome],['CPF',r.cpf],['Nascimento',r.dataNascimento],['Celular',r.celular],['Telefone',r.telefone],['Cidade',r.cidade]);
  else{
    linhas.push(['Cliente ID',r.clienteId],['Cliente',clienteNome(r.clienteId)],['Nome livre',r.nomeLivre],['Data',r.data],['Descrição / produto / exame',r.descricao??r.produto??r.tipoExame]);
    if(modulo==='vendas')linhas.push(['Quantidade',r.qtd??r.quantidade],['Total',fmt(r.total)],['Pagamento',r.forma]);
    if(modulo==='crediario'){
      linhas.push(['Total',fmt(r.total)],['Parcelas',r.parcelas],['Primeiro vencimento',r.dataPrimeira]);
      (r.pagamentos||[]).forEach(p=>linhas.push(['Parcela '+p.num,p.venc+' | '+fmt(p.valor)+' | '+(p.pago?'Paga em '+p.dataPag:'Em aberto')]));
    }
    if(modulo==='agenda')linhas.push(['Horário',r.horario],['Profissional',r.profissional],['Telefone',r.telefone],['Status',r.status]);
    linhas.push(['Observações',r.obs]);
  }
  return linhas.filter(([,v])=>v!==undefined&&v!==null&&v!=='').map(([k,v])=>k+': '+v).join('\n');
}
function painelConferencia(titulo){
  const overlay=document.createElement('div');overlay.className='modal-overlay';
  const box=document.createElement('div');box.className='modal modal-lg';
  const head=document.createElement('div');head.className='modal-header';
  const h=document.createElement('h2');h.textContent=titulo;head.appendChild(h);
  const body=document.createElement('div');body.className='modal-body';
  box.appendChild(head);box.appendChild(body);overlay.appendChild(box);
  document.getElementById('modal-root').appendChild(overlay);
  return {overlay,body};
}

function solicitarConferenciaDuplicidade(modulo,candidato,conflitos,bloqueado){
  return new Promise(resolve=>{
    const p=painelConferencia(bloqueado?'ID já existente — não é possível duplicar':'Possível duplicidade — confira antes de gravar');
    const aviso=document.createElement('p');aviso.textContent=bloqueado?'O ID já pertence a outro registro. Nenhum dado será substituído.':'Coincidências não comprovam duplicidade. Duas compras legítimas podem pertencer ao mesmo cliente. Confira os registros e justifique uma operação distinta.';p.body.appendChild(aviso);
    const novo=document.createElement('pre');novo.style.cssText='white-space:pre-wrap;overflow-wrap:anywhere;font:inherit';novo.textContent='Registro proposto:\n'+resumoRegistroConferencia(modulo,candidato);p.body.appendChild(novo);
    conflitos.forEach(c=>{
      const info=document.createElement('pre');info.style.cssText=novo.style.cssText;info.textContent=c.motivos.join('; ')+'\n'+resumoRegistroConferencia(modulo,c.registro);p.body.appendChild(info);
      const ver=document.createElement('button');ver.className='btn btn-secondary btn-sm';ver.textContent='Ver registro existente';ver.addEventListener('click',()=>mostrarRegistroConferencia(modulo,c.registro));p.body.appendChild(ver);
    });
    const label=document.createElement('label');label.textContent='Justificativa para manter um registro ou operação distinto (mínimo de 10 caracteres)';p.body.appendChild(label);
    const motivo=document.createElement('textarea');motivo.className='inp';motivo.disabled=bloqueado;motivo.maxLength=1000;motivo.setAttribute('aria-label','Justificativa da possível duplicidade');p.body.appendChild(motivo);
    const confirmacao=document.createElement('input');confirmacao.type='checkbox';confirmacao.disabled=bloqueado;
    const confirmarLabel=document.createElement('label');confirmarLabel.appendChild(confirmacao);const texto=document.createElement('span');texto.textContent=' Conferi os dados e confirmo que é um registro ou operação distinto.';confirmarLabel.appendChild(texto);p.body.appendChild(confirmarLabel);
    const footer=document.createElement('div');footer.className='modal-footer';
    const cancelar=document.createElement('button');cancelar.className='btn btn-ghost';cancelar.textContent='Cancelar';
    cancelar.addEventListener('click',()=>{p.overlay.remove();resolve(null);});footer.appendChild(cancelar);
    const prosseguir=document.createElement('button');prosseguir.className='btn btn-primary';prosseguir.textContent='Confirmar mesmo assim';
    const valido=()=>!bloqueado&&confirmacao.checked&&motivo.value.trim().length>=10&&motivo.value.trim().length<=1000;
    const atualizar=()=>{prosseguir.disabled=!valido();};motivo.addEventListener('input',atualizar);confirmacao.addEventListener('change',atualizar);
    prosseguir.addEventListener('click',()=>{if(!valido())return;const justificativa=motivo.value.trim();p.overlay.remove();resolve({justificativa,confirmacaoExplicita:true});});
    atualizar();footer.appendChild(prosseguir);p.body.appendChild(footer);
  });
}
async function gravarRegistroConferido(modulo,registro,editarId){
  if(cadastrosEmConferencia.has(modulo)){showToast('Já há um cadastro deste módulo em conferência','info');return false;}
  cadastrosEmConferencia.add(modulo);
  try{
    const lista=state[modulo],salvo=DB.get(modulo)||[];
    verificarIdsUnicos(lista);verificarIdsUnicos([registro]);
    if(registroCanonico(lista)!==registroCanonico(salvo))throw new Error('Os dados deste módulo mudaram. Recarregue e confira antes de gravar.');
    const snapshot=registroCanonico(lista),editando=editarId!==undefined;
    const clientesSnapshot=modulo==='clientes'?null:registroCanonico(state.clientes);
    if(clientesSnapshot!==null&&registroCanonico(DB.get('clientes')||[])!==clientesSnapshot)throw new Error('Os clientes mudaram. Recarregue e confira os vínculos antes de gravar.');
    if(editando&&(!sameId(registro.id,editarId)||lista.filter(r=>sameId(r.id,editarId)).length!==1))throw new Error('O registro a editar não possui um ID único válido.');
    if(modulo!=='clientes'){
      const temCliente=registro.clienteId!==undefined&&registro.clienteId!==null&&registro.clienteId!=='';
      const anterior=editando?lista.find(r=>sameId(r.id,editarId)):null;
      if(temCliente&&!state.clientes.some(c=>sameId(c.id,registro.clienteId))&&!(anterior&&sameId(anterior.clienteId,registro.clienteId)))throw new Error('Cliente vinculado não encontrado. Nenhum registro foi gravado.');
      if(!temCliente&&(modulo!=='agenda'||!textoComparacao(registro.nomeLivre)))throw new Error('Informe um cliente ou a identificação do agendamento.');
    }
    const conflitos=localizarDuplicidades(modulo,registro,lista,state.clientes,editarId);
    const bloqueado=conflitos.some(c=>sameId(c.registro.id,registro.id));
    let decisao=null;
    if(conflitos.length){decisao=await solicitarConferenciaDuplicidade(modulo,registro,conflitos,bloqueado);if(!decisao||bloqueado)return false;}
    if(registroCanonico(state[modulo])!==snapshot||registroCanonico(DB.get(modulo)||[])!==snapshot)throw new Error('Os dados mudaram durante a conferência. Nada foi gravado; confira novamente.');
    if(clientesSnapshot!==null&&(registroCanonico(state.clientes)!==clientesSnapshot||registroCanonico(DB.get('clientes')||[])!==clientesSnapshot))throw new Error('Os clientes mudaram durante a conferência. Nada foi gravado; confira novamente.');
    let novo={...registro};
    if(decisao){
      if(novo._conferenciasDuplicidade!==undefined&&!Array.isArray(novo._conferenciasDuplicidade))throw new Error('Histórico de conferência inválido. Nenhum dado foi sobrescrito.');
      novo._conferenciasDuplicidade=[...(novo._conferenciasDuplicidade||[]),{em:new Date().toISOString(),operacao:editando?'edicao':'cadastro',justificativa:decisao.justificativa,confirmacaoExplicita:true,registrosConferidos:conflitos.map(c=>({id:c.registro.id,motivos:c.motivos}))}];
    }
    const proxima=editando?lista.map(r=>sameId(r.id,editarId)?novo:r):[...lista,novo];
    verificarIdsUnicos(proxima);save(modulo,proxima);state[modulo]=proxima;
    return true;
  }catch(e){showToast(e.name==='QuotaExceededError'?'Armazenamento local cheio. Nada foi gravado. Preserve o documento original e o backup; não apague dados.':' '+e.message,'error');return false;}
  finally{cadastrosEmConferencia.delete(modulo);}
}
function analisarConciliacaoBackup(backup,destino){
  const modulos=['clientes','vendas','crediario','agenda'];
  const dados=backup?.dados??backup;
  if(!dados||typeof dados!=='object'||Array.isArray(dados)||!modulos.some(k=>Object.prototype.hasOwnProperty.call(dados,k)))throw new Error('Backup sem coleções reconhecidas');
  const atual=destino??Object.fromEntries(modulos.map(k=>[k,DB.get(k)||[]]));
  const rel={somentePrevia:true,importacaoPermitida:false,jaPresentes:[],conflitosId:[],possiveisDuplicidades:[],inclusoesSemAlerta:[],problemas:[],colecoesAusentes:modulos.filter(k=>!Object.prototype.hasOwnProperty.call(dados,k))};
  const origem={};modulos.forEach(k=>{origem[k]=Array.isArray(dados[k])?dados[k]:[];if(dados[k]!==undefined&&!Array.isArray(dados[k]))rel.problemas.push({modulo:k,motivo:'Coleção do backup não é uma lista'});try{verificarIdsUnicos(atual[k]||[]);}catch(e){rel.problemas.push({modulo:k,motivo:'Destino: '+e.message});}});
  const clientes=[...origem.clientes,...(atual.clientes||[])].filter(r=>r&&typeof r==='object');
  modulos.forEach(k=>{
    const vistos=[];
    origem[k].forEach((r,indice)=>{
      try{verificarIdsUnicos([r]);}catch(e){rel.problemas.push({modulo:k,indice,motivo:e.message});return;}
      const repetidos=vistos.filter(v=>sameId(v.id,r.id));
      if(repetidos.length)rel.conflitosId.push({modulo:k,indice,candidato:r,existente:repetidos[0],motivo:'ID repetido dentro do backup; não incluir novamente'});
      const existentes=(atual[k]||[]).filter(v=>sameId(v.id,r.id));
      existentes.forEach(v=>{const item={modulo:k,indice,candidato:r,existente:v};if(registroCanonico(v)===registroCanonico(r))rel.jaPresentes.push(item);else rel.conflitosId.push({...item,motivo:'Mesmo ID com conteúdo ou tipo de ID diferente; sobrescrita bloqueada'});});
      const semelhantes=localizarDuplicidades(k,r,[...(atual[k]||[]),...vistos].filter(v=>!sameId(v.id,r.id)),clientes);
      semelhantes.forEach(v=>rel.possiveisDuplicidades.push({modulo:k,indice,candidato:r,existente:v.registro,motivos:v.motivos}));
      if(!existentes.length&&!repetidos.length&&!semelhantes.length)rel.inclusoesSemAlerta.push({modulo:k,indice,candidato:r});
      if(k!=='clientes'){
        const temCliente=r.clienteId!==undefined&&r.clienteId!==null&&r.clienteId!=='';
        if(temCliente&&!clientes.some(c=>sameId(c.id,r.clienteId)))rel.problemas.push({modulo:k,indice,motivo:'Cliente vinculado não encontrado nas fontes ou destino'});
        if(!temCliente&&(k!=='agenda'||!textoComparacao(r.nomeLivre)))rel.problemas.push({modulo:k,indice,motivo:'Registro sem cliente ou identificação necessária'});
      }
      vistos.push(r);
    });
  });
  return rel;
}

  const aviso=document.createElement('p');aviso.textContent='Importação bloqueada nesta etapa. Antes de qualquer importação futura serão necessários backup do destino, revisão dos conflitos e autorização. Casos históricos pendentes não são resolvidos automaticamente. Coleções ausentes não serão apagadas.';p.body.appendChild(aviso);
  [['Problemas',rel.problemas],['Conflitos de ID — bloqueados',rel.conflitosId],['Possíveis duplicidades — revisão necessária',rel.possiveisDuplicidades],['IDs e registros já presentes — não incluir novamente',rel.jaPresentes],['Candidatos sem alerta — ainda não importados',rel.inclusoesSemAlerta]].forEach(([titulo,lista])=>{

  });

  const [ano,mes,dia] = String(parc.venc).split('-').map(Number);
  const diasAtraso = Math.max(0,Math.round((Date.UTC(hoje.getFullYear(),hoje.getMonth(),hoje.getDate())-Date.UTC(ano,mes-1,dia))/(1000*60*60*24)));
  const linhas = [
    '🏪 *Ótica lclass*',

  ];
  return linhas.join('\n');
}

function normalizarTelefoneBR(tel){
  const texto=String(tel??'').trim();
  if(!texto||!/^\+?[\d\s().-]+$/.test(texto))return '';
  let num=texto.replace(/\D/g,'');
  if(texto.startsWith('+')&&(!num.startsWith('55')||![12,13].includes(num.length)))return '';
  if([12,13].includes(num.length)&&num.startsWith('55'))num=num.slice(2);
  const ddds='11 12 13 14 15 16 17 18 19 21 22 24 27 28 31 32 33 34 35 37 38 41 42 43 44 45 46 47 48 49 51 53 54 55 61 62 63 64 65 66 67 68 69 71 73 74 75 77 79 81 82 83 84 85 86 87 88 89 91 92 93 94 95 96 97 98 99'.split(' ');
  if(!ddds.includes(num.slice(0,2))||!(/^[1-9]\d[2-5]\d{7}$/.test(num)||/^[1-9]\d9\d{8}$/.test(num)))return '';
  return '55'+num;
}
function urlWhatsApp(tel,msg){
  const num=normalizarTelefoneBR(tel);
  return num?'https://wa.me/'+num+'?text='+encodeURIComponent(msg):'';
}
function abrirWhatsApp(){
  const input = document.getElementById(_waTelId);
  const tel = input ? input.value.trim() : '';
  const url = urlWhatsApp(tel,_waMsgAtual);
  if(!url){showToast('Informe um telefone brasileiro válido, com DDD','error');return;}
  // Tenta abrir de várias formas para garantir compatibilidade
  try {
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch(e) {
    window.location.href = url;
  }
  closeModal();
}

function confirmDialog(msg, onYes, isDelete=false){
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal modal-sm';
  
  const header = document.createElement('div');
  header.className = 'modal-header';
  header.innerHTML = isDelete
    ? '<h2 style="color:#ef4444">⚠️ Excluir Registro</h2>'
    : '<h2>Confirmar</h2>';
  const xBtn = document.createElement('button');
  xBtn.className = 'btn btn-ghost btn-sm';
  xBtn.textContent = '✕';
  xBtn.addEventListener('click', closeModal);
  header.appendChild(xBtn);
  
  const body = document.createElement('div');
  body.className = 'modal-body';
  const p = document.createElement('p');
  p.style.cssText = 'color:var(--muted);margin-bottom:16px';
  p.textContent = msg;

  if(isDelete){
    const warn = document.createElement('div');
    warn.style.cssText = 'background:#ef444422;border:1px solid #ef4444;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:#ef4444';
    warn.innerHTML = '🗑️ <strong>Esta ação não pode ser desfeita.</strong> O registro será removido permanentemente.';
    body.appendChild(p);
    body.appendChild(warn);
    const label = document.createElement('p');
    label.style.cssText = 'font-size:12px;color:var(--dim);margin-bottom:6px';
    label.textContent = 'Digite EXCLUIR para confirmar:';
    body.appendChild(label);
    const inp = document.createElement('input');
    inp.className = 'inp';
    inp.placeholder = 'EXCLUIR';
    inp.style.cssText = 'border:1px solid #ef4444;margin-bottom:4px';
    body.appendChild(inp);

    const footer = document.createElement('div');
    footer.className = 'modal-footer';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-ghost';
    cancelBtn.textContent = 'Cancelar';
    cancelBtn.addEventListener('click', closeModal);
    const yesBtn = document.createElement('button');
    yesBtn.className = 'btn btn-danger';
    yesBtn.textContent = '🗑️ Excluir';
    yesBtn.disabled = true;
    yesBtn.style.opacity = '0.4';
    inp.addEventListener('input', ()=>{
      const ok = inp.value.trim().toUpperCase() === 'EXCLUIR';
      yesBtn.disabled = !ok;
      yesBtn.style.opacity = ok ? '1' : '0.4';
    });
    yesBtn.addEventListener('click', ()=>{ closeModal(); onYes(); });
    footer.appendChild(cancelBtn);
    footer.appendChild(yesBtn);
    box.appendChild(header);
    box.appendChild(body);
    box.appendChild(footer);
  } else {
    body.appendChild(p);
    const footer = document.createElement('div');
    footer.className = 'modal-footer';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-ghost';
    cancelBtn.textContent = 'Cancelar';
    cancelBtn.addEventListener('click', closeModal);
    const yesBtn = document.createElement('button');
    yesBtn.className = 'btn btn-primary';
    yesBtn.textContent = 'Confirmar';
    yesBtn.addEventListener('click', ()=>{ closeModal(); onYes(); });
    footer.appendChild(cancelBtn);
    footer.appendChild(yesBtn);
    box.appendChild(header);
    box.appendChild(body);
    box.appendChild(footer);
  }

  overlay.appendChild(box);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
}

function barChart(data,color='#C9A84C'){
  const max=Math.max(...data.map(d=>d.v),1);
  return `<div style="display:flex;align-items:flex-end;gap:4px;height:60px">
    ${data.map(d=>`<div class="bar-col">
      <div class="bar" style="width:100%;background:${color};height:${Math.max(4,(d.v/max)*52)}px;opacity:${d===data[data.length-1]?1:0.5};border-radius:3px 3px 0 0"></div>
      <div style="font-size:9px;color:var(--dim);margin-top:3px">${d.l}</div>
    </div>`).join('')}
  </div>`;
}
function pieChart(data){
  const total=data.reduce((s,d)=>s+d.v,0)||1;
  let cum=-90;
  const slices=data.map(d=>{
    const a=(d.v/total)*360;const s=cum;cum+=a;return{...d,s,a};
  });
  function arc(s,a){
    const r=32,cx=40,cy=40;
    const p2c=(ang)=>({x:cx+r*Math.cos(ang*Math.PI/180),y:cy+r*Math.sin(ang*Math.PI/180)});
    const start=p2c(s+a),end=p2c(s);
    const large=a>180?1:0;
    return `M${cx},${cy} L${start.x},${start.y} A${r},${r},0,${large},0,${end.x},${end.y}Z`;
  }
  return `<div style="display:flex;align-items:center;gap:16px">
    <svg width="80" height="80" viewBox="0 0 80 80">
      ${slices.map(s=>`<path d="${arc(s.s,s.a)}" fill="${s.color}" opacity="0.9"/>`).join('')}
      <circle cx="40" cy="40" r="20" fill="var(--surface)"/>
    </svg>
    <div style="display:flex;flex-direction:column;gap:4px">
      ${data.map(d=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px">
        <div style="width:10px;height:10px;border-radius:2px;background:${d.color};flex-shrink:0"></div>
        <span style="color:var(--muted)">${d.l}</span>
        <span style="color:var(--text);font-weight:700;margin-left:auto">${Math.round((d.v/total)*100)}%</span>
      </div>`).join('')}
    </div>
  </div>`;
}

  consultVirtualFacing=facing;
  if(consultVirtualStream){consultVirtualStream.getTracks().forEach(t=>t.stop());consultVirtualStream=null}
  try{
    consultVirtualStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:consultVirtualFacing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(panel)panel.style.display='block';
    if(video){video.srcObject=consultVirtualStream;video.classList.toggle('front-camera',consultVirtualFacing==='user');await video.play().catch(()=>{});}
    panel?.scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){
    if(consultVirtualFacing==='environment'){
      try{
        consultVirtualFacing='user';
        consultVirtualStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'}},audio:false});
        if(panel)panel.style.display='block';
        if(video){video.srcObject=consultVirtualStream;video.classList.add('front-camera');await video.play().catch(()=>{});}
        showToast('Câmera traseira indisponível; usando frontal','warning');
        return;
      }catch(_){}
    }
    showToast('Não foi possível abrir a câmera. Verifique a permissão do navegador.','error')
  }
}
async function consultSwitchCamera(){
  const next=consultVirtualFacing==='environment'?'user':'environment';
  await consultOpenCamera(next);
}
function consultCloseCamera(){
  if(consultVirtualStream){consultVirtualStream.getTracks().forEach(t=>t.stop());consultVirtualStream=null}
  const panel=document.getElementById('virtual-camera-panel'),video=document.getElementById('virtual-camera-video');
  if(video)video.srcObject=null;if(panel)panel.style.display='none';
}
function consultCaptureCamera(){
  const video=document.getElementById('virtual-camera-video'),canvas=document.getElementById('virtual-camera-canvas');
  if(!video||!canvas||!video.videoWidth){showToast('A câmera ainda não está pronta','error');return}
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  const ctx=canvas.getContext('2d');
  if(consultVirtualFacing==='user'){ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.restore()}
  else ctx.drawImage(video,0,0,canvas.width,canvas.height);
  canvas.toBlob(blob=>{
    if(!blob)return showToast('Não foi possível capturar a foto','error');
    if(consultVirtualPhotoUrl)URL.revokeObjectURL(consultVirtualPhotoUrl);
    consultVirtualPhotoUrl=URL.createObjectURL(blob);
    const img=document.getElementById('virtual-photo'),ph=document.getElementById('virtual-placeholder'),g=document.getElementById('virtual-glasses'),guide=document.getElementById('virtual-face-guide');
    if(img){img.src=consultVirtualPhotoUrl;img.style.display='block'}if(ph)ph.style.display='none';if(g)g.style.display='block';if(guide)guide.classList.add('captured');
    consultCloseCamera();consultVirtualUpdate();showToast('Foto capturada','success');
  },'image/jpeg',.92);
}

function verAniversariantesMes(){
  const hoje=new Date();
  const mesH=hoje.getMonth()+1;
  const lista=state.clientes.filter(c=>c.dataNascimento&&c.status==='Ativo'&&parseInt(c.dataNascimento.split('-')[1])===mesH)
    .sort((a,b)=>parseInt(a.dataNascimento.split('-')[2])-parseInt(b.dataNascimento.split('-')[2]));
  if(lista.length===0)return showToast('Nenhum aniversariante este mês','info');
  const itens=lista.map(c=>{
    const dia=c.dataNascimento.split('-')[2];
    const idade=new Date().getFullYear()-parseInt(c.dataNascimento.split('-')[0]);
    const cel=c.celular||c.telefone||'';

  const input = document.getElementById(inputId);
  if(!input) return;
  if(usarCamera){
    input.setAttribute('capture','environment');
  } else {
    input.removeAttribute('capture');
  }
  input.click();
}

function previewFotoDoc(inputId, previewId){
  const file=document.getElementById(inputId)?.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const div=document.getElementById(previewId);
    if(div)div.innerHTML='<img src="'+e.target.result+'" style="width:100%;border-radius:8px;max-height:120px;object-fit:cover;margin-top:4px"/>';
  };
  reader.readAsDataURL(file);
}
async function lerFoto(inputId){
  const file=document.getElementById(inputId)?.files?.[0];
  if(!file)return null;
  const url=URL.createObjectURL(file);
  try{
    const img=new Image();
    await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(new Error('Não foi possível ler a foto do documento. Selecione outra imagem.'));img.src=url;});
    const canvas=document.createElement('canvas');
    const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));
    canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));
    canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
    const ctx=canvas.getContext('2d');
    if(!ctx)throw new Error('Não foi possível preparar a foto.');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    const result=canvas.toDataURL('image/jpeg',0.78);
    if(!result.startsWith('data:image/jpeg;base64,'))throw new Error('Não foi possível compactar a foto.');
    return result;
  }finally{URL.revokeObjectURL(url);}
}
async function salvarCliente(id){
  const g=x=>document.getElementById(x)?.value?.trim()||'';
  const nome=g('cf_nome'),rua=g('cf_rua'),num=g('cf_num'),bairro=g('cf_bairro'),cidade=g('cf_cidade'),cep=g('cf_cep'),ref=g('cf_ref'),mae=g('cf_mae');
  const tel=g('cf_tel'),cel=g('cf_cel');
  if(!nome)return showToast('Nome é obrigatório','error');
  if(!tel&&!cel)return showToast('Informe pelo menos um contato','error');
  if(!rua||!num||!bairro||!cidade||!cep||!ref||!mae)return showToast('Preencha todos os campos obrigatórios','error');
  let fotoDoc1,fotoDoc2;
  try{fotoDoc1=await lerFoto('cf_foto_doc');fotoDoc2=await lerFoto('cf_foto_doc2');}
  catch(e){showToast(e.message,'error');return;}
  const editando=id!==undefined&&id!==null&&id!==0;
  const cliAnterior=editando?state.clientes.find(c=>sameId(c.id,id)):{};
  if(editando&&!cliAnterior)return showToast('Cliente não encontrado','error');
  const data={
    nome,cpf:g('cf_cpf'),rg:g('cf_rg'),dataNascimento:g('cf_nascimento'),
    telefone:tel,celular:cel,rua,numero:num,complemento:g('cf_comp'),
    bairro,cidade,estado:g('cf_estado'),cep,referencia:ref,mae,pai:g('cf_pai'),status:g('cf_status'),
    fotoDoc:fotoDoc1||cliAnterior.fotoDoc||'',
    fotoDoc2:fotoDoc2||cliAnterior.fotoDoc2||''
  };
  const registro=editando?{...cliAnterior,...data}:{...data,id:uid(),cadastro:today()};
  const gravar=async()=>{
    if(!await gravarRegistroConferido('clientes',registro,editando?id:undefined))return;
    closeModal();renderClientes();showToast(editando?'Cliente atualizado!':'Cliente cadastrado!','success');
  };
  if(editando)confirmDialog('Deseja salvar as alterações neste cliente?',gravar);
  else await gravar();
}

function abrirBuscaArmacaoReceita(){

      (foto?'<img src="'+foto+'" style="width:64px;height:48px;object-fit:contain;background:#fff;border-radius:7px">':'<div style="width:64px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--surface2);border-radius:7px">👓</div>')+
      '<span><b>'+esc(nome)+'</b><br><small style="color:var(--dim)">'+esc(x.marca||'')+(x.cor?' • '+esc(x.cor):'')+'</small></span><span class="badge badge-green">'+Number(x.qtd??x.quantidade??0)+' disp.</span></button>';
  }).join(''):'<div class="empty"><div class="empty-icon">👓</div><p>Nenhuma armação disponível no estoque.</p></div>';

function salvarReceita(id){
  const g=x=>document.getElementById(x)?.value?.trim()||'';
  const clienteId=g('rf_cli'), profissional=g('rf_prof'), validade=g('rf_val');
  if(!clienteId)return showToast('Selecione o cliente','error');
  if(!profissional)return showToast('Informe o profissional','error');
  if(!validade)return showToast('Informe a validade da receita','error');
  const ativa=!!document.getElementById('rf_ativa')?.checked;
  if(ativa) state.receitas=state.receitas.map(x=>({...x,ativa:false}));
  const anterior=id?state.receitas.find(x=>String(x.id)===String(id)):null;
  const data={...(anterior||{}),id:anterior?.id||uid(),clienteId:clienteId,profissional,validade,...(window.LclassCommercial?.recipeMetadata?.()||{}),data:anterior?.data||today(),
    odEsfera:g('rf_odEsfera'),odCilindro:g('rf_odCilindro'),odEixo:g('rf_odEixo'),odAdicao:g('rf_odAdicao'),odDnp:g('rf_odDnp'),
    oeEsfera:g('rf_oeEsfera'),oeCilindro:g('rf_oeCilindro'),oeEixo:g('rf_oeEixo'),oeAdicao:g('rf_oeAdicao'),oeDnp:g('rf_oeDnp'),
    obs:g('rf_obs'),tipoLente:g('rf_tipo_lente'),dpDir:g('rf_dpD'),coDir:g('rf_coD'),dpEsq:g('rf_dpE'),coEsq:g('rf_coE'),dpLonge:g('rf_dpL'),dpPerto:g('rf_dpP'),
    foto:document.getElementById('rf_foto_hidden')?.value||anterior?.foto||'',ativa};
  if(anterior) state.receitas=state.receitas.map(x=>String(x.id)===String(id)?data:x); else state.receitas.push(data);
  saveAll();closeModal();renderReceituario();showToast(anterior?'Receita atualizada!':'Receita salva!','success');
}
let _cameraStream = null;

function toggleGrade(){
  const checked = document.getElementById('rf_usar_grade')?.checked;
  const overlay = document.getElementById('rf_grade_overlay');
  if(!overlay) return;
  if(checked){
    overlay.style.display = 'block';
    iniciarCamera();
  } else {
    overlay.style.display = 'none';
    fecharCamera();
  }
}

async function iniciarCamera(){
  const video = document.getElementById('rf_camera_live');
  const canvas = document.getElementById('rf_grade_canvas');
  if(!video || !canvas) return;
  try {
    _cameraStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{exact:'environment'}, width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = _cameraStream;
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      desenharGradeCanvas(canvas);
    };
  } catch(err){
    // Camera denied - show fullscreen guide overlay instead
    mostrarGradeGuia();
  }
}

function mostrarGradeGuia(){
  const existing = document.getElementById('grade_guia_fullscreen');
  if(existing) existing.remove();

  const overlay = document.createElement('div');
  overlay.id = 'grade_guia_fullscreen';
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:9999;display:flex;flex-direction:column';

  // Container do video + canvas sobrepostos
  const videoWrap = document.createElement('div');
  videoWrap.style.cssText = 'position:relative;flex:1;overflow:hidden;background:#000';

  // Video ao vivo (câmera frontal como espelho)
  const video = document.createElement('video');
  video.id = 'grade_video_live';
  video.autoplay = true;
  video.playsInline = true;
  video.muted = true;
  video.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)'; // espelho
  videoWrap.appendChild(video);

  // Canvas da grade transparente sobre o video
  const canvas = document.createElement('canvas');
  canvas.id = 'grade_canvas_live';
  canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
  videoWrap.appendChild(canvas);

  // Instrução no topo
  const topBar = document.createElement('div');
  topBar.style.cssText = 'position:absolute;top:0;left:0;right:0;background:rgba(0,0,0,0.6);padding:10px;text-align:center;z-index:2';
  topBar.innerHTML = '<p style="margin:0;color:#10b981;font-size:13px;font-weight:700">👁 Alinhe os olhos nos círculos verdes</p><p style="margin:2px 0 0;color:#94a3b8;font-size:11px">Cliente de frente, olhando para a câmera</p>';
  videoWrap.appendChild(topBar);

  overlay.appendChild(videoWrap);

  // Barra inferior com botão
  const bottomBar = document.createElement('div');
  bottomBar.style.cssText = 'background:#0f172a;border-top:1px solid #1e293b;padding:14px 16px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap';

  // Switch camera button
  const switchBtn = document.createElement('button');
  switchBtn.className = 'btn btn-ghost';
  switchBtn.style.cssText = 'font-size:13px;padding:10px 16px';
  switchBtn.innerHTML = '🔄 Trocar Câmera';
  switchBtn.addEventListener('click', function(){
    const currentStream = overlay._stream;
    if(!currentStream) return;
    const track = currentStream.getVideoTracks()[0];
    const settings = track ? track.getSettings() : {};
    const isFront = settings.facingMode === 'user';
    currentStream.getTracks().forEach(function(t){ t.stop(); });
    const newMode = isFront ? {exact:'environment'} : 'user';
    navigator.mediaDevices.getUserMedia({video:{facingMode:newMode}})
      .then(function(stream){
        video.srcObject = stream;
        video.style.transform = isFront ? '' : 'scaleX(-1)';
        overlay._stream = stream;
        showToast(isFront ? 'Câmera traseira ativada' : 'Câmera frontal ativada', 'info');
      })
      .catch(function(){
        navigator.mediaDevices.getUserMedia({video:{facingMode: isFront ? 'environment' : 'user'}})
          .then(function(stream){
            video.srcObject = stream;
            video.style.transform = isFront ? '' : 'scaleX(-1)';
            overlay._stream = stream;
          })
          .catch(function(){ showToast('Não foi possível trocar de câmera','error'); });
      });
  });

  const captureBtn = document.createElement('button');
  captureBtn.className = 'btn btn-primary';
  captureBtn.style.cssText = 'font-size:14px;padding:12px 28px';
  captureBtn.innerHTML = '📸 Capturar esta posição';
  captureBtn.addEventListener('click', () => {
    // Capturar frame do video sem a grade
    const v = document.getElementById('grade_video_live');
    if(v && v.srcObject){
      const tmp = document.createElement('canvas');
      tmp.width = v.videoWidth || 1280;
      tmp.height = v.videoHeight || 720;
      const ctx = tmp.getContext('2d');
      ctx.drawImage(v,0,0,tmp.width,tmp.height);
      const b64 = tmp.toDataURL('image/jpeg',0.90);
      const hidden=document.getElementById('rf_foto_hidden');
      if(!hidden){showToast('Não foi possível vincular a foto à medição','error');return;}
      hidden.value = b64;
      // Mostra preview
      const prev = document.getElementById('rf_foto_preview');
      if(prev){
        prev.innerHTML='';
        const wrap=document.createElement('div');
        wrap.style.cssText='position:relative;width:100%';
        const img=document.createElement('img');
        img.src=b64;
        img.style.cssText='width:100%;max-height:260px;object-fit:cover;border-radius:10px;border:2px solid #C9A84C';
        const rm=document.createElement('button');
        rm.textContent='✕';
        rm.style.cssText='position:absolute;top:8px;right:8px;background:rgba(239,68,68,.9);border:none;border-radius:50%;width:28px;height:28px;color:white;cursor:pointer;font-size:15px;font-weight:700';
        rm.addEventListener('click',()=>{document.getElementById('rf_foto_hidden').value='';prev.innerHTML='';const b=document.getElementById('btn_analisar_ia');if(b)b.style.display='none';});
        wrap.appendChild(img);wrap.appendChild(rm);prev.appendChild(wrap);
      }
      const btn=document.getElementById('btn_analisar_ia');
      if(btn) btn.style.display='inline-flex';
      showToast('Foto capturada. Informe a referência e toque em Medir sem IA.','success');
    }
    fecharGradeGuia();
  });

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-ghost';
  cancelBtn.style.cssText = 'font-size:13px;padding:10px 20px';
  cancelBtn.innerHTML = '✕ Cancelar';
  cancelBtn.addEventListener('click', () => {
    fecharGradeGuia();
    // Fallback: abrir câmera normal
    document.getElementById('rf_foto_file')?.click();
  });

  bottomBar.appendChild(captureBtn);
  bottomBar.appendChild(switchBtn);
  bottomBar.appendChild(cancelBtn);
  overlay.appendChild(bottomBar);
  document.body.appendChild(overlay);

  // Câmera traseira - atendente aponta para o cliente
  const tryCamera = function(facingMode, mirror) {
    return navigator.mediaDevices.getUserMedia({
      video:{ facingMode: {exact: facingMode}, width:{ideal:1280}, height:{ideal:720} }
    }).then(function(stream) {
      video.srcObject = stream;
      // Rear camera (environment) = no mirror. Front (user) = mirror
      video.style.transform = (facingMode==='user') ? 'scaleX(-1)' : '';
      overlay._stream = stream;
      return new Promise(function(resolve) {
        video.onloadedmetadata = function() {
          canvas.width = video.videoWidth || 640;
          canvas.height = video.videoHeight || 480;
          desenharGradeCanvas(canvas);
          resolve();
        };
      });
    });
  };

  // Câmera traseira - atendente aponta para o cliente
  // Sempre inicia na câmera TRASEIRA - sem fallback para frontal
  tryCamera('environment', false)
    .catch(function(){
      return navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
        .then(function(stream){
          video.srcObject=stream;
          video.style.transform='';
          overlay._stream=stream;
          return new Promise(function(resolve){
            video.onloadedmetadata=function(){
              canvas.width=video.videoWidth||640;
              canvas.height=video.videoHeight||480;
              desenharGradeCanvas(canvas);
              resolve();
            };
          });
        });
    })
    .catch(function(){
      fecharGradeGuia();
      showToast('Câmera traseira não disponível. Use Tirar Foto.','error');
      var btn=document.getElementById('rf_foto_file');
      if(btn) btn.click();
    });
}

function fecharGradeGuia(){
  const overlay = document.getElementById('grade_guia_fullscreen');
  if(overlay){
    if(overlay._stream) overlay._stream.getTracks().forEach(t=>t.stop());
    overlay.remove();
  }
  const gr=document.getElementById('rf_usar_grade'); if(gr) gr.checked=false;
  const go=document.getElementById('rf_grade_overlay'); if(go) go.style.display='none';
}

function desenharGradeCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  const eyeY = h * 0.40;
  const eyeR = Math.min(w,h) * 0.07; // Círculos menores
  const eyeL = w * 0.38;  // OE mais próximo do centro
  const eyeR2 = w * 0.62; // OD mais próximo do centro

  // Grade central suave
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,eyeY); ctx.lineTo(w,eyeY); ctx.stroke();

  function circulo(x, y, r, label){
    // Círculo pulsante visual
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = Math.max(2, w*0.004);
    ctx.setLineDash([Math.max(6,w*0.015), Math.max(4,w*0.01)]);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    // Ponto central
    ctx.fillStyle = '#10b981';
    ctx.beginPath(); ctx.arc(x,y,Math.max(5,w*0.008),0,Math.PI*2); ctx.fill();
    // Mira
    ctx.strokeStyle = 'rgba(16,185,129,0.55)';
    ctx.lineWidth = Math.max(1.5,w*0.003);
    ctx.beginPath(); ctx.moveTo(x-r*1.4,y); ctx.lineTo(x+r*1.4,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-r*1.4); ctx.lineTo(x,y+r*1.4); ctx.stroke();
    // Label
    ctx.fillStyle = '#10b981';
    ctx.font = 'bold '+Math.round(Math.max(14,w*0.032))+'px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.fillText(label, x, y+r+Math.max(18,w*0.04));
    ctx.shadowBlur = 0;
  }

  circulo(eyeL, eyeY, eyeR, 'OE');
  circulo(eyeR2, eyeY, eyeR, 'OD');

  // Linha DP
  ctx.strokeStyle = '#818cf8';
  ctx.lineWidth = Math.max(2,w*0.003);
  ctx.setLineDash([Math.max(8,w*0.018),Math.max(5,w*0.01)]);
  ctx.beginPath(); ctx.moveTo(eyeL,eyeY); ctx.lineTo(eyeR2,eyeY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#818cf8';
  ctx.font = 'bold '+Math.round(Math.max(13,w*0.028))+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor='#000'; ctx.shadowBlur=4;
  ctx.fillText('← DP →', w/2, eyeY - eyeR*0.5);
  ctx.shadowBlur=0;

  // Linha CO
  const coX = eyeL - eyeR*1.8;
  ctx.strokeStyle = '#C9A84C';
  ctx.lineWidth = Math.max(2,w*0.003);
  ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(coX,eyeY); ctx.lineTo(coX,h*0.80); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#C9A84C';
  const asz = Math.max(6,w*0.01);
  ctx.beginPath(); ctx.moveTo(coX-asz,h*0.78); ctx.lineTo(coX,h*0.83); ctx.lineTo(coX+asz,h*0.78); ctx.fill();
  ctx.font = 'bold '+Math.round(Math.max(12,w*0.026))+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor='#000'; ctx.shadowBlur=4;
  ctx.fillText('CO', coX, eyeY+(h*0.80-eyeY)/2+5);
  ctx.shadowBlur=0;
}

function fecharCamera(){
  if(_cameraStream){
    _cameraStream.getTracks().forEach(t => t.stop());
    _cameraStream = null;
  }
  const video = document.getElementById('rf_camera_live');
  if(video) video.srcObject = null;
  fecharGradeGuia();
}

function desenharGradeCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  // Posições dos olhos (proporção do rosto típico)
  const eyeY = h * 0.42;
  const eyeR = w * 0.09;
  const eyeOE = w * 0.35; // olho esquerdo (direita da tela = OE do cliente)
  const eyeOD = w * 0.65; // olho direito (esquerda da tela = OD do cliente)
  const dash = [8, 5];

  // Grade de fundo
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,eyeY); ctx.lineTo(w,eyeY); ctx.stroke();

  // Círculo OE
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3;
  ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(eyeOE, eyeY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#10b981';
  ctx.beginPath(); ctx.arc(eyeOE, eyeY, 6, 0, Math.PI*2); ctx.fill();
  // Mira OE
  ctx.strokeStyle = 'rgba(16,185,129,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(eyeOE-eyeR*1.3,eyeY); ctx.lineTo(eyeOE+eyeR*1.3,eyeY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(eyeOE,eyeY-eyeR*1.3); ctx.lineTo(eyeOE,eyeY+eyeR*1.3); ctx.stroke();
  // Label OE
  ctx.fillStyle = '#10b981';
  ctx.font = 'bold '+Math.round(w*0.035)+'px DM Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('OE', eyeOE, eyeY + eyeR + w*0.045);

  // Círculo OD
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3;
  ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(eyeOD, eyeY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#10b981';
  ctx.beginPath(); ctx.arc(eyeOD, eyeY, 6, 0, Math.PI*2); ctx.fill();
  // Mira OD
  ctx.strokeStyle = 'rgba(16,185,129,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(eyeOD-eyeR*1.3,eyeY); ctx.lineTo(eyeOD+eyeR*1.3,eyeY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(eyeOD,eyeY-eyeR*1.3); ctx.lineTo(eyeOD,eyeY+eyeR*1.3); ctx.stroke();
  // Label OD
  ctx.fillStyle = '#10b981';
  ctx.font = 'bold '+Math.round(w*0.035)+'px DM Sans, sans-serif';
  ctx.fillText('OD', eyeOD, eyeY + eyeR + w*0.045);

  // Linha DP entre pupilas
  ctx.strokeStyle = '#818cf8';
  ctx.lineWidth = 2;
  ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.moveTo(eyeOE,eyeY); ctx.lineTo(eyeOD,eyeY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#818cf8';
  ctx.font = 'bold '+Math.round(w*0.03)+'px DM Sans, sans-serif';
  ctx.fillText('← DP →', w/2, eyeY - eyeR*0.4);

  // Linha CO/Altura (vertical da pupila até base)
  const coX = eyeOE - eyeR*1.8;
  ctx.strokeStyle = '#C9A84C';
  ctx.lineWidth = 2;
  ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(coX, eyeY); ctx.lineTo(coX, h*0.82); ctx.stroke();
  ctx.setLineDash([]);
  // Seta
  ctx.fillStyle = '#C9A84C';
  ctx.beginPath(); ctx.moveTo(coX-6, h*0.80); ctx.lineTo(coX, h*0.85); ctx.lineTo(coX+6, h*0.80); ctx.fill();
  ctx.font = 'bold '+Math.round(w*0.028)+'px DM Sans, sans-serif';
  ctx.fillText('CO/Alt', coX, eyeY + (h*0.82-eyeY)/2 + 5);

  // Instrução no topo
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, w, h*0.12);
  ctx.fillStyle = '#10b981';
  ctx.font = 'bold '+Math.round(w*0.032)+'px DM Sans, sans-serif';
  ctx.fillText('Alinhe os olhos nos círculos verdes', w/2, h*0.08);
}

function capturarFotoComGrade(){
  const video = document.getElementById('rf_camera_live');
  if(!video || !video.srcObject){ showToast('Câmera não ativa','error'); return; }
  
  // Capture video frame WITHOUT the overlay grid
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = video.videoWidth || 1280;
  tempCanvas.height = video.videoHeight || 720;
  const ctx = tempCanvas.getContext('2d');
  ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
  
  const base64 = tempCanvas.toDataURL('image/jpeg', 0.92);
  document.getElementById('rf_foto_hidden').value = base64;
  
  // Show preview
  const prev = document.getElementById('rf_foto_preview');
  if(prev){
    prev.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:relative;width:100%;margin-bottom:8px';
    const img = document.createElement('img');
    img.src = base64;
    img.style.cssText = 'width:100%;max-height:260px;object-fit:cover;border-radius:10px;border:2px solid #C9A84C';
    const removeBtn = document.createElement('button');
    removeBtn.textContent = '✕';
    removeBtn.style.cssText = 'position:absolute;top:8px;right:8px;background:rgba(239,68,68,.9);border:none;border-radius:50%;width:28px;height:28px;color:white;cursor:pointer;font-size:15px;font-weight:700';
    removeBtn.addEventListener('click',()=>{ 
      document.getElementById('rf_foto_hidden').value=''; 
      prev.innerHTML='';
      const btn=document.getElementById('btn_analisar_ia');
      if(btn) btn.style.display='none';
    });
    wrap.appendChild(img); wrap.appendChild(removeBtn); prev.appendChild(wrap);
  }

  // Fechar câmera e mostrar botão analisar
  fecharCamera();
  const btn = document.getElementById('btn_analisar_ia');
  if(btn) btn.style.display = 'inline-flex';
  showToast('Foto pronta. Use Medir sem IA. A análise com IA estará disponível quando o serviço for ativado.','success');
}

function sugerirLentes(){
  const g = x => parseFloat(document.getElementById(x)?.value || '0') || 0;
  const odEsf = g('rf_odEsfera'), odCil = g('rf_odCilindro'), odAdd = g('rf_odAdicao');
  const oeEsf = g('rf_oeEsfera'), oeCil = g('rf_oeCilindro'), oeAdd = g('rf_oeAdicao');
  const div = document.getElementById('rf_sugestoes');
  if(!div) return;

  // Use the higher absolute value between eyes
  const maxEsf = Math.max(Math.abs(odEsf), Math.abs(oeEsf));
  const maxCil = Math.max(Math.abs(odCil), Math.abs(oeCil));
  const maxAdd = Math.max(Math.abs(odAdd), Math.abs(oeAdd));
  const temAdd = maxAdd > 0;
  const temCil = maxCil > 0;

  if(maxEsf === 0 && maxCil === 0) {
    div.innerHTML = '<div style="padding:10px;text-align:center;color:var(--dim);font-size:12px;background:var(--surface2);border-radius:8px">Preencha os graus acima para ver sugestões</div>';
    return;
  }

  // Tipo selecionado pelo atendente tem prioridade
  const tipoSelecionado = document.getElementById('rf_tipo_lente')?.value || '';

  // Auto-detect se não selecionado
  let tipoAuto = 'Visão Simples';
  if(temAdd) tipoAuto = 'Progressiva';
  const tipo = tipoSelecionado || tipoAuto;

  // Filter compatible lenses using selected tipo
  const sugestoes = TABELA_LAB.filter(item => {
    if(item.tipo === 'Servico' || item.tipo === 'Tratamento AR') return false;
    if(tipoSelecionado) {
      // Filtro exato pelo tipo selecionado
      return item.tipo === tipoSelecionado;
    } else {
      // Auto-detect: inclui tipos relacionados
      if(temAdd) return item.tipo === 'Progressiva' || item.tipo === 'Multifocal' || item.tipo === 'Bifocal';
      return item.tipo === 'Visão Simples';
    }
  });

  if(sugestoes.length === 0) {
    div.innerHTML = '<div style="padding:10px;text-align:center;color:var(--dim);font-size:12px">Nenhuma sugestão disponível para esses graus</div>';

  if(add_str) html += ' &nbsp;|&nbsp; Add: <strong>'+maxAdd.toFixed(2)+'</strong>';
  html += '</div>';

  html += '<div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">';
  html += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  html += '<thead><tr style="background:var(--surface);position:sticky;top:0;z-index:1">';
  html += '<th style="padding:7px 10px;text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase">COD</th>';
  html += '<th style="padding:7px 10px;text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase">Lente</th>';
  html += '<th style="padding:7px 10px;text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase">Material</th>';
  html += '<th style="padding:7px 10px;text-align:right;color:#C9A84C;font-size:10px;text-transform:uppercase">Ante Risco</th>';
  html += '<th style="padding:7px 10px;text-align:right;color:#818cf8;font-size:10px;text-transform:uppercase">AR Blue</th>';
  html += '</tr></thead><tbody>';

    sugestoes.forEach((item, i) => {
    const bg = i % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.02)';
    const precoFmt = 'R$ ' + item.ar_risco.toFixed(2).replace('.',',');

  html += '</tbody></table></div>';

  div.querySelectorAll('.lente-row').forEach(function(row) {

function abrirCameraGuia(){

  ov.appendChild(gc);

  // Instrução
  var inf=document.createElement('div');
  inf.style.cssText='position:absolute;bottom:110px;left:0;right:0;z-index:3;text-align:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 2px 8px #000;pointer-events:none;padding:0 16px;';
  inf.textContent='Prefira foto vertical 3:4. Mostre os dois olhos e toda a armação. Guia apenas ilustrativo.';
  ov.appendChild(inf);

  // Barra botões — z-index alto, bem acima do canvas
  var bar=document.createElement('div');
  bar.style.cssText='position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 20px 24px;background:rgba(0,0,0,0.85);gap:12px;';
  ov.appendChild(bar);

  function fecharCam(){
    if(vid.srcObject) vid.srcObject.getTracks().forEach(function(t){t.stop();});
    var o=document.getElementById('cam-guia-overlay');
    if(o) o.remove();
  }

  var btnSair=document.createElement('button');
  btnSair.style.cssText='font-size:15px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);cursor:pointer;min-width:70px;';
  btnSair.textContent='✕ Sair';
  btnSair.addEventListener('touchend',function(e){e.preventDefault();fecharCam();});
  btnSair.addEventListener('click',fecharCam);
  bar.appendChild(btnSair);

  var btnFoto=document.createElement('button');
  btnFoto.style.cssText='font-size:18px;padding:18px 0;border-radius:50px;background:#C9A84C;color:#000;border:none;cursor:pointer;font-weight:900;flex:1;max-width:200px;';
  btnFoto.textContent='📸 Capturar';
  btnFoto.addEventListener('touchend',function(e){
    e.preventDefault();
    e.stopPropagation();
    tirarFotoGuia(vid);
    fecharCam();
  });
  btnFoto.addEventListener('click',function(e){
    e.stopPropagation();
    tirarFotoGuia(vid);
    fecharCam();
  });
  bar.appendChild(btnFoto);

  var btnGal=document.createElement('button');
  btnGal.style.cssText='font-size:15px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);cursor:pointer;min-width:70px;';
  btnGal.textContent='🖼️ Galeria';
  btnGal.addEventListener('touchend',function(e){e.preventDefault();fecharCam();document.getElementById('rf_foto_gallery').click();});
  btnGal.addEventListener('click',function(){fecharCam();document.getElementById('rf_foto_gallery').click();});
  bar.appendChild(btnGal);

  // Iniciar câmera
  navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'},width:{ideal:960},height:{ideal:1280},aspectRatio:{ideal:0.75}}})
  .catch(function(){return navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:960},height:{ideal:1280},aspectRatio:{ideal:0.75}}});})
  .then(function(stream){
    vid.srcObject=stream;
    vid.play();
    // Desenhar guia em loop
    function drawGuide(){
      if(!document.getElementById('cam-guia-overlay')) return;
      var vw=ov.offsetWidth||window.innerWidth;
      var vh=ov.offsetHeight||window.innerHeight;
      gc.width=vw; gc.height=vh;
      var ctx=gc.getContext('2d');
      ctx.clearRect(0,0,vw,vh);
      var cx=vw/2, cy=vh*0.40;
      var ow=vw*0.78, oh=(vh-120)*0.78;
      // Escurecer fora do oval
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,vw,vh);
      ctx.globalCompositeOperation='destination-out';
      ctx.beginPath(); ctx.ellipse(cx,cy,ow/2,oh/2,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      // Borda oval
      ctx.strokeStyle='#C9A84C'; ctx.lineWidth=3; ctx.setLineDash([12,5]);
      ctx.beginPath(); ctx.ellipse(cx,cy,ow/2,oh/2,0,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      // Linha olhos
      var ey=cy-oh*0.08;
      ctx.strokeStyle='rgba(100,180,255,0.85)'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(cx-ow*0.46,ey); ctx.lineTo(cx+ow*0.46,ey); ctx.stroke();
      ctx.setLineDash([]);
      // Círculos pupilas
      var eOD=cx-ow*0.22, eOE=cx+ow*0.22, er=ow*0.065;
      [eOD,eOE].forEach(function(ex){
        ctx.strokeStyle='rgba(100,180,255,0.9)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(ex,ey,er,0,Math.PI*2); ctx.stroke();
        ctx.strokeStyle='rgba(100,180,255,0.7)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(ex-er*0.6,ey); ctx.lineTo(ex+er*0.6,ey);
        ctx.moveTo(ex,ey-er*0.6); ctx.lineTo(ex,ey+er*0.6); ctx.stroke();
      });
      // Labels OD OE
      ctx.font='bold 12px sans-serif'; ctx.fillStyle='rgba(100,200,255,0.9)'; ctx.textAlign='center';
      ctx.fillText('OD',eOD,ey-er-6); ctx.fillText('OE',eOE,ey-er-6);
      // Linha nariz
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.moveTo(cx,cy-oh*0.44); ctx.lineTo(cx,cy+oh*0.44); ctx.stroke();
      ctx.setLineDash([]);
      // Cantos
      var cs=18;
      [[cx-ow/2,cy-oh/2,1,1],[cx+ow/2,cy-oh/2,-1,1],[cx-ow/2,cy+oh/2,1,-1],[cx+ow/2,cy+oh/2,-1,-1]]
      .forEach(function(c){
        ctx.strokeStyle='#C9A84C'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(c[0]+c[2]*cs,c[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(c[0],c[1]+c[3]*cs); ctx.stroke();
      });
      requestAnimationFrame(drawGuide);
    }
    requestAnimationFrame(drawGuide);
  }).catch(function(err){
    fecharCam();
    showToast('Erro câmera: '+err.message,'error');
    document.getElementById('rf_foto_file').click();
  });
}

function tirarFotoGuia(vid){

  }
}

function configurarMedicaoManualSemIA(){
  const img=document.getElementById('manual_pup_img'),cv=document.getElementById('manual_pup_canvas'); if(!img||!cv)return;
  const nomes=['Centro da pupila — esquerda da FOTO','Centro da pupila — direita da FOTO','Lente esquerda da FOTO — extremo esquerdo','Lente esquerda da FOTO — extremo direito','Lente direita da FOTO — extremo esquerdo','Lente direita da FOTO — extremo direito','Lente esquerda da FOTO — topo','Lente esquerda da FOTO — base','Lente direita da FOTO — topo','Lente direita da FOTO — base'];
  const start=()=>{cv.width=img.naturalWidth||1000;cv.height=img.naturalHeight||700;window._manualPup={p:[],nomes};
    const lupa=document.getElementById('manual_pup_lupa'),lc=document.getElementById('manual_pup_lupa_canvas'),stage=document.getElementById('manual_pup_stage'),seta=document.getElementById('manual_pup_seta');

      else if(passo===1){x=70;y=40;}
      else if(passo===2){

      }
      else if(passo===3){
        x=Math.min(95,p[0].x*100+18);y=p[0].y*100;simbolo='⬅';
      }
      else if(passo===4){
        x=Math.max(5,p[1].x*100-18);y=p[1].y*100;simbolo='➡';
      }
      else if(passo===5){
        x=Math.min(95,p[1].x*100+18);y=p[1].y*100;simbolo='⬅';
      }
      else if(passo===6){
        x=p[0].x*100;y=Math.max(8,p[0].y*100-15);simbolo='⬇';
      }
      else if(passo===7){
        x=p[0].x*100;y=Math.min(92,p[0].y*100+18);simbolo='⬆';
      }
      else if(passo===8){
        x=p[1].x*100;y=Math.max(8,p[1].y*100-15);simbolo='⬇';
      }
      else if(passo===9){
        x=p[1].x*100;y=Math.min(92,p[1].y*100+18);simbolo='⬆';
      }

      seta.textContent=simbolo;
      seta.style.display='block';
      seta.style.left=x+'%';
      seta.style.top=y+'%';
    };
    window._manualPup.atualizarSeta=atualizarSeta;
    atualizarSeta(0);
    const atualizarLupa=ev=>{if(!lupa||!lc||!stage)return;const b=cv.getBoundingClientRect(),sb=stage.getBoundingClientRect(),cx=(ev.clientX-b.left)/b.width*cv.width,cy=(ev.clientY-b.top)/b.height*cv.height,ctx=lc.getContext('2d'),zoom=3.2,sw=lc.width/zoom,sh=lc.height/zoom;ctx.clearRect(0,0,lc.width,lc.height);ctx.drawImage(img,cx-sw/2,cy-sh/2,sw,sh,0,0,lc.width,lc.height);const lx=Math.max(6,Math.min(sb.width-138,(ev.clientX-sb.left)+24)),ly=Math.max(6,Math.min(sb.height-138,(ev.clientY-sb.top)-150));lupa.style.left=lx+'px';lupa.style.top=ly+'px';lupa.style.display='block';};

      const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);window._manualPup.p.forEach((q,i)=>{const x=q.x*cv.width,y=q.y*cv.height;ctx.beginPath();ctx.arc(x,y,Math.max(7,cv.width*.009),0,Math.PI*2);ctx.strokeStyle='#e30613';ctx.lineWidth=Math.max(3,cv.width*.003);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold '+Math.max(12,cv.width*.014)+'px sans-serif';ctx.fillText(String(i+1),x+10,y-8);});
      const n=window._manualPup.p.length,ins=document.getElementById('manual_pup_instr'),ok=document.getElementById('manual_pup_ok');if(n<10){ins.innerHTML='<span style="display:block;color:#e30613;font-size:13px;margin-bottom:3px">PASSO '+(n+1)+' DE 10</span>TOQUE: '+nomes[n].toUpperCase()+'<span style="display:block;font-size:11px;font-weight:600;color:#666;margin-top:5px">Não precisa decorar a sequência. O próximo ponto será mostrado automaticamente.</span>';if(ok){ok.disabled=true;ok.textContent='Calcular medidas';}}else{ins.innerHTML='<span style="display:block;color:#16a34a;font-size:13px;margin-bottom:3px">10 PONTOS CONCLUÍDOS</span>CONFIRA OS PONTOS NA FOTO<span style="display:block;font-size:11px;font-weight:600;color:#666;margin-top:5px">Se algum estiver errado, use Desfazer. Se estiver correto, toque em Calcular medidas.</span>';if(ok){ok.disabled=false;ok.textContent='Calcular medidas';}}
    };
