   +'<div style="position:relative;border:2px solid #e30613;border-radius:10px;overflow:hidden"><img id="manual_pup_img" src="'+base64+'" style="display:block;width:100%;height:auto"><canvas id="manual_pup_canvas" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas></div>'
   +'<div class="modal-footer"><button id="manual_pup_cancelar" type="button" class="btn btn-ghost">Cancelar</button><button id="manual_pup_ok" type="button" class="btn btn-primary" disabled>Calcular medidas</button></div></div>';
  showModal(html,'modal-lg');
  setTimeout(()=>{configurarMedicaoManualSemIA();const cancelar=document.getElementById('manual_pup_cancelar'),calcular=document.getElementById('manual_pup_ok');if(cancelar)cancelar.addEventListener('click',()=>closeModal());if(calcular)calcular.addEventListener('click',()=>concluirMedicaoManualSemIA());},80);
}
function configurarMedicaoManualSemIA(){
  const img=document.getElementById('manual_pup_img'),cv=document.getElementById('manual_pup_canvas'); if(!img||!cv)return;
  const nomes=['Centro da pupila OD','Centro da pupila OE','Lente OD — borda esquerda','Lente OD — borda direita','Lente OE — borda esquerda','Lente OE — borda direita','Topo da lente OD','Base da lente OD','Topo da lente OE','Base da lente OE'];
  const start=()=>{cv.width=img.naturalWidth||1000;cv.height=img.naturalHeight||700;window._manualPup={p:[],nomes};
    cv.onclick=ev=>{if(window._manualPup.p.length>=10)return;const b=cv.getBoundingClientRect();const p={x:(ev.clientX-b.left)/b.width,y:(ev.clientY-b.top)/b.height};window._manualPup.p.push(p);
      const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);window._manualPup.p.forEach((q,i)=>{const x=q.x*cv.width,y=q.y*cv.height;ctx.beginPath();ctx.arc(x,y,Math.max(7,cv.width*.009),0,Math.PI*2);ctx.strokeStyle='#e30613';ctx.lineWidth=Math.max(3,cv.width*.003);ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold '+Math.max(12,cv.width*.014)+'px sans-serif';ctx.fillText(String(i+1),x+10,y-8);});
      const n=window._manualPup.p.length,ins=document.getElementById('manual_pup_instr'),ok=document.getElementById('manual_pup_ok');if(n<10){ins.textContent=(n+1)+'/10 — '+nomes[n];}else{ins.textContent='10/10 — Pontos marcados. Calculando medidas...';if(ok){ok.disabled=true;ok.textContent='Calculando...';}setTimeout(()=>concluirMedicaoManualSemIA(),60);}
    };
  }; if(img.complete)start();else img.onload=start;
}
function concluirMedicaoManualSemIA(){
  try{
    const a=window._manualPup?.p;
    if(!a||a.length<10){showToast('Marque os 10 pontos antes de calcular','error');return;}
    const cfg=window._manualPupConfig||{};
    const img=document.getElementById('manual_pup_img');
    const top=(a[6].y+a[8].y)/2,bot=(a[7].y+a[9].y)/2;
    const r={pupilOD_x:a[0].x,pupilOD_y:a[0].y,pupilOE_x:a[1].x,pupilOE_y:a[1].y,lensOD_x1:a[2].x,lensOD_x2:a[3].x,lensOE_x1:a[4].x,lensOE_x2:a[5].x,lensTop_y:top,lensBot_y:bot,compatibilidade:'Medição manual',observacoes:'Pontos marcados manualmente; confirme as medidas antes de finalizar.'};
    const m=calcularPupilometriaGeometrica(r,cfg.ref||'',cfg.tipo||'largura_total',img);
    if(!m){showToast('Não foi possível calibrar a medida. Confira a referência e os pontos.','error');return;}
    Object.assign(r,m);_pupilometriaAtual=r;window._manualPupResultado=r;
    const cards=[['DP Total',r.dpTotal],['DNP OD',r.dpOD],['DNP OE',r.dpOE],['Altura OD',r.coOD],['Altura OE',r.coOE],['Ponte',r.ponteArmacao]].map(x=>'<div style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;text-align:center"><small>'+x[0]+'</small><div style="font-size:18px;font-weight:900">'+x[1]+' mm</div></div>').join('');
    const box=document.querySelector('#modal-root .modal');
    if(box){box.innerHTML='<div style="padding:18px"><div style="font-size:20px;font-weight:900;color:#e30613;margin-bottom:6px">Medidas calculadas</div><div style="font-size:12px;color:var(--muted);margin-bottom:14px">Resultado geométrico calibrado pela referência física informada.</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">'+cards+'</div><div class="modal-footer"><button id="manual_pup_concluir" class="btn btn-primary" type="button">Concluir</button></div></div>';setTimeout(()=>{const b=document.getElementById('manual_pup_concluir');if(b)b.addEventListener('click',()=>closeModal());},0);}
    showToast('Medidas calculadas sem IA','success');
  }catch(e){console.error('Erro pupilometria manual',e);showToast('Erro ao calcular: '+(e?.message||'falha inesperada'),'error');}
}

function desenharMedidas(imgEl, r) {
  const wrapper = imgEl.parentElement;
  const w = imgEl.naturalWidth  || imgEl.width  || 800;
  const h = imgEl.naturalHeight || imgEl.height || 500;

  const canvas = document.createElement('canvas');
  canvas.width  = w;
  canvas.height = h;
  canvas.style.cssText = 'width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:2px solid #C9A84C;display:block';

  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = function() {
    ctx.drawImage(img, 0, 0, w, h);

    // Só desenhar medições quando a IA devolver geometria completa e válida.
    // Nunca substituir coordenadas ausentes por posições estimadas.
    const coord01 = v => Number.isFinite(Number(v)) && Number(v) >= 0 && Number(v) <= 1;
    const temCoords = [
      r.pupilOD_x,r.pupilOD_y,r.pupilOE_x,r.pupilOE_y,
      r.lensOD_x1,r.lensOD_x2,r.lensOE_x1,r.lensOE_x2,
      r.lensTop_y,r.lensBot_y
    ].every(coord01);

    if(!temCoords){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.78)';
      ctx.fillRect(0,h*0.82,w,h*0.18);
      ctx.fillStyle='#f59e0b';
      ctx.font='bold '+Math.max(13,w*0.018)+'px sans-serif';
      ctx.fillText('MEDIÇÃO NÃO CONFIRMADA',w*0.03,h*0.88);
      ctx.fillStyle='#ffffff';
      ctx.font=Math.max(11,w*0.014)+'px sans-serif';
      ctx.fillText('Pontos geométricos insuficientes. Refaça a captura frontal.',w*0.03,h*0.93);
      ctx.restore();
      if(wrapper){ wrapper.innerHTML=''; wrapper.appendChild(canvas); }
      return;
    }

    const cx  = w * 0.50;
    const fW  = w * 0.72;
    const lW  = temCoords
      ? (r.lensOD_x2 ? (parseFloat(r.lensOD_x2)-parseFloat(r.lensOD_x1||0.25))*w : fW*0.24)
      : fW * 0.24;
    const lH  = temCoords
      ? (r.lensBot_y ? (parseFloat(r.lensBot_y)-parseFloat(r.lensTop_y||0.37))*h : lW*0.62)
      : lW * 0.62;
    const ey  = temCoords ? parseFloat(r.pupilOD_y)*h : h * 0.42;
    const pupOD = temCoords ? parseFloat(r.pupilOD_x)*w : cx - fW*0.02 - lW*0.5;
    const pupOE = temCoords ? parseFloat(r.pupilOE_x)*w : cx + fW*0.02 + lW*0.5;
    const lOD_x1 = temCoords && r.lensOD_x1 ? parseFloat(r.lensOD_x1)*w : pupOD - lW/2;
    const lOD_x2 = temCoords && r.lensOD_x2 ? parseFloat(r.lensOD_x2)*w : pupOD + lW/2;
    const lOE_x1 = temCoords && r.lensOE_x1 ? parseFloat(r.lensOE_x1)*w : pupOE - lW/2;
    const lOE_x2 = temCoords && r.lensOE_x2 ? parseFloat(r.lensOE_x2)*w : pupOE + lW/2;
    const lens_top = temCoords && r.lensTop_y ? parseFloat(r.lensTop_y)*h : ey - lH/2;
    const lens_bot = temCoords && r.lensBot_y ? parseFloat(r.lensBot_y)*h : ey + lH/2;

    // Helper: draw a line with label
    function linha(x1,y1,x2,y2, cor, label, labelPos) {
      ctx.save();
      ctx.strokeStyle = cor;
      ctx.lineWidth   = Math.max(2, w*0.003);
      ctx.setLineDash([8,4]);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      // End ticks
      ctx.setLineDash([]);
      const tickH = h*0.018;
      ctx.beginPath(); ctx.moveTo(x1,y1-tickH); ctx.lineTo(x1,y1+tickH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2,y2-tickH); ctx.lineTo(x2,y2+tickH); ctx.stroke();
      // Label background
      if(label) {
        ctx.font = `bold ${Math.max(14,w*0.022)}px DM Sans, sans-serif`;
        const tw = ctx.measureText(label).width;
        const lx = labelPos==='left' ? Math.min(x1,x2) : (x1+x2)/2 - tw/2;
        const ly = y1 - h*0.025;
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(lx-4, ly-parseInt(ctx.font)-2, tw+8, parseInt(ctx.font)+8);
        ctx.fillStyle = cor;
        ctx.fillText(label, lx, ly);
      }
      ctx.restore();
    }

    // Helper: draw pupil dot
    function pupila(x, y, cor, label) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, Math.max(6, w*0.012), 0, Math.PI*2);
      ctx.strokeStyle = cor;
      ctx.lineWidth = Math.max(2.5, w*0.004);
      ctx.stroke();
      ctx.fillStyle = cor + '40';
      ctx.fill();
      // cross hair
      const cz = Math.max(10, w*0.018);
      ctx.beginPath(); ctx.moveTo(x-cz,y); ctx.lineTo(x+cz,y);
      ctx.moveTo(x,y-cz); ctx.lineTo(x,y+cz);
      ctx.strokeStyle = cor;
      ctx.lineWidth = Math.max(1.5, w*0.002);
      ctx.stroke();
      // label
      if(label) {
        ctx.font = `bold ${Math.max(12,w*0.018)}px DM Sans, sans-serif`;
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(x+8, y-16, tw+8, 20);
        ctx.fillStyle = cor;
        ctx.fillText(label, x+12, y-2);
      }
      ctx.restore();
    }

    function lente(x1, y1, x2, y2, cor) {
      ctx.save();
      ctx.strokeStyle = cor;
      ctx.lineWidth = Math.max(2.5, w*0.004);
      ctx.setLineDash([6,3]);
      ctx.strokeRect(x1, y1, x2-x1, y2-y1);
      // Cantos destacados
      ctx.setLineDash([]);
      const cs = Math.min(15, (x2-x1)*0.2);
      ctx.lineWidth = Math.max(3, w*0.005);
      [[x1,y1],[x2,y1],[x1,y2],[x2,y2]].forEach(function([cx2,cy2]){
        const sx = cx2===x1?1:-1, sy = cy2===y1?1:-1;
        ctx.beginPath();
        ctx.moveTo(cx2+sx*cs,cy2); ctx.lineTo(cx2,cy2); ctx.lineTo(cx2,cy2+sy*cs);
        ctx.stroke();
      });
      ctx.restore();
    }

    const numeroMM = v => {
      const n = Number(String(v ?? '').replace(',','.'));
      return Number.isFinite(n) && n > 0 ? n : null;
    };
    const formatMM = v => {
      const n = numeroMM(v);
      return n===null ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
    };
    const odNum = numeroMM(r.dpOD);
    const oeNum = numeroMM(r.dpOE);
    const totalNum = odNum!==null && oeNum!==null ? odNum+oeNum : numeroMM(r.dpTotal);
    const dpTotal = totalNum===null ? '—' : totalNum.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
    const dpOD    = formatMM(r.dpOD);
    const dpOE    = formatMM(r.dpOE);
    const coOD    = r.coOD || '—';
    const coOE    = r.coOE || '—';
    const larg    = r.larguraArmacao || '—';
    const alt     = r.alturaLente    || '—';
    const ponte   = r.ponteArmacao   || '—';

    // Lentes com bordas reais
    lente(lOD_x1, lens_top, lOD_x2, lens_bot, '#C9A84C');
    lente(lOE_x1, lens_top, lOE_x2, lens_bot, '#C9A84C');

    // DP Total linha acima das lentes
    const dpY = lens_top - h*0.05;
    linha(pupOD, dpY, pupOE, dpY, '#C9A84C', 'DP '+dpTotal+'mm');

    // DP OD — ponte até pupila OD
    const bridgeCx = (lOD_x2 + lOE_x1) / 2;
    linha(bridgeCx, dpY + h*0.04, pupOD, dpY + h*0.04, '#f0c040', 'OD '+dpOD+'mm');

    // DP OE — ponte até pupila OE
    linha(bridgeCx, dpY + h*0.07, pupOE, dpY + h*0.07, '#f0c040', 'OE '+dpOE+'mm');

    // Largura da lente OD
    const largBot = lens_bot + h*0.03;
    linha(lOD_x1, largBot, lOD_x2, largBot, '#10b981', 'L:'+larg+'mm');

    // Altura da lente OE
    const altX = lOE_x2 + w*0.025;
    linha(altX, lens_top, altX, lens_bot, '#10b981', 'A:'+alt+'mm');

    // Ponte
    linha(lOD_x2, ey, lOE_x1, ey, '#818cf8', 'P:'+ponte+'mm');

    // CO OD — vertical da pupila até base da lente
    ctx.save();
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = Math.max(2, w*0.003);
    ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(pupOD, ey); ctx.lineTo(pupOD, lens_bot); ctx.stroke();
    ctx.setLineDash([]);
    // Tick na base
    ctx.beginPath(); ctx.moveTo(pupOD-6,lens_bot); ctx.lineTo(pupOD+6,lens_bot); ctx.stroke();
    ctx.font = 'bold '+Math.max(11,w*0.016)+'px sans-serif';
    ctx.fillStyle = '#a78bfa';
    ctx.fillText('CO '+coOD+'mm', pupOD+6, (ey+lens_bot)/2);
    ctx.restore();

    // CO OE
    ctx.save();
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = Math.max(2, w*0.003);
    ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(pupOE, ey); ctx.lineTo(pupOE, lens_bot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(pupOE-6,lens_bot); ctx.lineTo(pupOE+6,lens_bot); ctx.stroke();
    ctx.font = 'bold '+Math.max(11,w*0.016)+'px sans-serif';
    ctx.fillStyle = '#a78bfa';
    ctx.fillText('CO '+coOE+'mm', pupOE-w*0.08, (ey+lens_bot)/2);
    ctx.restore();

    // Marcador pupilar — círculo + crosshair estilo B-15
    function marcadorPupila(px, py, cor, label) {
      const r2 = Math.max(8, w*0.015);
      // Glow externo
      const grad = ctx.createRadialGradient(px,py,r2*0.3,px,py,r2*1.8);
      grad.addColorStop(0, cor+'60');
      grad.addColorStop(1, 'transparent');
      ctx.save();
      ctx.beginPath(); ctx.arc(px,py,r2*1.8,0,Math.PI*2);
      ctx.fillStyle = grad; ctx.fill();
      // Círculo principal
      ctx.beginPath(); ctx.arc(px,py,r2,0,Math.PI*2);
      ctx.strokeStyle=cor; ctx.lineWidth=Math.max(2.5,w*0.004); ctx.stroke();
      ctx.fillStyle=cor+'30'; ctx.fill();
      // Crosshair
      const cz = r2*1.6;
      ctx.setLineDash([3,2]);
      ctx.beginPath();
      ctx.moveTo(px-cz,py); ctx.lineTo(px-r2,py);
      ctx.moveTo(px+r2,py); ctx.lineTo(px+cz,py);
      ctx.moveTo(px,py-cz); ctx.lineTo(px,py-r2);
      ctx.moveTo(px,py+r2); ctx.lineTo(px,py+cz);
      ctx.strokeStyle=cor; ctx.lineWidth=Math.max(1.5,w*0.002); ctx.stroke();
      ctx.setLineDash([]);
      // Label
      if(label){
        ctx.font='bold '+Math.max(12,w*0.018)+'px sans-serif';
        const tw=ctx.measureText(label).width;
        const lx=px+r2+4, ly=py-4;
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(lx-2,ly-14,tw+8,18);
        ctx.fillStyle=cor; ctx.fillText(label,lx+2,ly);
      }
      ctx.restore();
    }

    marcadorPupila(pupOD, Number(r.pupilOD_y)*h, '#ff4444', 'OD '+dpOD+'mm');
    marcadorPupila(pupOE, Number(r.pupilOE_y)*h, '#22c55e', 'OE '+dpOE+'mm');

    // Linha central vertical (nariz)
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.25)';
    ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(bridgeCx,h*0.05); ctx.lineTo(bridgeCx,h*0.92); ctx.stroke();
    ctx.restore();

    // Watermark
    ctx.save();
    ctx.font='bold '+Math.max(11,w*0.016)+'px sans-serif';
    ctx.fillStyle='rgba(201,168,76,0.7)';
    ctx.fillText('Ótica lclass — Pupilometria IA', w*0.02, h*0.97);
    ctx.restore();

    if(wrapper){ wrapper.innerHTML=''; wrapper.appendChild(canvas); }
  };
  img.src = imgEl.src;
}

function calcularPupilometriaGeometrica(r, referenciaValor, referenciaTipo, imgEl){
  const n=v=>{const x=Number(String(v??'').replace(',','.'));return Number.isFinite(x)?x:null;};
  const ref=n(referenciaValor);
  const W=Number(imgEl?.naturalWidth||r.imageWidth||0), H=Number(imgEl?.naturalHeight||r.imageHeight||0);
  const xOD=n(r.pupilOD_x), yOD=n(r.pupilOD_y), xOE=n(r.pupilOE_x), yOE=n(r.pupilOE_y);
  const od1=n(r.lensOD_x1), od2=n(r.lensOD_x2), oe1=n(r.lensOE_x1), oe2=n(r.lensOE_x2);
  const top=n(r.lensTop_y), bot=n(r.lensBot_y);
  const vals=[xOD,yOD,xOE,yOE,od1,od2,oe1,oe2,top,bot];
  if(!(ref>0)||!(W>0)||!(H>0)||vals.some(v=>v===null||v<0||v>1)) return null;
  const pxX=v=>v*W, pxY=v=>v*H;
  const largOD=Math.abs(pxX(od2)-pxX(od1)), largOE=Math.abs(pxX(oe2)-pxX(oe1));
  const altura=Math.abs(pxY(bot)-pxY(top));
  const ponte=Math.abs(pxX(oe1)-pxX(od2));
  const larguraTotal=Math.max(pxX(od2),pxX(oe2))-Math.min(pxX(od1),pxX(oe1));
  let pxRef=null;
  if(referenciaTipo==='largura_total') pxRef=larguraTotal;
  else if(referenciaTipo==='largura_lente') pxRef=(largOD+largOE)/2;
  else if(referenciaTipo==='ponte') pxRef=ponte;
  else if(referenciaTipo==='altura_lente') pxRef=altura;
  if(!(pxRef>0)) return null;
  const mmPorPx=ref/pxRef, centroPonte=(pxX(od2)+pxX(oe1))/2;
  const round=v=>Math.round(v*100)/100;
  return {
    dpOD:round(Math.abs(centroPonte-pxX(xOD))*mmPorPx),
    dpOE:round(Math.abs(pxX(xOE)-centroPonte)*mmPorPx),
    dpTotal:round(Math.abs(pxX(xOE)-pxX(xOD))*mmPorPx),
    coOD:round(Math.abs(pxY(bot)-pxY(yOD))*mmPorPx),
    coOE:round(Math.abs(pxY(bot)-pxY(yOE))*mmPorPx),
    larguraArmacao:round(larguraTotal*mmPorPx),
    alturaLente:round(altura*mmPorPx),
    ponteArmacao:round(ponte*mmPorPx),
    escalaUsada:round(mmPorPx),
    calibracao:'pixel'
  };
}
function validarCapturaPupilometria(r){
  const n=v=>{const x=Number(String(v??'').replace(',','.'));return Number.isFinite(x)?x:null;};
  const xOD=n(r.pupilOD_x), yOD=n(r.pupilOD_y), xOE=n(r.pupilOE_x), yOE=n(r.pupilOE_y);
  const od1=n(r.lensOD_x1), od2=n(r.lensOD_x2), oe1=n(r.lensOE_x1), oe2=n(r.lensOE_x2);
  const top=n(r.lensTop_y), bot=n(r.lensBot_y);
  const vals=[xOD,yOD,xOE,yOE,od1,od2,oe1,oe2,top,bot];
  const problemas=[];
  if(vals.some(v=>v===null||v<0||v>1)){
    problemas.push('Pontos geométricos incompletos ou fora da imagem.');
    return {ok:false,problemas};
  }
  const distPup=Math.abs(xOE-xOD);
  const largOD=Math.abs(od2-od1), largOE=Math.abs(oe2-oe1);
  const altura=Math.abs(bot-top);
  const desnivel=Math.abs(yOD-yOE);
  const assimLentes=Math.abs(largOD-largOE)/Math.max(largOD,largOE,0.0001);
  const centroPup=(xOD+xOE)/2;
  const centroArm=(Math.min(od1,oe1)+Math.max(od2,oe2))/2;
  const descentralizacao=Math.abs(centroPup-centroArm);

  if(distPup<0.12||distPup>0.55) problemas.push('Distância entre pupilas incompatível com uma captura frontal confiável.');
  if(altura<0.08) problemas.push('Altura das lentes insuficiente para calibração.');
  if(desnivel>0.035) problemas.push('Cabeça ou câmera inclinada: olhos fora do mesmo nível.');
  if(assimLentes>0.18) problemas.push('Perspectiva excessiva: as lentes aparecem com larguras muito diferentes.');
  if(descentralizacao>0.07) problemas.push('Rosto/armação muito descentralizados na captura.');
  if(!(xOD>od1&&xOD<od2)) problemas.push('Pupila OD detectada fora dos limites da lente.');
  if(!(xOE>oe1&&xOE<oe2)) problemas.push('Pupila OE detectada fora dos limites da lente.');
  if(!(yOD>top&&yOD<bot&&yOE>top&&yOE<bot)) problemas.push('Centro pupilar detectado fora da altura útil das lentes.');

  return {ok:problemas.length===0,problemas};
}

let _pupilometriaAtual=null;

function abrirAjustePupilar(){
  const base64=document.getElementById('rf_foto_hidden')?.value;
  if(!base64||!_pupilometriaAtual){showToast('Analise uma foto primeiro','error');return;}
  const r=_pupilometriaAtual;
  if(![r.pupilOD_x,r.pupilOD_y,r.pupilOE_x,r.pupilOE_y].every(v=>Number.isFinite(Number(v)))){
    showToast('Pontos pupilares não disponíveis','error');return;
  }
  const html='<div style="padding:18px"><div style="font-size:18px;font-weight:800;color:#C9A84C;margin-bottom:6px">Ajuste manual dos centros pupilares</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Toque primeiro no centro da pupila OD e depois no centro da pupila OE. O sistema recalcula as medidas sem nova chamada de IA.</div>'
    +'<div id="ajuste_pup_wrap" style="position:relative;overflow:hidden;border:2px solid #C9A84C;border-radius:10px"><img id="ajuste_pup_img" src="'+base64+'" style="display:block;width:100%;height:auto"><canvas id="ajuste_pup_canvas" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas></div>'
    +'<div id="ajuste_pup_status" style="font-size:12px;color:#f59e0b;margin-top:10px">Próximo ponto: OD</div>'
    +'<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button id="ajuste_pup_salvar" class="btn btn-primary" disabled onclick="salvarAjustePupilar()">Recalcular medidas</button></div></div>';
  openModal(html,'modal-lg');
  setTimeout(iniciarAjustePupilar,80);
}

function iniciarAjustePupilar(){
  const img=document.getElementById('ajuste_pup_img'), canvas=document.getElementById('ajuste_pup_canvas');
  if(!img||!canvas)return;
  const iniciar=()=>{
    canvas.width=img.naturalWidth||1000; canvas.height=img.naturalHeight||600;
    window._ajustePup={passo:0,pontos:[]};
    const ctx=canvas.getContext('2d');
    const redesenhar=()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      window._ajustePup.pontos.forEach((p,i)=>{
        ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(8,canvas.width*.012),0,Math.PI*2);
        ctx.strokeStyle=i===0?'#ef4444':'#22c55e';ctx.lineWidth=Math.max(3,canvas.width*.004);ctx.stroke();
        ctx.font='bold '+Math.max(14,canvas.width*.018)+'px sans-serif';ctx.fillStyle=i===0?'#ef4444':'#22c55e';
        ctx.fillText(i===0?'OD':'OE',p.x*canvas.width+12,p.y*canvas.height-10);
      });
    };
    const marcar=ev=>{
      const rect=canvas.getBoundingClientRect();
      const clientX=ev.touches?ev.touches[0].clientX:ev.clientX, clientY=ev.touches?ev.touches[0].clientY:ev.clientY;
      const p={x:Math.min(1,Math.max(0,(clientX-rect.left)/rect.width)),y:Math.min(1,Math.max(0,(clientY-rect.top)/rect.height))};
      if(window._ajustePup.passo<2) window._ajustePup.pontos[window._ajustePup.passo]=p;
      window._ajustePup.passo=Math.min(2,window._ajustePup.passo+1); redesenhar();
      const st=document.getElementById('ajuste_pup_status'), bt=document.getElementById('ajuste_pup_salvar');
      if(window._ajustePup.passo===1)st.textContent='Próximo ponto: OE';
      if(window._ajustePup.passo===2){st.textContent='OD e OE marcados. Confira os centros e recalcule.';bt.disabled=false;}
    };
    canvas.addEventListener('click',marcar);
  };
  if(img.complete)iniciar();else img.onload=iniciar;
}

function salvarAjustePupilar(){
  if(!_pupilometriaAtual||!window._ajustePup||window._ajustePup.pontos.length<2)return;
  const [od,oe]=window._ajustePup.pontos;
  _pupilometriaAtual.pupilOD_x=od.x;_pupilometriaAtual.pupilOD_y=od.y;
  _pupilometriaAtual.pupilOE_x=oe.x;_pupilometriaAtual.pupilOE_y=oe.y;
  const rv=(document.getElementById('rf_ref_largura')||{value:''}).value.trim();
  const rt=(document.getElementById('rf_ref_tipo')||{value:'largura_total'}).value;
  const qualidade=validarCapturaPupilometria(_pupilometriaAtual);
  const imgEl=document.querySelector('#rf_foto_preview img');
  const medidas=qualidade.ok?calcularPupilometriaGeometrica(_pupilometriaAtual,rv,rt,imgEl):null;
  if(!medidas){showToast('Ajuste não passou pela validação geométrica','error');return;}
  Object.assign(_pupilometriaAtual,medidas);
  [['rf_dpD','dpOD'],['rf_dpE','dpOE'],['rf_coD','coOD'],['rf_coE','coOE']].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.value=_pupilometriaAtual[k];});
  closeModal();
  if(imgEl)desenharMedidas(imgEl,_pupilometriaAtual);
  showToast('Pontos ajustados e medidas recalculadas','success');
}

async function analisarFotoIA(){
  var base64Full=document.getElementById('rf_foto_hidden')&&document.getElementById('rf_foto_hidden').value;
  if(!base64Full){showToast('Nenhuma foto selecionada','error');return;}
  var btn=document.getElementById('btn_analisar_ia');
  var res=document.getElementById('rf_ia_resultado');
  if(btn){btn.disabled=true;btn.textContent='Analisando...';}
  if(res){res.style.display='block';res.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted)">Analisando foto...</div>';}
  try{
    var rv=(document.getElementById('rf_ref_largura')||{value:''}).value.trim();
    var rt=(document.getElementById('rf_ref_tipo')||{value:'largura_total'}).value;
    var r=await chamarIABackend('pupilometria',base64Full,{referenciaValor:rv,referenciaTipo:rt});
    _pupilometriaAtual=r;
    var qualidade=validarCapturaPupilometria(r);
    var imgEl=document.querySelector('#rf_foto_preview img');
    var medidas=qualidade.ok?calcularPupilometriaGeometrica(r,rv,rt,imgEl):null;
    var escalaConfiavel=!!medidas;
    // A IA fornece os pontos. Os milímetros são calculados localmente a partir da referência física.
    if(medidas){
      Object.assign(r,medidas);
    }else{
      r.dpOD=''; r.dpOE=''; r.dpTotal=''; r.coOD=''; r.coOE='';
      r.larguraArmacao=''; r.alturaLente=''; r.ponteArmacao=''; r.escalaUsada='';
    }
    if(escalaConfiavel&&r.dpOD){var el=document.getElementById('rf_dpD');if(el)el.value=r.dpOD;}
    if(escalaConfiavel&&r.dpOE){var el=document.getElementById('rf_dpE');if(el)el.value=r.dpOE;}
    if(escalaConfiavel&&r.coOD){var el=document.getElementById('rf_coD');if(el)el.value=r.coOD;}
    if(escalaConfiavel&&r.coOE){var el=document.getElementById('rf_coE');if(el)el.value=r.coOE;}
    if(imgEl&&r)desenharMedidas(imgEl,r);
    var nOD=Number(String(r.dpOD||'').replace(',','.')), nOE=Number(String(r.dpOE||'').replace(',','.'));
    var dpT=r.dpTotal||((Number.isFinite(nOD)&&nOD>0&&Number.isFinite(nOE)&&nOE>0)?(nOD+nOE).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2}):'---');
    var cc=r.compatibilidade==='Sim'?'#10b981':r.compatibilidade==='Parcial'?'#C9A84C':'#ef4444';
    var mm=v=>(v!==''&&v!=null&&v!=='---')?v+' mm':'—';
    var itens=[['DP Total',mm(dpT),'#C9A84C'],['DNP OD',mm(r.dpOD),'#C9A84C'],['DNP OE',mm(r.dpOE),'#C9A84C'],
      ['Altura OD',mm(r.coOD),'#818cf8'],['Altura OE',mm(r.coOE),'#818cf8'],
      ['Largura',mm(r.larguraArmacao),'#10b981'],['Altura lente',mm(r.alturaLente),'#10b981'],['Ponte',mm(r.ponteArmacao),'#10b981']];
    res.innerHTML='<div style="background:#080e1a;border:1px solid #C9A84C;border-radius:12px;padding:14px">'
      +'<div style="font-size:12px;color:#C9A84C;font-weight:700;margin-bottom:10px">Pupilometria IA</div>'
      +(r.numerosArmacao&&r.numerosArmacao.length>2&&r.numerosArmacao.indexOf('null')<0?'<div style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px">Armacao: <strong>'+r.numerosArmacao+'</strong></div>':'')
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">'
      +itens.map(function(it){return '<div style="background:var(--surface);border-radius:8px;padding:8px;text-align:center"><div style="font-size:10px;color:var(--dim)">'+it[0]+'</div><div style="font-size:14px;font-weight:800;color:'+it[2]+'">'+it[1]+'</div></div>';}).join('')
      +'</div><div style="padding:8px;background:'+cc+'15;border:1px solid '+cc+'40;border-radius:8px;font-size:12px;color:'+cc+'">'
      +(r.compatibilidade||'---')+': '+(r.observacoes||'')+'</div>'
      +(qualidade.ok?'':'<div style="margin-top:8px;padding:8px;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.35);border-radius:8px;color:#f59e0b;font-size:11px"><strong>Refaça a captura:</strong> '+qualidade.problemas.map(esc).join(' ')+'</div>')
      +'<button type="button" class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="abrirAjustePupilar()">🎯 Ajustar centros pupilares manualmente</button>'
      +'<div style="font-size:10px;color:var(--dim);margin-top:6px">'+(escalaConfiavel?'* Medição assistida: captura aprovada pelos controles geométricos. Confirme antes de finalizar a receita.':qualidade.ok?'* Captura aprovada, porém sem referência física válida: medidas em mm não foram calculadas.':'* Captura reprovada pelos controles geométricos: nenhuma medida em mm foi aceita.')+'</div></div>';
    showToast('Analise concluida!','success');
  }catch(err){
    console.error('Erro IA:',err);
    if(res)res.innerHTML='<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:14px;color:#ef4444;font-size:13px">Erro: '+err.message+'</div>';
    showToast('Erro na analise','error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Analisar com IA';}
  }
}

function calcParcela(){
  const t=parseFloat(document.getElementById('crd_total')?.value||0);
  const n=parseInt(document.getElementById('crd_parc')?.value||1);
  const j=parseFloat(document.getElementById('crd_juros')?.value||0);
  const vp=t*(1+j/100)/n;
  const el=document.getElementById('crd_vp');
  if(el)el.textContent=fmt(isNaN(vp)?0:vp);
}
function salvarCrediario(){
  const cliId=parseInt(document.getElementById('crd_cli')?.value||0);
  const total=parseFloat(document.getElementById('crd_total')?.value||0);
  const n=parseInt(document.getElementById('crd_parc')?.value||1);
  const dp=document.getElementById('crd_data')?.value||today();
  const j=parseFloat(document.getElementById('crd_juros')?.value||0);
  const desc=document.getElementById('crd_desc')?.value?.trim()||'';
  if(!cliId||!total||!dp)return showToast('Preencha os campos obrigatórios','error');
  const vp=+(total*(1+j/100)/n).toFixed(2);
  const pagamentos=Array.from({length:n},(_,i)=>{
    const d=new Date(dp+'T12:00:00');d.setMonth(d.getMonth()+i);
    return{num:i+1,venc:d.toISOString().split('T')[0],valor:vp,pago:false,dataPag:'',forma:'',obs:''};
  });
  state.crediario.push({id:uid(),clienteId:cliId,data:today(),total,parcelas:n,dataPrimeira:dp,juros:j,descricao:desc,pagamentos});
  saveAll();closeModal();showToast('Crediário registrado!','success');renderCrediario();
}

let vendBusca='';
let estoqueFoto='',estoqueItensFoto=[];
function renderEstoque(){
 const total=state.estoque.reduce((a,x)=>a+(+x.qtd||0),0),baixo=state.estoque.filter(x=>(+x.qtd||0)<=1).length;
 document.getElementById('content').innerHTML=`
 <div class="page-header"><div><div class="page-title">Estoque de Armações</div><div class="page-sub">Cadastre individualmente ou fotografe o mostruário</div></div><button class="btn btn-primary" onclick="abrirCapturaEstoque()">📷 Entrada por foto</button></div>
 <div class="grid3" style="margin-bottom:18px"><div class="card"><div class="stat-label">MODELOS</div><div class="stat-value">${state.estoque.length}</div></div><div class="card"><div class="stat-label">PEÇAS</div><div class="stat-value">${total}</div></div><div class="card"><div class="stat-label">ESTOQUE BAIXO</div><div class="stat-value">${baixo}</div></div></div>
 <div class="stock-grid">${state.estoque.length?state.estoque.map(x=>`<div class="stock-card"><div class="stock-photo">${x.foto?'<img src="'+x.foto+'">':'👓'}</div><div class="stock-body"><b>${esc(x.modelo)}</b><div class="muted">${esc(x.marca||'Sem marca')} • ${esc(x.cor||'')}</div><div style="display:flex;justify-content:space-between;margin-top:10px"><span class="badge badge-yellow">Qtd. ${x.qtd}</span><b>${fmtMoney(+x.preco||0)}</b></div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-ghost btn-xs" onclick="ajustarEstoque('${x.id}',1)">+1</button><button class="btn btn-ghost btn-xs" onclick="ajustarEstoque('${x.id}',-1)">-1</button><button class="btn btn-danger btn-xs" onclick="removerEstoque('${x.id}')">🗑</button></div></div></div>`).join(''):'<div class="empty"><div class="empty-icon">👓</div><p>Nenhuma armação cadastrada</p></div>'}</div>`;
}
function abrirCapturaEstoque(){
 estoqueFoto='';estoqueItensFoto=[{modelo:'',marca:'',cor:'',qtd:1,preco:0}];
 showModal(`<div class="modal-header"><h2>📷 Entrada de armações</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div><div class="modal-body">
 <div class="capture-box"><b>Foto da armação</b><div class="muted" style="margin:6px 0 12px">Tire uma foto ou escolha uma imagem. A foto é opcional e será usada no estoque e no provador virtual.</div><input id="stock_photo_input" type="file" accept="image/*" capture="environment" onchange="lerFotoEstoque(this)"><div id="stock_photo_preview"></div><div id="stock_ai_area" style="display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)"><div class="muted" style="font-size:11px;margin-bottom:7px">IA opcional — não é necessária para cadastrar a armação.</div><button id="btn_stock_ai" class="btn btn-ghost btn-sm" onclick="analisarMostruarioIA()">✨ Tentar identificar com IA</button><div id="stock_ai_status" style="font-size:11px;color:var(--dim);margin-top:8px"></div></div></div>
 <div style="margin-top:16px"><div style="display:flex;justify-content:space-between;align-items:center"><b>Dados da armação</b><button class="btn btn-ghost btn-sm" onclick="addLinhaEstoque()">+ Adicionar modelo</button></div><div class="muted" style="font-size:11px;margin:5px 0 10px">Preencha modelo e quantidade. Depois toque em <b>Salvar no estoque</b>. A IA não é obrigatória.</div><div id="stock_detect_rows"></div></div>
 <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="salvarEntradaEstoque()">Salvar no estoque</button></div></div>`,'modal-lg');renderLinhasEstoque();
}
function lerFotoEstoque(inp){const file=inp.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{estoqueFoto=r.result;document.getElementById('stock_photo_preview').innerHTML='<img class="capture-preview" src="'+estoqueFoto+'">';const area=document.getElementById('stock_ai_area');if(area)area.style.display='block';const st=document.getElementById('stock_ai_status');if(st)st.textContent='Foto adicionada. Você já pode preencher os dados e salvar no estoque.'};r.readAsDataURL(file)}
const AI_BACKEND_URL=localStorage.getItem('otica_ai_backend_url')||'';
async function chamarIABackend(task,image,context){
 if(!AI_BACKEND_URL)throw new Error('Backend seguro da IA ainda não foi ativado');
 const resp=await fetch(AI_BACKEND_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,image,context:context||{}})});
 const data=await resp.json().catch(()=>({}));
 if(!resp.ok)throw new Error(data.error||('Backend IA '+resp.status));
 return data;
}
async function analisarMostruarioIA(){
 const status=document.getElementById('stock_ai_status'),btn=document.getElementById('btn_stock_ai');
 if(!estoqueFoto)return showToast('Tire ou escolha uma foto primeiro','error');
 try{
  if(btn){btn.disabled=true;btn.textContent='Analisando...'} if(status)status.textContent='IA analisando armações visíveis na foto...';
  const r=await chamarIABackend('estoque',estoqueFoto);
  if(!Array.isArray(r.itens)||!r.itens.length)throw new Error('Nenhuma armação identificada');
  estoqueItensFoto=r.itens.map((x,i)=>({modelo:'ARM-'+String(i+1).padStart(3,'0'),marca:'',cor:x.cor||'',qtd:Math.max(1,parseInt(x.quantidade)||1),preco:0,descricao:x.descricao||'',confianca:x.confianca||'baixa'}));
  renderLinhasEstoque();
  if(status)status.innerHTML='Pré-seleção concluída: <b>'+estoqueItensFoto.reduce((a,x)=>a+x.qtd,0)+' armação(ões)</b> em '+estoqueItensFoto.length+' grupo(s). Revise modelo, quantidade e demais dados antes de salvar.';
  showToast('Análise concluída. Confira os itens antes de salvar.','success');
 }catch(e){console.error(e);if(status)status.textContent='Não foi possível concluir: '+e.message;showToast('Falha na análise da foto','error')}
 finally{if(btn){btn.disabled=false;btn.textContent='✨ Analisar foto com IA'}}
}
function renderLinhasEstoque(){const el=document.getElementById('stock_detect_rows');if(!el)return;el.innerHTML=estoqueItensFoto.map((x,i)=>`<div class="detect-row"><div class="wide"><label>Modelo</label><input class="inp" value="${esc(x.modelo)}" oninput="estoqueItensFoto[${i}].modelo=this.value" placeholder="Ex: LC-001"></div><div><label>Qtd.</label><input class="inp" type="number" min="1" value="${x.qtd}" oninput="estoqueItensFoto[${i}].qtd=+this.value"></div><div><label>Preço</label><input class="inp" type="number" min="0" step=".01" value="${x.preco}" oninput="estoqueItensFoto[${i}].preco=+this.value"></div><button class="btn btn-danger btn-sm" onclick="estoqueItensFoto.splice(${i},1);renderLinhasEstoque()">✕</button>${x.descricao?'<div class="wide" style="font-size:11px;color:var(--dim)">IA: '+esc(x.descricao)+' • confiança '+esc(x.confianca||'')+'</div>':''}<div class="wide"><input class="inp" value="${esc(x.marca)}" oninput="estoqueItensFoto[${i}].marca=this.value" placeholder="Marca (opcional)"></div><div><input class="inp" value="${esc(x.cor)}" oninput="estoqueItensFoto[${i}].cor=this.value" placeholder="Cor"></div></div>`).join('')}
function addLinhaEstoque(){estoqueItensFoto.push({modelo:'',marca:'',cor:'',qtd:1,preco:0});renderLinhasEstoque()}
function salvarEntradaEstoque(){const valid=estoqueItensFoto.filter(x=>x.modelo.trim()&&x.qtd>0);if(!valid.length)return showToast('Informe pelo menos um modelo e quantidade','error');valid.forEach(x=>{const old=state.estoque.find(e=>e.modelo.toLowerCase()===x.modelo.trim().toLowerCase());if(old){old.qtd=(+old.qtd||0)+(+x.qtd||0);if(x.preco)old.preco=x.preco;if(estoqueFoto)old.foto=estoqueFoto}else state.estoque.push({id:String(uid()),modelo:x.modelo.trim(),marca:x.marca.trim(),cor:x.cor.trim(),qtd:+x.qtd,preco:+x.preco||0,foto:estoqueFoto,data:today()})});saveAll();closeModal();showToast('Entrada registrada no estoque','success');renderEstoque()}
function ajustarEstoque(id,n){const x=state.estoque.find(e=>String(e.id)===String(id));if(!x)return;x.qtd=Math.max(0,(+x.qtd||0)+n);saveAll();renderEstoque()}
function removerEstoque(id){confirmDialog('Remover esta armação do estoque?',()=>{state.estoque=state.estoque.filter(x=>String(x.id)!==String(id));saveAll();renderEstoque()})}

function renderVendas(){
  const filtered=state.vendas.filter(v=>{
    if(!vendBusca)return true;
    const cli=state.clientes.find(c=>c.id===v.clienteId);
    return cli?.nome.toLowerCase().includes(vendBusca.toLowerCase())||v.descricao.toLowerCase().includes(vendBusca.toLowerCase());
  });
  const totalVendas=state.vendas.reduce((s,v)=>s+v.total,0);
  const ticket=state.vendas.length?totalVendas/state.vendas.length:0;
  document.getElementById('content').innerHTML=`
    <div class="page-header">
      <div><div class="page-title">Vendas</div><div class="page-sub">${state.vendas.length} transações registradas</div></div>
      <button class="btn btn-primary" onclick="abrirFormVenda()">+ Nova Venda</button>
    </div>
    <div class="grid3" style="margin-bottom:24px">
      ${[['💰 Total em Vendas',fmt(totalVendas),'#10b981'],['🎯 Ticket Médio',fmt(ticket),'#C9A84C'],['📦 Nº de Vendas',state.vendas.length,'#818cf8']].map(([l,v,c])=>`<div class="card"><div class="stat-label">${l}</div><div style="font-size:24px;font-weight:800;font-family:'Playfair Display',serif;color:${c};margin-top:8px">${v}</div></div>`).join('')}
    </div>
    <div style="margin-bottom:16px">
      <div class="search-bar">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input value="${esc(vendBusca)}" oninput="vendBusca=this.value;renderVendas()" placeholder="Buscar por cliente ou produto..."/>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Cliente</th><th>Produto/Serviço</th><th>Qtd</th><th>Total</th><th>Forma</th><th>Data</th><th>Ações</th></tr></thead>
        <tbody>
          ${filtered.length===0?`<tr><td colspan="7"><div class="empty"><div class="empty-icon">🛍️</div><p>Nenhuma venda encontrada</p></div></td></tr>`:
          filtered.map(v=>`<tr>
            <td style="font-weight:600">${esc(clienteNome(v.clienteId))}</td>
            <td style="color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(v.descricao)}</td>
            <td style="text-align:center;color:var(--dim)">${v.qtd}</td>

            <td style="color:var(--dim)">${fmtDate(v.data)}</td>

              <div style="display:flex;gap:5px">
                <button class="btn btn-whatsapp btn-xs" onclick="enviarWhatsAppVenda(${v.id})" title="Enviar comprovante">📲</button>
                <button class="btn btn-danger btn-xs" onclick="deletarVenda(${v.id})" title="Remover">🗑</button>
              </div>

          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  `;
}
function abrirFormVenda(){
  const cliOpts=state.clientes.map(c=>`<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  showModal(`
    <div class="modal-header"><h2>Nova Venda</h2><button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <div class="field"><label>Cliente <span class="req">*</span></label><select class="inp" id="vf_cli"><option value="">Selecione...</option>${cliOpts}</select></div>
      <div class="field"><label>Produto/Serviço <span class="req">*</span></label><input class="inp" id="vf_desc" placeholder="Ex: Óculos multifocal + armação"/></div>
      <div class="grid2">
        <div class="field"><label>Quantidade <span class="req">*</span></label><input class="inp" type="number" id="vf_qtd" value="1" min="1" oninput="calcTotal()"/></div>
        <div class="field"><label>Valor Unitário (R$) <span class="req">*</span></label><input class="inp" type="number" id="vf_vu" placeholder="0.00" oninput="calcTotal()"/></div>
      </div>
      <div id="vf_total_preview" style="background:var(--surface2);border-radius:8px;padding:12px;margin-bottom:12px;font-size:13px">
        <span style="color:var(--dim)">Total: </span><span id="vf_total" style="color:#10b981;font-weight:800;font-size:18px">R$ 0,00</span>
      </div>

        <div class="field"><label>Forma de Pagamento <span class="req">*</span></label>

          </select>
        </div>
        <div class="field" id="vf_parc_field" style="display:none"><label>Nº Parcelas</label>
          <select class="inp" id="vf_parc">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}x</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>Observações</label><textarea class="inp" id="vf_obs" placeholder="Observações adicionais..."></textarea></div>
      <div class="modal-footer">

function calcTotal(){
  const q=parseFloat(document.getElementById('vf_qtd')?.value||0);
  const u=parseFloat(document.getElementById('vf_vu')?.value||0);
  const el=document.getElementById('vf_total');
  if(el)el.textContent=fmt(isNaN(q*u)?0:q*u);
}
function toggleParc(){
  const f=document.getElementById('vf_forma')?.value;
  const pf=document.getElementById('vf_parc_field');
  if(pf)pf.style.display=(f==='Cartão'||f==='Crediário')?'block':'none';
}
function salvarVenda(){
  const cliId=parseInt(document.getElementById('vf_cli')?.value||0);
  const desc=document.getElementById('vf_desc')?.value?.trim()||'';
  const qtd=parseInt(document.getElementById('vf_qtd')?.value||1);
  const vu=parseFloat(document.getElementById('vf_vu')?.value||0);
  const forma=document.getElementById('vf_forma')?.value||'Pix';
  const parc=parseInt(document.getElementById('vf_parc')?.value||1);
  const obs=document.getElementById('vf_obs')?.value?.trim()||'';
  if(!cliId||!desc||!vu)return showToast('Preencha os campos obrigatórios','error');
  const novaVenda={id:uid(),clienteId:cliId,data:today(),descricao:desc,qtd,valorUnit:vu,total:+(qtd*vu).toFixed(2),forma,parcelas:parc,obs};
  state.vendas.push(novaVenda);
  saveAll();closeModal();showToast('Venda registrada!','success');renderVendas();
  // oferecer envio WA
  const tel=clienteTel(cliId);
  if(tel){
    setTimeout(()=>{
      if(confirm('Deseja enviar o comprovante pelo WhatsApp?')){
        const msg=gerarMsgVenda(novaVenda);
        modalWhatsApp('Comprovante de venda — '+clienteNome(cliId),msg,tel);
      }
    },400);
  }
}
function deletarVenda(id){
  confirmDialog('Deseja cancelar/remover esta venda?',()=>{
    state.vendas=state.vendas.filter(v=>v.id!==id);
    saveAll();showToast('Venda removida.','info');renderVendas();
  });
}
function enviarWhatsAppVenda(id){
  const v=state.vendas.find(x=>x.id===id);if(!v)return;
  const msg=gerarMsgVenda(v);
  const tel=clienteTel(v.clienteId);
  modalWhatsApp('Comprovante de venda — '+clienteNome(v.clienteId),msg,tel);
}

    localStorage.setItem('otica_api_key', k);
    showToast('Chave salva! IA ativada ✅', 'success');

  footer.appendChild(clearBtn);
  footer.appendChild(saveBtn);
  const backendTitle=document.createElement('div');backendTitle.style.cssText='font-size:11px;color:#C9A84C;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px';backendTitle.textContent='🔐 Backend seguro da IA';

let agFiltroData='';

function renderAgenda(){
  var today2=today();

    var cli0=state.clientes.find(function(c){return String(c.id)===String(ag.clienteId);})||{nome:''};
    var matchB=!agBusca||(cli0.nome||ag.nomeLivre||'').toLowerCase().includes(agBusca.toLowerCase());
    return matchD&&matchB;
  }).sort(function(a,b){return (a.data+a.horario).localeCompare(b.data+b.horario);});
  var hoje=filtered.filter(function(ag){return ag.data===today2&&ag.status!=='Cancelado';}).length;
  var pendentes=state.agenda.filter(function(ag){return ag.status==='Agendado'&&ag.data>=today2;}).length;
  var confirmados=state.agenda.filter(function(ag){return ag.status==='Confirmado'&&ag.data>=today2;}).length;
  var el=document.getElementById('page-agenda');

  var html='<div class="page-header"><h1>Agenda</h1><p>Agendamentos de exames</p>'
    +'<button class="btn btn-primary" onclick="abrirFormAgenda()">+ Agendar</button></div>'
    +'<div class="stats-grid" style="margin-bottom:16px">'
    +'<div class="stat-card"><div class="stat-label">HOJE</div><div class="stat-value">'+hoje+'</div><div class="stat-sub">agendamentos</div></div>'
    +'<div class="stat-card"><div class="stat-label">PENDENTES</div><div class="stat-value" style="color:#C9A84C">'+pendentes+'</div><div class="stat-sub">aguardando</div></div>'
    +'<div class="stat-card"><div class="stat-label">CONFIRMADOS</div><div class="stat-value" style="color:#10b981">'+confirmados+'</div><div class="stat-sub">proximos</div></div>'
    +'</div>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center">'
    +'<input type="date" class="inp" value="'+agFiltroData+'" style="max-width:180px" id="ag_filtro_data" oninput="agFiltroData=this.value;renderAgenda()">'
    +'<input class="inp" placeholder="Buscar cliente..." value="'+agBusca+'" id="ag_busca_input" style="flex:1;min-width:150px" oninput="agBusca=this.value;renderAgenda()">'
    +'</div>';
  if(filtered.length===0){
    html+='<div style="text-align:center;padding:40px;color:var(--dim)">Nenhum agendamento encontrado</div>';
  } else {
    filtered.forEach(function(ag){
      var cli=state.clientes.find(function(c){return String(c.id)===String(ag.clienteId);})||{};
      var sc=ag.status==='Confirmado'?'#10b981':ag.status==='Cancelado'?'#ef4444':'#C9A84C';
      var telAg=ag.telefone||(cli.celular||cli.telefone||'');
      var passado=ag.data<today2&&ag.status!=='Cancelado'&&ag.status!=='Realizado';
      html+='<div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:10px;'+(passado?'opacity:0.65':'')+'"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">'
        +'<div style="flex:1">'
        +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">'
        +'<span style="font-size:22px;font-weight:800;color:#C9A84C">'+ag.horario+'</span>'
        +'<span style="background:'+sc+'20;color:'+sc+';border:1px solid '+sc+'40;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700">'+ag.status+'</span>'
        +'<span style="font-size:12px;color:var(--dim)">'+esc(ag.tipoExame||'Exame de Vista')+'</span></div>'
        +'<div style="font-size:17px;font-weight:800;color:var(--text)">'+esc(cli.nome||ag.nomeLivre||'Sem nome')+'</div>'
        +'<div style="font-size:13px;color:#C9A84C;font-weight:700">'+fmtDate(ag.data)+' as '+ag.horario+'</div>'
        +(ag.profissional?'<div style="font-size:12px;color:var(--dim)">'+esc(ag.profissional)+'</div>':'')
        +(telAg?'<div style="font-size:12px;color:var(--dim)">'+esc(telAg)+'</div>':'')
        +(ag.obs?'<div style="font-size:12px;color:var(--muted)">'+esc(ag.obs)+'</div>':'')
        +'</div>'
        +'<div style="display:flex;flex-direction:column;gap:6px">'
        +'<div style="display:flex;gap:6px">'
        +'<div class="ag-id" style="display:none">'+ag.id+'</div>'
        +'<button class="btn btn-ghost btn-sm" data-id="'+ag.id+'" onclick="abrirFormAgenda(this.dataset.id)">✏️</button>'
        +'<button class="btn btn-danger btn-sm" data-id="'+ag.id+'" onclick="deletarAgenda(this.dataset.id)">🗑</button>'
        +'</div>'
        +(telAg?'<button class="btn btn-whatsapp btn-sm" data-id="'+ag.id+'" onclick="enviarAgendaWA(this.dataset.id,false)">📲 Avisar</button>':'')
        +(telAg?'<button class="btn btn-whatsapp btn-sm" style="background:#25d366" data-id="'+ag.id+'" onclick="enviarConfirmacaoWA(this.dataset.id)">✅ Confirmar</button>':'')
        +(ag.status!=='Confirmado'&&ag.status!=='Cancelado'?'<button class="btn btn-secondary btn-sm" style="background:#10b98120;color:#10b981;border:1px solid #10b98140" data-id="'+ag.id+'" onclick="confirmarAgenda(this.dataset.id)">Confirmar</button>':'')
        +(ag.status!=='Cancelado'?'<button class="btn btn-danger btn-sm" data-id="'+ag.id+'" onclick="cancelarAgenda(this.dataset.id)">Cancelar</button>':'')
        +'</div></div></div>';
    });
  }
  el.innerHTML=html;
  setTimeout(function(){var b=document.getElementById('ag_busca_input');if(b&&b.value){b.focus();try{b.setSelectionRange(b.value.length,b.value.length);}catch(e){}}},20);
}


function init(){
  renderNav();
  renderDashboard();
  renderClientes();
  renderReceituario();
  renderCrediario();
  renderVendas();
  renderAgenda();
  verificarAniversarios();
  updateClock();
  setInterval(updateClock,1000);
}

document.addEventListener('DOMContentLoaded',function(){init();});
</script>
</body>
</html>
