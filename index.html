function concluirMedicaoManualSemIA(){
  try{
    const a=window._manualPup?.p;
    if(!a||a.length<10){showToast('Marque os 10 pontos antes de calcular','error');return;}
    const cfg=window._manualPupConfig||{};
    const img=document.getElementById('manual_pup_img');
    const top=(a[6].y+a[8].y)/2,bot=(a[7].y+a[9].y)/2;
    const r={pupilOD_x:a[0].x,pupilOD_y:a[0].y,pupilOE_x:a[1].x,pupilOE_y:a[1].y,lensOD_x1:Math.min(a[2].x,a[3].x),lensOD_x2:Math.max(a[2].x,a[3].x),lensOE_x1:Math.min(a[4].x,a[5].x),lensOE_x2:Math.max(a[4].x,a[5].x),lensTop_y:top,lensBot_y:bot,lensOD_top_y:a[6].y,lensOD_bot_y:a[7].y,lensOE_top_y:a[8].y,lensOE_bot_y:a[9].y,compatibilidade:'Medição manual',observacoes:'Pontos marcados manualmente por posição na foto; confirme as medidas antes de finalizar.'};
    const m=calcularPupilometriaGeometrica(r,cfg.ref||'',cfg.tipo||'largura_lente',img);
    if(!m){showToast('Não foi possível calibrar a medida. Confira a referência e os pontos.','error');return;}
    Object.assign(r,m);
    const erros=[];
    if(!(r.dpTotal>=45&&r.dpTotal<=85))erros.push('DP total fora da faixa de validação (45–85 mm)');
    if(!(r.dpOD>=20&&r.dpOD<=45)||!(r.dpOE>=20&&r.dpOE<=45))erros.push('DNP monocular fora da faixa de validação (20–45 mm)');
    if(!(r.coOD>=5&&r.coOD<=45)||!(r.coOE>=5&&r.coOE<=45))erros.push('altura pupilar fora da faixa de validação (5–45 mm)');
    if(!(r.ponteArmacao>=5&&r.ponteArmacao<=35))erros.push('ponte fora da faixa de validação (5–35 mm)');
    if(Math.abs((r.dpOD+r.dpOE)-r.dpTotal)>1.5)erros.push('DP total não confere com a soma das DNPs');
    if(erros.length){
      const box=document.querySelector('#manual-pup-overlay .modal');
      if(box){const pontosDiag=a.map((p,i)=>(i+1)+'. '+window._manualPup.nomes[i]+': x='+p.x.toFixed(4)+' y='+p.y.toFixed(4)).join('<br>');const diag=[['DP Total',r.dpTotal],['DNP OD',r.dpOD],['DNP OE',r.dpOE],['Altura OD',r.coOD],['Altura OE',r.coOE],['Ponte',r.ponteArmacao],['Escala mm/px',r.escalaUsada],['Referência',cfg.ref+' mm · '+cfg.tipo],['10 pontos',pontosDiag]].map(x=>'<div style="padding:7px 8px;border-bottom:1px solid #fee2e2"><b>'+x[0]+':</b> '+x[1]+'</div>').join('');box.innerHTML='<div style="padding:18px"><div style="font-size:20px;font-weight:900;color:#e30613;margin-bottom:8px">Medição precisa ser refeita</div><div style="font-size:13px;line-height:1.6;margin-bottom:12px">O sistema bloqueou valores geometricamente incompatíveis:</div><div style="padding:12px;border:1px solid #fecaca;background:#fef2f2;border-radius:9px;color:#991b1b">'+erros.map(e=>'• '+e).join('<br>')+'</div><div style="font-size:13px;font-weight:900;margin-top:14px">Diagnóstico da medição</div><div style="margin-top:6px;border:1px solid #fee2e2;border-radius:9px;overflow:hidden;font-size:12px">'+diag+'</div><div style="font-size:12px;color:var(--muted);margin-top:12px">Esses valores são apenas para diagnóstico e não serão aplicados à receita.</div><div class="modal-footer"><button type="button" class="btn btn-primary" onclick="closeManualPupModal()">Voltar e medir novamente</button></div></div>';}
      showToast('Medição bloqueada por inconsistência geométrica','error');return;
    }
    _pupilometriaAtual=r;window._manualPupResultado=r;
    const cards=[['DP Total',r.dpTotal],['DNP OD',r.dpOD],['DNP OE',r.dpOE],['Altura OD',r.coOD],['Altura OE',r.coOE],['Ponte',r.ponteArmacao]].map(x=>'<div style="padding:10px;border:1px solid #e2e8f0;border-radius:8px;text-align:center"><small>'+x[0]+'</small><div style="font-size:18px;font-weight:900">'+x[1]+' mm</div></div>').join('');
    const box=document.querySelector('#manual-pup-overlay .modal');
    if(box){
      box.innerHTML='<div style="padding:18px"><div style="font-size:20px;font-weight:900;color:#e30613;margin-bottom:6px">Medidas calculadas</div><div style="font-size:12px;color:var(--muted);margin-bottom:14px">Resultado geométrico calibrado pela referência física informada.</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">'+cards+'</div><div style="margin-top:16px"><button id="manual_pup_concluir" class="btn btn-primary" type="button" style="display:block;width:100%;min-height:54px;position:relative;z-index:20;touch-action:manipulation">Aplicar medidas e concluir</button></div></div>';
      const aplicar=()=>{
        const rr=window._manualPupResultado||_pupilometriaAtual;
        if(rr){[['rf_dpD','dpOD'],['rf_dpE','dpOE'],['rf_coD','coOD'],['rf_coE','coOE'],['rf_dpL','dpTotal']].forEach(([id,k])=>{const el=document.getElementById(id);if(el&&Number.isFinite(Number(rr[k])))el.value=rr[k];});}
        closeManualPupModal();
        showToast('Medidas aplicadas à receita','success');
      };
      const b=box.querySelector('#manual_pup_concluir');
      if(b){b.onclick=aplicar;b.ontouchend=e=>{e.preventDefault();aplicar();};}
    }
    showToast('Medidas calculadas sem IA','success');
  }catch(e){console.error('Erro pupilometria manual',e);showToast('Erro ao calcular: '+(e?.message||'falha inesperada'),'error');}
}

function desenharMedidas(imgEl, r) {
  const wrapper = imgEl.parentElement;
  const w = imgEl.naturalWidth  || imgEl.width  || 800;
  const h = imgEl.naturalHeight || imgEl.height || 500;

  const canvas = document.createElement('canvas');
  canvas.width  = w;
  canvas.height = h;
  canvas.style.cssText = 'width:100%;max-height:320px;object-fit:contain;border-radius:10px;border:2px solid #C9A84C;display:block';

  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.onload = function() {
    ctx.drawImage(img, 0, 0, w, h);

    // Só desenhar medições quando a IA devolver geometria completa e válida.
    // Nunca substituir coordenadas ausentes por posições estimadas.
    const coord01 = v => Number.isFinite(Number(v)) && Number(v) >= 0 && Number(v) <= 1;
    const temCoords = [
      r.pupilOD_x,r.pupilOD_y,r.pupilOE_x,r.pupilOE_y,
      r.lensOD_x1,r.lensOD_x2,r.lensOE_x1,r.lensOE_x2,
      r.lensTop_y,r.lensBot_y
    ].every(coord01);

    if(!temCoords){
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.78)';
      ctx.fillRect(0,h*0.82,w,h*0.18);
      ctx.fillStyle='#f59e0b';
      ctx.font='bold '+Math.max(13,w*0.018)+'px sans-serif';
      ctx.fillText('MEDIÇÃO NÃO CONFIRMADA',w*0.03,h*0.88);
      ctx.fillStyle='#ffffff';
      ctx.font=Math.max(11,w*0.014)+'px sans-serif';
      ctx.fillText('Pontos geométricos insuficientes. Refaça a captura frontal.',w*0.03,h*0.93);
      ctx.restore();
      if(wrapper){ wrapper.innerHTML=''; wrapper.appendChild(canvas); }
      return;
    }

    const cx  = w * 0.50;
    const fW  = w * 0.72;
    const lW  = temCoords
      ? (r.lensOD_x2 ? (parseFloat(r.lensOD_x2)-parseFloat(r.lensOD_x1||0.25))*w : fW*0.24)
      : fW * 0.24;
    const lH  = temCoords
      ? (r.lensBot_y ? (parseFloat(r.lensBot_y)-parseFloat(r.lensTop_y||0.37))*h : lW*0.62)
      : lW * 0.62;
    const ey  = temCoords ? parseFloat(r.pupilOD_y)*h : h * 0.42;
    const pupOD = temCoords ? parseFloat(r.pupilOD_x)*w : cx - fW*0.02 - lW*0.5;
    const pupOE = temCoords ? parseFloat(r.pupilOE_x)*w : cx + fW*0.02 + lW*0.5;
    const lOD_x1 = temCoords && r.lensOD_x1 ? parseFloat(r.lensOD_x1)*w : pupOD - lW/2;
    const lOD_x2 = temCoords && r.lensOD_x2 ? parseFloat(r.lensOD_x2)*w : pupOD + lW/2;
    const lOE_x1 = temCoords && r.lensOE_x1 ? parseFloat(r.lensOE_x1)*w : pupOE - lW/2;
    const lOE_x2 = temCoords && r.lensOE_x2 ? parseFloat(r.lensOE_x2)*w : pupOE + lW/2;
    const lens_top = temCoords && r.lensTop_y ? parseFloat(r.lensTop_y)*h : ey - lH/2;
    const lens_bot = temCoords && r.lensBot_y ? parseFloat(r.lensBot_y)*h : ey + lH/2;

    // Helper: draw a line with label
    function linha(x1,y1,x2,y2, cor, label, labelPos) {
      ctx.save();
      ctx.strokeStyle = cor;
      ctx.lineWidth   = Math.max(2, w*0.003);
      ctx.setLineDash([8,4]);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      // End ticks
      ctx.setLineDash([]);
      const tickH = h*0.018;
      ctx.beginPath(); ctx.moveTo(x1,y1-tickH); ctx.lineTo(x1,y1+tickH); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x2,y2-tickH); ctx.lineTo(x2,y2+tickH); ctx.stroke();
      // Label background
      if(label) {
        ctx.font = `bold ${Math.max(14,w*0.022)}px DM Sans, sans-serif`;
        const tw = ctx.measureText(label).width;
        const lx = labelPos==='left' ? Math.min(x1,x2) : (x1+x2)/2 - tw/2;
        const ly = y1 - h*0.025;
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(lx-4, ly-parseInt(ctx.font)-2, tw+8, parseInt(ctx.font)+8);
        ctx.fillStyle = cor;
        ctx.fillText(label, lx, ly);
      }
      ctx.restore();
    }

    // Helper: draw pupil dot
    function pupila(x, y, cor, label) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, Math.max(6, w*0.012), 0, Math.PI*2);
      ctx.strokeStyle = cor;
      ctx.lineWidth = Math.max(2.5, w*0.004);
      ctx.stroke();
      ctx.fillStyle = cor + '40';
      ctx.fill();
      // cross hair
      const cz = Math.max(10, w*0.018);
      ctx.beginPath(); ctx.moveTo(x-cz,y); ctx.lineTo(x+cz,y);
      ctx.moveTo(x,y-cz); ctx.lineTo(x,y+cz);
      ctx.strokeStyle = cor;
      ctx.lineWidth = Math.max(1.5, w*0.002);
      ctx.stroke();
      // label
      if(label) {
        ctx.font = `bold ${Math.max(12,w*0.018)}px DM Sans, sans-serif`;
        const tw = ctx.measureText(label).width;
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(x+8, y-16, tw+8, 20);
        ctx.fillStyle = cor;
        ctx.fillText(label, x+12, y-2);
      }
      ctx.restore();
    }

    function lente(x1, y1, x2, y2, cor) {
      ctx.save();
      ctx.strokeStyle = cor;
      ctx.lineWidth = Math.max(2.5, w*0.004);
      ctx.setLineDash([6,3]);
      ctx.strokeRect(x1, y1, x2-x1, y2-y1);
      // Cantos destacados
      ctx.setLineDash([]);
      const cs = Math.min(15, (x2-x1)*0.2);
      ctx.lineWidth = Math.max(3, w*0.005);
      [[x1,y1],[x2,y1],[x1,y2],[x2,y2]].forEach(function([cx2,cy2]){
        const sx = cx2===x1?1:-1, sy = cy2===y1?1:-1;
        ctx.beginPath();
        ctx.moveTo(cx2+sx*cs,cy2); ctx.lineTo(cx2,cy2); ctx.lineTo(cx2,cy2+sy*cs);
        ctx.stroke();
      });
      ctx.restore();
    }

    const numeroMM = v => {
      const n = Number(String(v ?? '').replace(',','.'));
      return Number.isFinite(n) && n > 0 ? n : null;
    };
    const formatMM = v => {
      const n = numeroMM(v);
      return n===null ? '—' : n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
    };
    const odNum = numeroMM(r.dpOD);
    const oeNum = numeroMM(r.dpOE);
    const totalNum = odNum!==null && oeNum!==null ? odNum+oeNum : numeroMM(r.dpTotal);
    const dpTotal = totalNum===null ? '—' : totalNum.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
    const dpOD    = formatMM(r.dpOD);
    const dpOE    = formatMM(r.dpOE);
    const coOD    = r.coOD || '—';
    const coOE    = r.coOE || '—';
    const larg    = r.larguraArmacao || '—';
    const alt     = r.alturaLente    || '—';
    const ponte   = r.ponteArmacao   || '—';

    // Lentes com bordas reais
    lente(lOD_x1, lens_top, lOD_x2, lens_bot, '#C9A84C');
    lente(lOE_x1, lens_top, lOE_x2, lens_bot, '#C9A84C');

    // DP Total linha acima das lentes
    const dpY = lens_top - h*0.05;
    linha(pupOD, dpY, pupOE, dpY, '#C9A84C', 'DP '+dpTotal+'mm');

    // DP OD — ponte até pupila OD
    const bridgeCx = (lOD_x2 + lOE_x1) / 2;
    linha(bridgeCx, dpY + h*0.04, pupOD, dpY + h*0.04, '#f0c040', 'OD '+dpOD+'mm');

    // DP OE — ponte até pupila OE
    linha(bridgeCx, dpY + h*0.07, pupOE, dpY + h*0.07, '#f0c040', 'OE '+dpOE+'mm');

    // Largura da lente OD
    const largBot = lens_bot + h*0.03;
    linha(lOD_x1, largBot, lOD_x2, largBot, '#10b981', 'L:'+larg+'mm');

    // Altura da lente OE
    const altX = lOE_x2 + w*0.025;
    linha(altX, lens_top, altX, lens_bot, '#10b981', 'A:'+alt+'mm');

    // Ponte
    linha(lOD_x2, ey, lOE_x1, ey, '#818cf8', 'P:'+ponte+'mm');

    // CO OD — vertical da pupila até base da lente
    ctx.save();
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = Math.max(2, w*0.003);
    ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(pupOD, ey); ctx.lineTo(pupOD, lens_bot); ctx.stroke();
    ctx.setLineDash([]);
    // Tick na base
    ctx.beginPath(); ctx.moveTo(pupOD-6,lens_bot); ctx.lineTo(pupOD+6,lens_bot); ctx.stroke();
    ctx.font = 'bold '+Math.max(11,w*0.016)+'px sans-serif';
    ctx.fillStyle = '#a78bfa';
    ctx.fillText('CO '+coOD+'mm', pupOD+6, (ey+lens_bot)/2);
    ctx.restore();

    // CO OE
    ctx.save();
    ctx.strokeStyle = '#a78bfa';
    ctx.lineWidth = Math.max(2, w*0.003);
    ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(pupOE, ey); ctx.lineTo(pupOE, lens_bot); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(pupOE-6,lens_bot); ctx.lineTo(pupOE+6,lens_bot); ctx.stroke();
    ctx.font = 'bold '+Math.max(11,w*0.016)+'px sans-serif';
    ctx.fillStyle = '#a78bfa';
    ctx.fillText('CO '+coOE+'mm', pupOE-w*0.08, (ey+lens_bot)/2);
    ctx.restore();

    // Marcador pupilar — círculo + crosshair estilo B-15
    function marcadorPupila(px, py, cor, label) {
      const r2 = Math.max(8, w*0.015);
      // Glow externo
      const grad = ctx.createRadialGradient(px,py,r2*0.3,px,py,r2*1.8);
      grad.addColorStop(0, cor+'60');
      grad.addColorStop(1, 'transparent');
      ctx.save();
      ctx.beginPath(); ctx.arc(px,py,r2*1.8,0,Math.PI*2);
      ctx.fillStyle = grad; ctx.fill();
      // Círculo principal
      ctx.beginPath(); ctx.arc(px,py,r2,0,Math.PI*2);
      ctx.strokeStyle=cor; ctx.lineWidth=Math.max(2.5,w*0.004); ctx.stroke();
      ctx.fillStyle=cor+'30'; ctx.fill();
      // Crosshair
      const cz = r2*1.6;
      ctx.setLineDash([3,2]);
      ctx.beginPath();
      ctx.moveTo(px-cz,py); ctx.lineTo(px-r2,py);
      ctx.moveTo(px+r2,py); ctx.lineTo(px+cz,py);
      ctx.moveTo(px,py-cz); ctx.lineTo(px,py-r2);
      ctx.moveTo(px,py+r2); ctx.lineTo(px,py+cz);
      ctx.strokeStyle=cor; ctx.lineWidth=Math.max(1.5,w*0.002); ctx.stroke();
      ctx.setLineDash([]);
      // Label
      if(label){
        ctx.font='bold '+Math.max(12,w*0.018)+'px sans-serif';
        const tw=ctx.measureText(label).width;
        const lx=px+r2+4, ly=py-4;
        ctx.fillStyle='rgba(0,0,0,0.7)';
        ctx.fillRect(lx-2,ly-14,tw+8,18);
        ctx.fillStyle=cor; ctx.fillText(label,lx+2,ly);
      }
      ctx.restore();
    }

    marcadorPupila(pupOD, Number(r.pupilOD_y)*h, '#ff4444', 'OD '+dpOD+'mm');
    marcadorPupila(pupOE, Number(r.pupilOE_y)*h, '#22c55e', 'OE '+dpOE+'mm');

    // Linha central vertical (nariz)
    ctx.save();
    ctx.strokeStyle='rgba(255,255,255,0.25)';
    ctx.lineWidth=1; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(bridgeCx,h*0.05); ctx.lineTo(bridgeCx,h*0.92); ctx.stroke();
    ctx.restore();

    // Watermark
    ctx.save();
    ctx.font='bold '+Math.max(11,w*0.016)+'px sans-serif';
    ctx.fillStyle='rgba(201,168,76,0.7)';
    ctx.fillText('Ótica lclass — Pupilometria IA', w*0.02, h*0.97);
    ctx.restore();

    if(wrapper){ wrapper.innerHTML=''; wrapper.appendChild(canvas); }
  };
  img.src = imgEl.src;
}

function calcularPupilometriaGeometrica(r, referenciaValor, referenciaTipo, imgEl){
  const n=v=>{const x=Number(String(v??'').replace(',','.'));return Number.isFinite(x)?x:null;};
  const ref=n(referenciaValor),W=Number(imgEl?.naturalWidth||r.imageWidth||0),H=Number(imgEl?.naturalHeight||r.imageHeight||0);
  const xOD=n(r.pupilOD_x),yOD=n(r.pupilOD_y),xOE=n(r.pupilOE_x),yOE=n(r.pupilOE_y);
  const od1=n(r.lensOD_x1),od2=n(r.lensOD_x2),oe1=n(r.lensOE_x1),oe2=n(r.lensOE_x2);
  const top=n(r.lensTop_y),bot=n(r.lensBot_y);
  const vals=[xOD,yOD,xOE,yOE,od1,od2,oe1,oe2,top,bot];
  if(!(ref>0)||!(W>0)||!(H>0)||vals.some(v=>v===null||v<0||v>1))return null;
  const pxX=v=>v*W,pxY=v=>v*H;
  const lentes=[
    {min:Math.min(pxX(od1),pxX(od2)),max:Math.max(pxX(od1),pxX(od2))},
    {min:Math.min(pxX(oe1),pxX(oe2)),max:Math.max(pxX(oe1),pxX(oe2))}
  ].map(l=>({...l,centro:(l.min+l.max)/2})).sort((a,b)=>a.centro-b.centro);
  const esq=lentes[0],dir=lentes[1],larg1=esq.max-esq.min,larg2=dir.max-dir.min;
  const ponte=Math.max(0,dir.min-esq.max),larguraTotal=dir.max-esq.min,centroPonte=(esq.max+dir.min)/2;
  const altura=Math.abs(pxY(bot)-pxY(top));
  let pxRef=null;
  if(referenciaTipo==='largura_total')pxRef=larguraTotal;
  else if(referenciaTipo==='largura_lente')pxRef=(larg1+larg2)/2;
  else if(referenciaTipo==='ponte')pxRef=ponte;
  else if(referenciaTipo==='altura_lente')pxRef=altura;
  if(!(pxRef>0))return null;
  const mmPorPx=ref/pxRef,round=v=>Math.round(v*100)/100;
  const odBot=n(r.lensOD_bot_y),oeBot=n(r.lensOE_bot_y);
  return {
    dpOD:round(Math.abs(centroPonte-pxX(xOD))*mmPorPx),
    dpOE:round(Math.abs(pxX(xOE)-centroPonte)*mmPorPx),
    dpTotal:round(Math.abs(pxX(xOE)-pxX(xOD))*mmPorPx),
    coOD:round(Math.abs(pxY(odBot!==null?odBot:bot)-pxY(yOD))*mmPorPx),
    coOE:round(Math.abs(pxY(oeBot!==null?oeBot:bot)-pxY(yOE))*mmPorPx),
    larguraArmacao:round(larguraTotal*mmPorPx),alturaLente:round(altura*mmPorPx),
    ponteArmacao:round(ponte*mmPorPx),escalaUsada:round(mmPorPx),calibracao:'pixel'
  };
}
function validarCapturaPupilometria(r){
  const n=v=>{const x=Number(String(v??'').replace(',','.'));return Number.isFinite(x)?x:null;};
  const xOD=n(r.pupilOD_x), yOD=n(r.pupilOD_y), xOE=n(r.pupilOE_x), yOE=n(r.pupilOE_y);
  const od1=n(r.lensOD_x1), od2=n(r.lensOD_x2), oe1=n(r.lensOE_x1), oe2=n(r.lensOE_x2);
  const top=n(r.lensTop_y), bot=n(r.lensBot_y);
  const vals=[xOD,yOD,xOE,yOE,od1,od2,oe1,oe2,top,bot];
  const problemas=[];
  if(vals.some(v=>v===null||v<0||v>1)){
    problemas.push('Pontos geométricos incompletos ou fora da imagem.');
    return {ok:false,problemas};
  }
  const distPup=Math.abs(xOE-xOD);
  const largOD=Math.abs(od2-od1), largOE=Math.abs(oe2-oe1);
  const altura=Math.abs(bot-top);
  const desnivel=Math.abs(yOD-yOE);
  const assimLentes=Math.abs(largOD-largOE)/Math.max(largOD,largOE,0.0001);
  const centroPup=(xOD+xOE)/2;
  const centroArm=(Math.min(od1,oe1)+Math.max(od2,oe2))/2;
  const descentralizacao=Math.abs(centroPup-centroArm);

  if(distPup<0.12||distPup>0.55) problemas.push('Distância entre pupilas incompatível com uma captura frontal confiável.');
  if(altura<0.08) problemas.push('Altura das lentes insuficiente para calibração.');
  if(desnivel>0.035) problemas.push('Cabeça ou câmera inclinada: olhos fora do mesmo nível.');
  if(assimLentes>0.18) problemas.push('Perspectiva excessiva: as lentes aparecem com larguras muito diferentes.');
  if(descentralizacao>0.07) problemas.push('Rosto/armação muito descentralizados na captura.');
  if(!(xOD>od1&&xOD<od2)) problemas.push('Pupila OD detectada fora dos limites da lente.');
  if(!(xOE>oe1&&xOE<oe2)) problemas.push('Pupila OE detectada fora dos limites da lente.');
  if(!(yOD>top&&yOD<bot&&yOE>top&&yOE<bot)) problemas.push('Centro pupilar detectado fora da altura útil das lentes.');

  return {ok:problemas.length===0,problemas};
}

let _pupilometriaAtual=null;

function abrirAjustePupilar(){
  const base64=document.getElementById('rf_foto_hidden')?.value;
  if(!base64||!_pupilometriaAtual){showToast('Analise uma foto primeiro','error');return;}
  const r=_pupilometriaAtual;
  if(![r.pupilOD_x,r.pupilOD_y,r.pupilOE_x,r.pupilOE_y].every(v=>Number.isFinite(Number(v)))){
    showToast('Pontos pupilares não disponíveis','error');return;
  }
  const html='<div style="padding:18px"><div style="font-size:18px;font-weight:800;color:#C9A84C;margin-bottom:6px">Ajuste manual dos centros pupilares</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:12px">Toque primeiro no centro da pupila OD e depois no centro da pupila OE. O sistema recalcula as medidas sem nova chamada de IA.</div>'
    +'<div id="ajuste_pup_wrap" style="position:relative;overflow:hidden;border:2px solid #C9A84C;border-radius:10px"><img id="ajuste_pup_img" src="'+base64+'" style="display:block;width:100%;height:auto"><canvas id="ajuste_pup_canvas" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas></div>'
    +'<div id="ajuste_pup_status" style="font-size:12px;color:#f59e0b;margin-top:10px">Próximo ponto: OD</div>'
    +'<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button id="ajuste_pup_salvar" class="btn btn-primary" disabled onclick="salvarAjustePupilar()">Recalcular medidas</button></div></div>';
  openModal(html,'modal-lg');
  setTimeout(iniciarAjustePupilar,80);
}

function iniciarAjustePupilar(){
  const img=document.getElementById('ajuste_pup_img'), canvas=document.getElementById('ajuste_pup_canvas');
  if(!img||!canvas)return;
  const iniciar=()=>{
    canvas.width=img.naturalWidth||1000; canvas.height=img.naturalHeight||600;
    window._ajustePup={passo:0,pontos:[]};
    const ctx=canvas.getContext('2d');
    const redesenhar=()=>{
      ctx.clearRect(0,0,canvas.width,canvas.height);
      window._ajustePup.pontos.forEach((p,i)=>{
        ctx.beginPath();ctx.arc(p.x*canvas.width,p.y*canvas.height,Math.max(8,canvas.width*.012),0,Math.PI*2);
        ctx.strokeStyle=i===0?'#ef4444':'#22c55e';ctx.lineWidth=Math.max(3,canvas.width*.004);ctx.stroke();
        ctx.font='bold '+Math.max(14,canvas.width*.018)+'px sans-serif';ctx.fillStyle=i===0?'#ef4444':'#22c55e';
        ctx.fillText(i===0?'OD':'OE',p.x*canvas.width+12,p.y*canvas.height-10);
      });
    };
    const marcar=ev=>{
      const rect=canvas.getBoundingClientRect();
      const clientX=ev.touches?ev.touches[0].clientX:ev.clientX, clientY=ev.touches?ev.touches[0].clientY:ev.clientY;
      const p={x:Math.min(1,Math.max(0,(clientX-rect.left)/rect.width)),y:Math.min(1,Math.max(0,(clientY-rect.top)/rect.height))};
      if(window._ajustePup.passo<2) window._ajustePup.pontos[window._ajustePup.passo]=p;
      window._ajustePup.passo=Math.min(2,window._ajustePup.passo+1); redesenhar();
      const st=document.getElementById('ajuste_pup_status'), bt=document.getElementById('ajuste_pup_salvar');
      if(window._ajustePup.passo===1)st.textContent='Próximo ponto: OE';
      if(window._ajustePup.passo===2){st.textContent='OD e OE marcados. Confira os centros e recalcule.';bt.disabled=false;}
    };
    canvas.addEventListener('click',marcar);
  };
  if(img.complete)iniciar();else img.onload=iniciar;
}

function salvarAjustePupilar(){
  if(!_pupilometriaAtual||!window._ajustePup||window._ajustePup.pontos.length<2)return;
  const [od,oe]=window._ajustePup.pontos;
  _pupilometriaAtual.pupilOD_x=od.x;_pupilometriaAtual.pupilOD_y=od.y;
  _pupilometriaAtual.pupilOE_x=oe.x;_pupilometriaAtual.pupilOE_y=oe.y;
  const rv=(document.getElementById('rf_ref_largura')||{value:''}).value.trim();
  const rt=(document.getElementById('rf_ref_tipo')||{value:'largura_total'}).value;
  const qualidade=validarCapturaPupilometria(_pupilometriaAtual);
  const imgEl=document.querySelector('#rf_foto_preview img');
  const medidas=qualidade.ok?calcularPupilometriaGeometrica(_pupilometriaAtual,rv,rt,imgEl):null;
  if(!medidas){showToast('Ajuste não passou pela validação geométrica','error');return;}
  Object.assign(_pupilometriaAtual,medidas);
  [['rf_dpD','dpOD'],['rf_dpE','dpOE'],['rf_coD','coOD'],['rf_coE','coOE']].forEach(([id,k])=>{const el=document.getElementById(id);if(el)el.value=_pupilometriaAtual[k];});
  closeModal();
  if(imgEl)desenharMedidas(imgEl,_pupilometriaAtual);
  showToast('Pontos ajustados e medidas recalculadas','success');
}

async function analisarFotoIA(){
  var base64Full=document.getElementById('rf_foto_hidden')&&document.getElementById('rf_foto_hidden').value;
  if(!base64Full){showToast('Nenhuma foto selecionada','error');return;}
  var btn=document.getElementById('btn_analisar_ia');
  var res=document.getElementById('rf_ia_resultado');
  if(btn){btn.disabled=true;btn.textContent='Analisando...';}
  if(res){res.style.display='block';res.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted)">Analisando foto...</div>';}
  try{
    var rv=(document.getElementById('rf_ref_largura')||{value:''}).value.trim();
    var rt=(document.getElementById('rf_ref_tipo')||{value:'largura_total'}).value;
    var r=await chamarIABackend('pupilometria',base64Full,{referenciaValor:rv,referenciaTipo:rt});
    _pupilometriaAtual=r;
    var qualidade=validarCapturaPupilometria(r);
    var imgEl=document.querySelector('#rf_foto_preview img');
    var medidas=qualidade.ok?calcularPupilometriaGeometrica(r,rv,rt,imgEl):null;
    var escalaConfiavel=!!medidas;
    // A IA fornece os pontos. Os milímetros são calculados localmente a partir da referência física.
    if(medidas){
      Object.assign(r,medidas);
    }else{
      r.dpOD=''; r.dpOE=''; r.dpTotal=''; r.coOD=''; r.coOE='';
      r.larguraArmacao=''; r.alturaLente=''; r.ponteArmacao=''; r.escalaUsada='';
    }
    if(escalaConfiavel&&r.dpOD){var el=document.getElementById('rf_dpD');if(el)el.value=r.dpOD;}
    if(escalaConfiavel&&r.dpOE){var el=document.getElementById('rf_dpE');if(el)el.value=r.dpOE;}
    if(escalaConfiavel&&r.coOD){var el=document.getElementById('rf_coD');if(el)el.value=r.coOD;}
    if(escalaConfiavel&&r.coOE){var el=document.getElementById('rf_coE');if(el)el.value=r.coOE;}

    var nOD=Number(String(r.dpOD||'').replace(',','.')), nOE=Number(String(r.dpOE||'').replace(',','.'));
    var dpT=r.dpTotal||((Number.isFinite(nOD)&&nOD>0&&Number.isFinite(nOE)&&nOE>0)?(nOD+nOE).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2}):'---');
    var cc=r.compatibilidade==='Sim'?'#10b981':r.compatibilidade==='Parcial'?'#C9A84C':'#ef4444';
    var mm=v=>(v!==''&&v!=null&&v!=='---')?v+' mm':'—';
    var itens=[['DP Total',mm(dpT),'#C9A84C'],['DNP OD',mm(r.dpOD),'#C9A84C'],['DNP OE',mm(r.dpOE),'#C9A84C'],
      ['Altura OD',mm(r.coOD),'#818cf8'],['Altura OE',mm(r.coOE),'#818cf8'],
      ['Largura',mm(r.larguraArmacao),'#10b981'],['Altura lente',mm(r.alturaLente),'#10b981'],['Ponte',mm(r.ponteArmacao),'#10b981']];
    res.innerHTML='<div style="background:#080e1a;border:1px solid #C9A84C;border-radius:12px;padding:14px">'
      +'<div style="font-size:12px;color:#C9A84C;font-weight:700;margin-bottom:10px">Pupilometria IA</div>'
      +(r.numerosArmacao&&r.numerosArmacao.length>2&&r.numerosArmacao.indexOf('null')<0?'<div style="background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:8px;margin-bottom:8px;font-size:12px">Armacao: <strong>'+r.numerosArmacao+'</strong></div>':'')
      +'<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px">'
      +itens.map(function(it){return '<div style="background:var(--surface);border-radius:8px;padding:8px;text-align:center"><div style="font-size:10px;color:var(--dim)">'+it[0]+'</div><div style="font-size:14px;font-weight:800;color:'+it[2]+'">'+it[1]+'</div></div>';}).join('')
      +'</div><div style="padding:8px;background:'+cc+'15;border:1px solid '+cc+'40;border-radius:8px;font-size:12px;color:'+cc+'">'
      +(r.compatibilidade||'---')+': '+(r.observacoes||'')+'</div>'
      +(qualidade.ok?'':'<div style="margin-top:8px;padding:8px;background:rgba(245,158,11,.10);border:1px solid rgba(245,158,11,.35);border-radius:8px;color:#f59e0b;font-size:11px"><strong>Refaça a captura:</strong> '+qualidade.problemas.map(esc).join(' ')+'</div>')
      +'<button type="button" class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="abrirAjustePupilar()">🎯 Ajustar centros pupilares manualmente</button>'
      +'<div style="font-size:10px;color:var(--dim);margin-top:6px">'+(escalaConfiavel?'* Medição assistida: captura aprovada pelos controles geométricos. Confirme antes de finalizar a receita.':qualidade.ok?'* Captura aprovada, porém sem referência física válida: medidas em mm não foram calculadas.':'* Captura reprovada pelos controles geométricos: nenhuma medida em mm foi aceita.')+'</div></div>';
    showToast('Analise concluida!','success');
  }catch(err){
    console.error('Erro IA:',err);
    if(res)res.innerHTML='<div style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:14px;color:#ef4444;font-size:13px">Erro: '+err.message+'</div>';
    showToast('Erro na analise','error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='Analisar com IA';}
  }
}

function calcularParcelasCrediario(valor,juros,numero){
  // Valores monetários e juros são calculados como inteiros, sem multiplicação decimal.
  function unidades(texto,casas){
    const m=String(texto).trim().match(new RegExp('^([+-]?)(\\d*)(?:[.,](\\d{0,'+casas+'}))?$'));
    if(!m||!(m[2]||m[3]))throw new Error('Informe valores válidos para o contrato');
    return BigInt((m[1]==='-'?'-':'')+(m[2]||'0')+(m[3]||'').padEnd(casas,'0'));
  }
  const n=Number(numero),base=unidades(valor,2),taxa=unidades(juros||'0',6);
  const escala=100000000n; // Percentual com até seis casas decimais.
  if(!Number.isInteger(n)||n<1||n>24||base<=0n||escala+taxa<=0n)throw new Error('Informe valor e número de parcelas válidos');
  const total=(base*(escala+taxa)+escala/2n)/escala;
  if(total<=0n||base>BigInt(Number.MAX_SAFE_INTEGER)||total>BigInt(Number.MAX_SAFE_INTEGER))throw new Error('Valor do contrato fora do limite suportado');
  const parcela=total/BigInt(n),resto=Number(total%BigInt(n));
  return {valorBase:Number(base)/100,juros:Number(taxa)/1000000,totalCentavos:Number(total),
    parcelasCentavos:Array.from({length:n},(_,i)=>Number(parcela)+(i<resto?1:0))};
}
function vencimentoMensalCrediario(dataOriginal,meses){
  const original=new Date(dataOriginal+'T00:00:00Z');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(dataOriginal)||!Number.isFinite(original.getTime())||original.toISOString().slice(0,10)!==dataOriginal||!Number.isInteger(meses)||meses<0)throw new Error('Informe uma data válida para a primeira parcela');
  const venc=new Date(original);
  venc.setUTCDate(1);
  venc.setUTCMonth(original.getUTCMonth()+meses);
  const fim=new Date(venc);
  fim.setUTCMonth(fim.getUTCMonth()+1,0);
  venc.setUTCDate(Math.min(original.getUTCDate(),fim.getUTCDate()));
  return venc.toISOString().split('T')[0];
}
function calcParcela(){
  const el=document.getElementById('crd_vp');
  if(!el)return;
  try{
    const plano=calcularParcelasCrediario(document.getElementById('crd_total')?.value||'0',document.getElementById('crd_juros')?.value||'0',document.getElementById('crd_parc')?.value||'1');
    const menor=Math.min(...plano.parcelasCentavos),maior=Math.max(...plano.parcelasCentavos);
    el.textContent=menor===maior?fmt(menor/100):fmt(menor/100)+' a '+fmt(maior/100);
  }catch(e){el.textContent=fmt(0);}
}

  const cliId=document.getElementById('crd_cli')?.value||'';

 try{

  const r=await chamarIABackend('estoque',estoqueFoto);

 }catch(e){console.error(e);if(status)status.textContent='Não foi possível concluir: '+e.message;showToast('Falha na análise da foto','error')}

async function salvarAgenda(id){
  const editando=id!==undefined&&id!==null;
  const anterior=editando?state.agenda.find(a=>sameId(a.id,id)):null;
  if(editando&&!anterior)return showToast('Agendamento não encontrado','error');
  const g=k=>document.getElementById(k)?.value?.trim()||'';
  const clienteId=g('ag_cli'),nomeLivre=g('ag_nome'),data=g('ag_data'),horario=g('ag_horario');
  if(!clienteId&&!nomeLivre)return showToast('Selecione um cliente ou informe o nome','error');
  if(clienteId&&!state.clientes.some(c=>sameId(c.id,clienteId))&&!sameId(anterior?.clienteId,clienteId))return showToast('Cliente não encontrado','error');
  const dia=new Date(data+'T12:00:00Z');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(data)||!Number.isFinite(dia.getTime())||dia.toISOString().slice(0,10)!==data||!/^([01]\d|2[0-3]):[0-5]\d$/.test(horario))return showToast('Informe data e horário válidos','error');
  const ag={...(anterior||{}),id:anterior?anterior.id:uid(),clienteId:sameId(anterior?.clienteId,clienteId)?anterior.clienteId:clienteId,
    nomeLivre,telefone:g('ag_tel'),data,horario,tipoExame:g('ag_tipo')||'Exame de Vista',profissional:g('ag_prof'),obs:g('ag_obs'),status:anterior?.status||'Agendado'};
  if(!await gravarRegistroConferido('agenda',ag,editando?id:undefined))return;
  closeModal();showToast(editando?'Agendamento atualizado!':'Agendamento registrado!','success');
  if(state.pagina==='agenda')renderAgenda();
}
function deletarAgenda(id){
  if(!state.agenda.some(a=>sameId(a.id,id)))return showToast('Agendamento não encontrado','error');
  confirmDialog('Deseja excluir este agendamento?',()=>{
    const agenda=state.agenda.filter(a=>!sameId(a.id,id));
    try{save('agenda',agenda);}catch(e){return showToast('Não foi possível salvar a Agenda no armazenamento local','error');}
    state.agenda=agenda;
    closeModal();showToast('Agendamento excluído.','info');
    if(state.pagina==='agenda')renderAgenda();
  },true);
}
function confirmarAgenda(id){
  const ag=state.agenda.find(a=>sameId(a.id,id));
  if(!ag)return showToast('Agendamento não encontrado','error');
  if(ag.status==='Cancelado')return showToast('Agendamento cancelado não pode ser confirmado','error');
  if(ag.status==='Confirmado')return;
  const agenda=state.agenda.map(a=>sameId(a.id,id)?{...a,status:'Confirmado'}:a);
  try{save('agenda',agenda);}catch(e){return showToast('Não foi possível salvar a Agenda no armazenamento local','error');}
  state.agenda=agenda;
  showToast('Agendamento confirmado!','success');
  if(state.pagina==='agenda')renderAgenda();
}
function cancelarAgenda(id){
  const ag=state.agenda.find(a=>sameId(a.id,id));
  if(!ag)return showToast('Agendamento não encontrado','error');
  if(ag.status==='Cancelado')return;
  confirmDialog('Deseja cancelar este agendamento?',()=>{
    if(!state.agenda.some(a=>sameId(a.id,id)))return showToast('Agendamento não encontrado','error');
    const agenda=state.agenda.map(a=>sameId(a.id,id)?{...a,status:'Cancelado'}:a);
    try{save('agenda',agenda);}catch(e){return showToast('Não foi possível salvar a Agenda no armazenamento local','error');}
    state.agenda=agenda;
    closeModal();showToast('Agendamento cancelado.','info');
    if(state.pagina==='agenda')renderAgenda();

}
function enviarAgendaWA(id,confirmacao=false){
  const ag=state.agenda.find(a=>sameId(a.id,id));
  if(!ag)return showToast('Agendamento não encontrado','error');
  const cli=state.clientes.find(c=>sameId(c.id,ag.clienteId))||{};
  const telefone=ag.telefone||cli.celular||cli.telefone||'';
  if(!String(telefone).replace(/\D/g,''))return showToast('Informe um telefone no agendamento ou no cliente','error');
  const nome=cli.nome||ag.nomeLivre||'Cliente';
  const linhas=['*Ótica Lclass*','Olá, '+nome+'!',
    '📅 '+(ag.tipoExame||'Exame de Vista')+' — '+fmtDate(ag.data)+' às '+ag.horario];
  if(ag.profissional)linhas.push('Profissional: '+ag.profissional);
  linhas.push('Status: '+ag.status);

  modalWhatsApp((confirmacao?'Confirmação de presença — ':'Agendamento — ')+nome,linhas.join('\n'),String(telefone));

function enviarConfirmacaoWA(id){

}

    const progress=el('section',null,panel);progress.id='etapa-andamento';el('h2','4. Salvar e continuar depois',progress);

    button('Exportar decisões e auditoria privadas',progress,async()=>{download('conferencia-privada-'+Date.now()+'.json',await session.exportReview());notify('Conferência exportada; mantenha junto às fontes originais privadas.');});
    const savedReview=files('Conferência arquivada para continuar:',progress);
    button('Validar e abrir conferência arquivada',progress,async()=>{await session.importReview(await read(savedReview));refresh();notify('Conferência aberta somente em memória. Decisões recentes divergentes não são substituídas.');});

    applySection.hidden=modoTablet;

    const base=check('Conferi a base e os registros selecionados, inclusive os clientes vinculados.',applySection);
    button('Preparar e baixar plano privado',applySection,async()=>{lastPlan=await session.buildPlan([...selected],{baseConfirmed:base.checked});download('plano-privado-'+lastPlan.payload.id+'.json',lastPlan);notify('Plano exportado. Resumo: '+JSON.stringify(lastPlan.payload.summary)+'\nPara execução futura: RECUPERAR '+lastPlan.payload.id.slice(0,8));});
    const planFile=files('Plano recém-baixado:',applySection);
    button('Conferir plano salvo',applySection,async()=>{await session.verifyPlan(await read(planFile));notify('Plano conferido. Ainda não houve importação.');});

    button('Verificar resultado com o plano',applySection,async()=>{notify(JSON.stringify(await C.verifyApplied(root.localStorage,await read(planFile),{origin:session.origin,path:session.path}),null,2));});

    failure.hidden=modoTablet;
    el('p','Nunca repita uma importação interrompida. Preserve o estado atual em novo backup, guarde o plano e o backup anterior. A reversão exige correspondência exata e bloqueia alterações posteriores ou concorrentes.',failure);

    return {fechar:()=>{throw new Error('Use o botão de fechamento para preservar as decisões.');}};
  }};
})(globalThis);

(function(root){
 'use strict';
 const KEY='otica_recuperacao_acesso_v1',ITERATIONS=210000;
 const iniciarProtegido=root.OticaRecuperacaoAssistida.iniciar;
 root.OticaRecuperacaoAssistida.iniciar=()=>{throw new Error('Acesso restrito. Entre pela área Administração · Recuperação.');};
 const bytesToHex=b=>Array.from(b,n=>n.toString(16).padStart(2,'0')).join('');
 async function derive(password,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);return bytesToHex(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:ITERATIONS},key,256)));}
 function read(){const raw=localStorage.getItem(KEY);if(raw===null)return null;const record=JSON.parse(raw);if(record.version!==1||record.iterations!==ITERATIONS||!/^[0-9a-f]{32}$/.test(record.salt)||!/^[0-9a-f]{64}$/.test(record.hash))throw new Error('Configuração administrativa inválida. Preserve o armazenamento e solicite suporte.');return record;}
 let dialog=null;
 root.OticaRecuperacaoAdministrativa={abrir(){
  if(root.OticaRecuperacaoModoTablet&&(location.origin!==root.OticaRecuperacaoPolitica.origin||location.pathname!==root.OticaRecuperacaoPolitica.path+'conferencia-tablet.html')){
   const status=document.getElementById('status-acesso-tablet');if(status)status.textContent='Abertura bloqueada: este arquivo precisa ser disponibilizado no mesmo GitHub Pages da Ótica. Um arquivo baixado ou outro domínio não acessa os dados atuais do tablet.';return;
  }
  if(dialog){dialog.showModal();return;}
  dialog=document.createElement('dialog');dialog.style.cssText='max-width:520px;width:calc(100% - 24px);max-height:90vh;overflow:auto;padding:20px;border-radius:14px;font:18px system-ui;box-sizing:border-box';
  const add=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;dialog.append(n);return n;};
  add('h2','Administração · Recuperação');
  add('p','Acesso restrito neste navegador por senha administrativa local. Não é autenticação de servidor. Não há senha padrão nem recuperação automática de senha.');
  const message=add('p',''),label=add('label','Senha administrativa (mínimo 12 caracteres):'),password=document.createElement('input');password.type='password';password.autocomplete='current-password';password.style.cssText='display:block;width:100%;min-height:48px;padding:10px;font:inherit;box-sizing:border-box';label.append(password);
  const confirmationLabel=add('label','Repita a senha para a primeira configuração:'),confirmation=document.createElement('input');confirmation.type='password';confirmation.autocomplete='new-password';confirmation.style.cssText=password.style.cssText;confirmationLabel.append(confirmation);
  const setupLabel=add('label',''),setup=document.createElement('input');setup.type='checkbox';setup.style.cssText='width:26px;height:26px;vertical-align:middle';setupLabel.append(setup,document.createTextNode(' Sou responsável autorizado e confirmo criar o acesso administrativo somente neste navegador.'));
  let configured;try{configured=read();}catch(e){message.textContent=e.message;password.disabled=true;}
  confirmationLabel.hidden=setupLabel.hidden=!!configured;
  if(!configured)message.textContent=message.textContent||'Primeiro acesso: o responsável deve definir e guardar a senha antes de entregar a ferramenta à operadora.';
  const open=add('button',configured?'Entrar na conferência':'Configurar acesso e entrar'),close=add('button','Cancelar');for(const button of [open,close])button.style.cssText='font:inherit;min-height:52px;padding:12px;margin:8px 4px;max-width:100%;white-space:normal';
  open.onclick=async()=>{open.disabled=true;try{
   let credential=read();
   if(!credential){if(!setup.checked||password.value.length<12||password.value!==confirmation.value)throw new Error('Confirme a autorização e repita uma senha com pelo menos 12 caracteres.');const salt=bytesToHex(crypto.getRandomValues(new Uint8Array(16)));credential={version:1,iterations:ITERATIONS,salt,hash:await derive(password.value,salt)};if(read()!==null)throw new Error('O acesso foi configurado em outra aba. Feche e abra novamente.');localStorage.setItem(KEY,JSON.stringify(credential));}
   else if(await derive(password.value,credential.salt)!==credential.hash)throw new Error('Senha incorreta. Nenhum dado foi alterado.');
   password.value=confirmation.value='';dialog.close();dialog.remove();dialog=null;
   const local=location.protocol==='file:'||['localhost','127.0.0.1','[::1]'].includes(location.hostname);
   const policy=local?{...root.OticaRecuperacaoPolitica,origin:location.origin,path:location.pathname}:root.OticaRecuperacaoPolitica;
   iniciarProtegido(policy,{somenteConferencia:local||!!root.OticaRecuperacaoModoTablet,modoTablet:!!root.OticaRecuperacaoModoTablet});
  }catch(e){message.textContent=e.message;}finally{open.disabled=false;}};
  close.onclick=()=>{password.value=confirmation.value='';dialog.close();dialog.remove();dialog=null;};
  dialog.addEventListener('cancel',event=>{event.preventDefault();close.click();});document.body.append(dialog);dialog.showModal();
 }};
