<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060d1a;--surface:#0f172a;--surface2:#080e1a;--border:#1e293b;--border2:#334155;
  --gold:#C9A84C;--gold2:#a07a30;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;
  --green:#10b981;--red:#ef4444;--purple:#818cf8;--yellow:#C9A84C;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
a{color:inherit;text-decoration:none}
input,select,textarea,button{font-family:'DM Sans',sans-serif}
button{cursor:pointer}

/* LAYOUT */
#app{display:flex;min-height:100vh}
#sidebar{width:220px;background:var(--surface2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;transition:width .3s;flex-shrink:0;z-index:200}
#sidebar.collapsed{width:64px}
#main{flex:1;display:flex;flex-direction:column;min-height:100vh;overflow:hidden}
#header{background:var(--surface2);border-bottom:1px solid var(--border);padding:14px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
#content{flex:1;padding:32px;overflow-y:auto;max-height:calc(100vh - 57px)}

/* SIDEBAR */
.logo-area{padding:22px 18px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10}
.logo-icon{background:linear-gradient(135deg,var(--gold),var(--gold2));border-radius:8px;padding:7px 9px;flex-shrink:0;font-size:18px}
.logo-text{font-family:'Playfair Display',serif;font-size:16px;font-weight:800;line-height:1}
.logo-sub{font-size:10px;color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
nav{flex:1;padding:10px 8px}
.nav-btn{width:100%;display:flex;align-items:center;gap:10;padding:10px 12px;border-radius:8px;border:none;background:transparent;color:var(--dim);font-size:13px;font-weight:500;transition:all .2s;margin-bottom:2px;white-space:nowrap;overflow:hidden}
.nav-btn:hover{background:rgba(201,168,76,.08);color:var(--muted)}
.nav-btn.active{background:rgba(201,168,76,.12);color:var(--gold);font-weight:700}
.nav-btn svg{flex-shrink:0}
.nav-dot{margin-left:auto;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.collapse-btn{padding:10px 8px;border-top:1px solid var(--border)}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px}
.card-title{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:16px}

/* STAT CARD */
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.stat-glow{position:absolute;top:0;right:0;width:80px;height:80px;border-radius:0 12px 0 100%}
.stat-label{font-size:11px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-size:28px;font-weight:800;font-family:'Playfair Display',serif;color:var(--text);margin:8px 0 4px}
.stat-sub{font-size:12px;color:var(--muted)}
.stat-icon{border-radius:10px;padding:10px;display:flex}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr{background:var(--surface2);border-bottom:1px solid var(--border)}
th{padding:12px 16px;text-align:left;color:var(--dim);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:nth-child(even){background:var(--surface2)}
tbody tr:hover{background:rgba(201,168,76,.04)}

/* FORM */
.field{margin-bottom:14px}
.field label{display:block;margin-bottom:5px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field label .req{color:var(--gold);margin-left:2px}
.inp{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 12px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--gold)}
.inp::placeholder{color:var(--dim)}
textarea.inp{resize:vertical;min-height:70px}
.err-msg{font-size:11px;color:var(--red);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;border:none;transition:all .2s;letter-spacing:.02em;white-space:nowrap}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#0f172a}
.btn-secondary{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-whatsapp{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:11px}

/* BADGE */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em}
.badge-green{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
.badge-red{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3)}
.badge-yellow{background:rgba(201,168,76,.15);color:#C9A84C;border:1px solid rgba(201,168,76,.3)}
.badge-gray{background:rgba(100,116,139,.15);color:#64748b;border:1px solid rgba(100,116,139,.3)}
.badge-purple{background:rgba(129,140,248,.15);color:#818cf8;border:1px solid rgba(129,140,248,.3)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.6);animation:slideUp .25s}
.modal-sm{max-width:480px}
.modal-md{max-width:600px}
.modal-lg{max-width:860px}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1}
.modal-header h2{font-family:'Playfair Display',serif;font-size:18px;font-weight:800;margin:0}
.modal-body{padding:24px}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--surface);border-radius:10px;padding:13px 20px;font-size:14px;z-index:9999;display:flex;align-items:center;gap:10;box-shadow:0 8px 32px rgba(0,0,0,.4);animation:slideIn .3s;max-width:360px}

/* CHART */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:56px}
.bar-chart .bar{flex:1;border-radius:3px 3px 0 0;transition:height .6s}
.bar-chart .bar-label{font-size:9px;color:var(--dim);text-align:center;margin-top:3px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center}

/* EMPTY STATE */
.empty{padding:48px;text-align:center;color:var(--dim)}
.empty-icon{font-size:40px;margin-bottom:12px;opacity:.4}
.empty p{font-size:14px}

/* SECTION DIVIDER */
.section-div{font-size:11px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);padding-bottom:8px;margin:16px 0 12px}

/* WHATSAPP PREVIEW */
.wa-preview{background:#0d1e13;border:1px solid #1a3a22;border-radius:10px;padding:14px;font-size:13px;color:#d4e8d5;white-space:pre-wrap;line-height:1.6;font-family:monospace;max-height:280px;overflow-y:auto}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* PAGE HEADER */
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.page-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:800;color:var(--text);margin-bottom:3px}
.page-sub{font-size:13px;color:var(--dim)}

/* SEARCH BAR */
.search-bar{position:relative;flex:1}
.search-bar input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 12px 9px 36px;color:var(--text);font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}

/* PROFILE */
.profile-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#0f172a}

/* CREDIÁRIO ACCORDION */
.cred-item{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:10px}
.cred-header{padding:16px 20px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:background .15s}
.cred-header:hover{background:rgba(201,168,76,.04)}
.cred-body{border-top:1px solid var(--border);padding:0}

/* RECEITA CARD */
.receita-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;transition:border-color .2s}
.receita-card.ativa{border-color:rgba(201,168,76,.4)}

/* INFO GRID */
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--dim)}
.info-value{color:var(--text)}

/* RESPONSIVE */
@media(max-width:768px){
  #sidebar{width:64px}
  #sidebar .logo-text,.nav-btn span,.logo-sub,.collapse-btn span{display:none}
  #content{padding:12px}
  .grid2,.grid3,.grid5{grid-template-columns:1fr}
  .page-header{flex-direction:column}
  .modal{max-height:95vh}
  .modal-body{padding:16px}
  table{font-size:12px}
  th,td{padding:8px 10px}
  .stat-value{font-size:22px}
  .btn{padding:8px 14px;font-size:12px}
  .page-title{font-size:22px}
}
@media(max-width:480px){
  #content{padding:8px}
  .grid2{grid-template-columns:1fr}
  .modal-body{padding:12px}
  .btn-sm{padding:6px 10px;font-size:11px}
  #header{padding:10px 16px}
  .stat-value{font-size:20px}
}
/* Touch improvements */
button,a,.nav-btn,.lente-row{-webkit-tap-highlight-color:transparent}
input,select,textarea{font-size:16px!important}
::-webkit-scrollbar{width:3px;height:3px}

/* Bottom navigation */
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent;border:none;color:var(--dim);cursor:pointer;padding:6px 0;font-family:'DM Sans',sans-serif;transition:color .2s;min-height:52px}
.bnav-btn.active{color:var(--gold)}
.bnav-btn:active{opacity:.7}

/* When bottom nav visible, add padding to content */
@media(max-width:600px){
  #bottom-nav{display:block!important}
  #sidebar{display:none!important}
  #main{width:100%}
  #content{padding-bottom:72px}
  #header{padding:10px 16px}
}

/* consultor-premium-v3 */

.stock-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stock-card{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--surface2)}.stock-photo{height:150px;background:#101827;display:flex;align-items:center;justify-content:center;overflow:hidden}.stock-photo img{width:100%;height:100%;object-fit:cover}.stock-body{padding:12px}.capture-box{border:1px dashed var(--gold);border-radius:16px;padding:18px;text-align:center;background:rgba(201,168,76,.05)}.capture-preview{max-height:320px;max-width:100%;border-radius:12px;margin:12px auto}.detect-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin:8px 0}@media(max-width:768px){.stock-grid{grid-template-columns:1fr 1fr}.detect-row{grid-template-columns:1fr 1fr}.detect-row .wide{grid-column:1/-1}}
.consult-hero{background:radial-gradient(circle at 80% 10%,rgba(201,168,76,.18),transparent 34%),linear-gradient(135deg,#0b1425,#060d1a);border:1px solid rgba(201,168,76,.28);border-radius:18px;padding:24px;overflow:hidden}
.consult-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.consult-step{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center;font-size:11px;color:var(--muted)}
.consult-step strong{display:block;color:var(--gold);font-size:16px;margin-bottom:3px}
.lens-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.lens-option{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:16px;cursor:pointer;transition:.2s}
.lens-option:hover,.lens-option.selected{border-color:var(--gold);box-shadow:0 0 0 1px rgba(201,168,76,.2)}
.consult-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.consult-scene{min-height:300px;border-radius:18px;position:relative;overflow:hidden;background:linear-gradient(180deg,#b9d7f2 0%,#dce8d4 48%,#9fb68f 49%,#738568 100%);border:1px solid var(--border)}.consult-scene:before{content:"";position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(255,245,190,.85);top:24px;right:38px;box-shadow:0 0 35px rgba(255,239,150,.55)}.consult-road{position:absolute;left:28%;right:28%;bottom:-20px;height:190px;background:#56606b;clip-path:polygon(38% 0,62% 0,100% 100%,0 100%)}.consult-road:after{content:"";position:absolute;left:49%;top:15px;width:3%;height:150px;background:repeating-linear-gradient(to bottom,#fff 0 18px,transparent 18px 36px)}.consult-lens{position:absolute;width:42%;height:52%;top:23%;border:7px solid #1d2939;border-radius:48%;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.3)}.consult-lens.left{left:7%}.consult-lens.right{right:7%}.consult-lens:after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.05)}.consult-lens.blue:after{background:rgba(77,149,255,.18)}.consult-lens.photo:after{background:rgba(39,46,58,.48)}.consult-lens.clear:after{background:rgba(255,255,255,.02)}.consult-bridge{position:absolute;width:10%;height:7px;background:#1d2939;left:45%;top:48%}.consult-caption{position:absolute;left:14px;bottom:14px;background:rgba(6,13,26,.82);padding:9px 12px;border-radius:10px;font-size:12px}.lens-demo{height:180px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(135deg,#e7eef7,#a9bfd8);border:1px solid var(--border)}
.lens-demo:before{content:"";position:absolute;inset:20px 12%;border-radius:50%;border:5px solid #27364a;background:rgba(255,255,255,.22);box-shadow:inset 0 0 40px rgba(255,255,255,.65)}
.lens-demo.blue:before{background:linear-gradient(135deg,rgba(255,255,255,.42),rgba(74,144,226,.24))}
.lens-demo.photo:before{background:linear-gradient(135deg,rgba(56,65,78,.72),rgba(110,120,135,.5))}
.lens-demo.ar:before{background:rgba(255,255,255,.08);box-shadow:inset 0 0 30px rgba(120,255,220,.14)}
.compare-stage{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare-pane{border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--surface2)}
.compare-pane h4{padding:10px 12px;font-size:12px;color:var(--gold)}
.compare-view{height:220px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,#eef3f8,#aebed0);color:#172033;font-weight:800}
.compare-view.blur{filter:none}
.compare-view.blur:after{content:"Visão sem tratamento";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(220,230,240,.28);backdrop-filter:blur(3px)}

<script>
// ═══════════════════════════════════════════════════════════
// PWA - Service Worker & Install Prompt
// ═══════════════════════════════════════════════════════════
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install button in header
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.style.display = 'none';
  showToast('App instalado com sucesso!', 'success');
});

async function instalarApp() {
  if(!deferredPrompt) {
    showToast('Para instalar: use o menu do navegador → "Adicionar à tela inicial"', 'info');
    return;
  }
  deferredPrompt.prompt();
  const result = await deferredPrompt.userChoice;
  deferredPrompt = null;
}

// Register inline service worker for offline support
if('serviceWorker' in navigator) {
  const swCode = `
    const CACHE = 'otica-lclass-v1';
    self.addEventListener('install', e => {
      self.skipWaiting();
    });
    self.addEventListener('activate', e => {
      e.waitUntil(clients.claim());
    });
    self.addEventListener('fetch', e => {
      // Cache-first for same-origin, network for external
      if(e.request.url.startsWith(self.location.origin)) {
        e.respondWith(
          caches.match(e.request).then(r => r || fetch(e.request))
        );
      }
    });
  `;
  const blob = new Blob([swCode], {type:'application/javascript'});
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(()=>{});
}

// ═══════════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════════
const DB = {
  get(k){try{return JSON.parse(localStorage.getItem('otica_'+k)||'null')}catch{return null}},
  set(k,v){localStorage.setItem('otica_'+k,JSON.stringify(v))},

function gerarMsgVenda(venda){
  const cli=state.clientes.find(c=>c.id===venda.clienteId)||{};
  const icons={'Pix':'💸','Dinheiro':'💵','Cartão':'💳','Crediário':'📋','À Vista c/ Restante':'💵'};
  const icon=icons[venda.forma]||'💳';
  const parcelasInfo=venda.parcelas>1?' em '+venda.parcelas+'x de '+fmt(venda.total/venda.parcelas):'';
  const linhas=[
    '🏪 *Ótica lclass*',
    '══════════════════',
    '🧾 *RECIBO DE VENDA*',
    '══════════════════',
    '',
    '👤 *Cliente:* '+(cli.nome||'—'),
    '📅 *Data:* '+fmtDate(venda.data),
    '',
    '━━━━━━━━━━━━━━━━━━',
    '📦 *Produto/Serviço:*',
    venda.descricao,
    '',
    'Qtd: '+venda.qtd+' × '+fmt(venda.valorUnit),
    '━━━━━━━━━━━━━━━━━━',
    '',
    '💰 *TOTAL: '+fmt(venda.total)+'*',
    '',
    icon+' *Pagamento:* '+venda.forma+parcelasInfo,
  ];
  if(venda.entradaValor>0){
    linhas.push('✅ *Entrada paga:* '+fmt(venda.entradaValor));
    linhas.push('⏳ *Restante na entrega:* '+fmt(venda.total-venda.entradaValor));
    if(venda.dataEntrega) linhas.push('📦 *Entrega prevista:* '+fmtDate(venda.dataEntrega));
  }
  if(venda.obs)linhas.push('','📝 *Obs:* '+venda.obs);
  linhas.push('','══════════════════','✅ Obrigado pela preferência! 🙏','📍 *Ótica lclass*');
  return linhas.join('\n');
}

function abrirWhatsApp(){
  const input = document.getElementById(_waTelId);
  const tel = input ? input.value.trim() : '';
  if(!tel){showToast('Informe o número do WhatsApp','error');return;}
  const num = tel.replace(/\D/g,'');
  const url = 'https://wa.me/55'+num+'?text='+encodeURIComponent(_waMsgAtual);
  // Tenta abrir de várias formas para garantir compatibilidade
  try {
    const a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  } catch(e) {
    window.location.href = url;
  }
  closeModal();
}

  box.appendChild(header); box.appendChild(body);
  overlay.appendChild(box); root.appendChild(overlay);

function showModal(html, cls='modal-md'){
  const root = document.getElementById('modal-root');
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  const box = document.createElement('div');
  box.className = 'modal '+cls;
  box.innerHTML = html;
  overlay.appendChild(box);
  overlay.addEventListener('click', function(e){ if(e.target===this) closeModal(); });
  root.innerHTML = '';
  root.appendChild(overlay);
}
function closeModal(){
  try{ fecharCamera(); }catch(e){}
  document.getElementById('modal-root').innerHTML='';
}
let toastTimer;
function showToast(msg,type='success'){
  const colors={success:'#10b981',error:'#ef4444',info:'#C9A84C'};
  const icon={success:'✓',error:'✕',info:'ℹ'};
  document.getElementById('toast-root').innerHTML=`<div class="toast" style="border:1px solid ${colors[type]};border-left:4px solid ${colors[type]}"><span style="color:${colors[type]};font-weight:700">${icon[type]}</span><span>${esc(msg)}</span></div>`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{document.getElementById('toast-root').innerHTML=''},3500);
}

    body.appendChild(label);
    const inp = document.createElement('input');
    inp.className = 'inp';
    inp.placeholder = 'EXCLUIR';
    inp.style.cssText = 'border:1px solid #ef4444;margin-bottom:4px';
    body.appendChild(inp);

    const footer = document.createElement('div');
    footer.className = 'modal-footer';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-ghost';
    cancelBtn.textContent = 'Cancelar';
    cancelBtn.addEventListener('click', closeModal);
    const yesBtn = document.createElement('button');
    yesBtn.className = 'btn btn-danger';
    yesBtn.textContent = '🗑️ Excluir';
    yesBtn.disabled = true;
    yesBtn.style.opacity = '0.4';
    inp.addEventListener('input', ()=>{
      const ok = inp.value.trim().toUpperCase() === 'EXCLUIR';
      yesBtn.disabled = !ok;
      yesBtn.style.opacity = ok ? '1' : '0.4';
    });
    yesBtn.addEventListener('click', ()=>{ closeModal(); onYes(); });
    footer.appendChild(cancelBtn);
    footer.appendChild(yesBtn);
    box.appendChild(header);
    box.appendChild(body);
    box.appendChild(footer);
  } else {
    body.appendChild(p);
    const footer = document.createElement('div');
    footer.className = 'modal-footer';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-ghost';
    cancelBtn.textContent = 'Cancelar';
    cancelBtn.addEventListener('click', closeModal);
    const yesBtn = document.createElement('button');
    yesBtn.className = 'btn btn-primary';
    yesBtn.textContent = 'Confirmar';
    yesBtn.addEventListener('click', ()=>{ closeModal(); onYes(); });
    footer.appendChild(cancelBtn);
    footer.appendChild(yesBtn);
    box.appendChild(header);
    box.appendChild(body);
    box.appendChild(footer);
  }

  overlay.appendChild(box);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  root.appendChild(overlay);
}

// MINI CHARTS
// ═══════════════════════════════════════════════════════════
function barChart(data,color='#C9A84C'){
  const max=Math.max(...data.map(d=>d.v),1);
  return `<div style="display:flex;align-items:flex-end;gap:4px;height:60px">
    ${data.map(d=>`<div class="bar-col">
      <div class="bar" style="width:100%;background:${color};height:${Math.max(4,(d.v/max)*52)}px;opacity:${d===data[data.length-1]?1:0.5};border-radius:3px 3px 0 0"></div>
      <div style="font-size:9px;color:var(--dim);margin-top:3px">${d.l}</div>
    </div>`).join('')}
  </div>`;
}
function pieChart(data){
  const total=data.reduce((s,d)=>s+d.v,0)||1;
  let cum=-90;
  const slices=data.map(d=>{
    const a=(d.v/total)*360;const s=cum;cum+=a;return{...d,s,a};
  });
  function arc(s,a){
    const r=32,cx=40,cy=40;
    const p2c=(ang)=>({x:cx+r*Math.cos(ang*Math.PI/180),y:cy+r*Math.sin(ang*Math.PI/180)});
    const start=p2c(s+a),end=p2c(s);
    const large=a>180?1:0;
    return `M${cx},${cy} L${start.x},${start.y} A${r},${r},0,${large},0,${end.x},${end.y}Z`;
  }
  return `<div style="display:flex;align-items:center;gap:16px">
    <svg width="80" height="80" viewBox="0 0 80 80">
      ${slices.map(s=>`<path d="${arc(s.s,s.a)}" fill="${s.color}" opacity="0.9"/>`).join('')}
      <circle cx="40" cy="40" r="20" fill="var(--surface)"/>
    </svg>
    <div style="display:flex;flex-direction:column;gap:4px">
      ${data.map(d=>`<div style="display:flex;align-items:center;gap:6px;font-size:12px">
        <div style="width:10px;height:10px;border-radius:2px;background:${d.color};flex-shrink:0"></div>
        <span style="color:var(--muted)">${d.l}</span>
        <span style="color:var(--text);font-weight:700;margin-left:auto">${Math.round((d.v/total)*100)}%</span>
      </div>`).join('')}
    </div>
  </div>`;
}

let consultVirtualStream=null,consultVirtualFacing='environment';
async function consultOpenCamera(facing=consultVirtualFacing){
  const panel=document.getElementById('virtual-camera-panel'),video=document.getElementById('virtual-camera-video');
  if(!navigator.mediaDevices?.getUserMedia){showToast('Este navegador não oferece câmera integrada','error');return}
  consultVirtualFacing=facing;
  if(consultVirtualStream){consultVirtualStream.getTracks().forEach(t=>t.stop());consultVirtualStream=null}
  try{
    consultVirtualStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:consultVirtualFacing},width:{ideal:1920},height:{ideal:1080}},audio:false});
    if(panel)panel.style.display='block';
    if(video){video.srcObject=consultVirtualStream;video.classList.toggle('front-camera',consultVirtualFacing==='user');await video.play().catch(()=>{});}
    panel?.scrollIntoView({behavior:'smooth',block:'center'});
  }catch(e){
    if(consultVirtualFacing==='environment'){
      try{
        consultVirtualFacing='user';
        consultVirtualStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'}},audio:false});
        if(panel)panel.style.display='block';
        if(video){video.srcObject=consultVirtualStream;video.classList.add('front-camera');await video.play().catch(()=>{});}
        showToast('Câmera traseira indisponível; usando frontal','warning');
        return;
      }catch(_){}
    }
    showToast('Não foi possível abrir a câmera. Verifique a permissão do navegador.','error')
  }
}
async function consultSwitchCamera(){
  const next=consultVirtualFacing==='environment'?'user':'environment';
  await consultOpenCamera(next);
}

  if(consultVirtualStream){consultVirtualStream.getTracks().forEach(t=>t.stop());consultVirtualStream=null}

function consultCaptureCamera(){
  const video=document.getElementById('virtual-camera-video'),canvas=document.getElementById('virtual-camera-canvas');
  if(!video||!canvas||!video.videoWidth){showToast('A câmera ainda não está pronta','error');return}
  canvas.width=video.videoWidth;canvas.height=video.videoHeight;
  const ctx=canvas.getContext('2d');
  if(consultVirtualFacing==='user'){ctx.save();ctx.translate(canvas.width,0);ctx.scale(-1,1);ctx.drawImage(video,0,0,canvas.width,canvas.height);ctx.restore()}
  else ctx.drawImage(video,0,0,canvas.width,canvas.height);
  canvas.toBlob(blob=>{
    if(!blob)return showToast('Não foi possível capturar a foto','error');
    if(consultVirtualPhotoUrl)URL.revokeObjectURL(consultVirtualPhotoUrl);
    consultVirtualPhotoUrl=URL.createObjectURL(blob);
    const img=document.getElementById('virtual-photo'),ph=document.getElementById('virtual-placeholder'),g=document.getElementById('virtual-glasses'),guide=document.getElementById('virtual-face-guide');
    if(img){img.src=consultVirtualPhotoUrl;img.style.display='block'}if(ph)ph.style.display='none';if(g)g.style.display='block';if(guide)guide.classList.add('captured');
    consultCloseCamera();consultVirtualUpdate();showToast('Foto capturada','success');
  },'image/jpeg',.92);
}

function capturarFotoDoc(inputId, previewId, usarCamera){
  const input = document.getElementById(inputId);
  if(!input) return;
  if(usarCamera){
    input.setAttribute('capture','environment');
  } else {
    input.removeAttribute('capture');
  }
  input.click();
}

function previewFotoDoc(inputId, previewId){
  const file=document.getElementById(inputId)?.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const div=document.getElementById(previewId);
    if(div)div.innerHTML='<img src="'+e.target.result+'" style="width:100%;border-radius:8px;max-height:120px;object-fit:cover;margin-top:4px"/>';
  };
  reader.readAsDataURL(file);
}
function lerFoto(inputId){
  return new Promise(resolve=>{
    const file=document.getElementById(inputId)?.files?.[0];
    if(!file)return resolve(null);
    const r=new FileReader();
    r.onload=e=>resolve(e.target.result);
    r.readAsDataURL(file);
  });
}
async function salvarCliente(id){
  const g=x=>document.getElementById(x)?.value?.trim()||'';
  const nome=g('cf_nome'),rua=g('cf_rua'),num=g('cf_num'),bairro=g('cf_bairro'),cidade=g('cf_cidade'),cep=g('cf_cep'),ref=g('cf_ref'),mae=g('cf_mae');
  const tel=g('cf_tel'),cel=g('cf_cel');
  if(!nome)return showToast('Nome é obrigatório','error');
  if(!tel&&!cel)return showToast('Informe pelo menos um contato','error');
  if(!rua||!num||!bairro||!cidade||!cep||!ref||!mae)return showToast('Preencha todos os campos obrigatórios','error');
  const fotoDoc1=await lerFoto('cf_foto_doc');
  const fotoDoc2=await lerFoto('cf_foto_doc2');
  const cliAnterior=id?state.clientes.find(c=>c.id===id):{};
  const data={
    nome,cpf:g('cf_cpf'),rg:g('cf_rg'),dataNascimento:g('cf_nascimento'),
    telefone:tel,celular:cel,rua,numero:num,complemento:g('cf_comp'),
    bairro,cidade,estado:g('cf_estado'),cep,referencia:ref,mae,pai:g('cf_pai'),status:g('cf_status'),
    fotoDoc:fotoDoc1||cliAnterior.fotoDoc||'',
    fotoDoc2:fotoDoc2||cliAnterior.fotoDoc2||''
  };
  if(id){
    confirmDialog('Deseja salvar as alterações neste cliente?', ()=>{
      state.clientes=state.clientes.map(c=>c.id===id?{...c,...data}:c);
      saveAll();closeModal();renderClientes();
      showToast('Cliente atualizado!','success');
    });
    return;
  } else {
    state.clientes.push({...data,id:uid(),cadastro:today()});
    showToast('Cliente cadastrado!','success');
  }
  saveAll();closeModal();renderClientes();
}

          </div>
          ${r.obs?`<p style="font-size:12px;color:var(--dim);font-style:italic;margin:0 0 8px">${esc(r.obs)}</p>`:''}
          ${(r.coDir||r.dpDir||r.altDir||r.coEsq||r.dpEsq||r.altEsq)?`
          <div style="background:var(--surface2);border-radius:8px;padding:8px;margin-bottom:10px;font-size:11px">

                <div style="display:flex;gap:6px;flex-wrap:wrap">
                  ${r.coDir?'<span style="color:#10b981">CO:'+r.coDir+'</span>':''}
                  ${r.dpDir?'<span style="color:#818cf8">DP:'+r.dpDir+'</span>':''}
                  ${r.altDir?'<span style="color:#f472b6">Alt:'+r.altDir+'</span>':''}
                </div>
              </div>
              <div style="background:rgba(129,140,248,0.08);border-radius:6px;padding:6px;border-left:2px solid #818cf8">
                <div style="font-size:9px;color:#818cf8;font-weight:700;margin-bottom:3px">OE</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap">
                  ${r.coEsq?'<span style="color:#10b981">CO:'+r.coEsq+'</span>':''}
                  ${r.dpEsq?'<span style="color:#818cf8">DP:'+r.dpEsq+'</span>':''}
                  ${r.altEsq?'<span style="color:#f472b6">Alt:'+r.altEsq+'</span>':''}
                </div>
              </div>
            </div>
            ${r.dpLonge?'<div style="text-align:center;margin-top:5px;font-size:10px;color:var(--dim)">DP Total Longe: <strong style="color:#C9A84C">'+r.dpLonge+'mm</strong></div>':''}
          </div>`:''}
          ${r.foto?`<img src="${r.foto}" style="width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-bottom:10px;border:1px solid var(--border)"/>`:''}
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" onclick="verReceita(${r.id})">👁 Ver</button>
            <button class="btn btn-ghost btn-sm" onclick="abrirFormReceita(${r.id})">✏️ Editar</button>
            <button class="btn btn-danger btn-sm" onclick="deletarReceita(${r.id})">🗑</button>
          </div>
        </div>`;
      }).join('')}
    </div>
  `;
}

let _cameraStream = null;

function toggleGrade(){
  const checked = document.getElementById('rf_usar_grade')?.checked;
  const overlay = document.getElementById('rf_grade_overlay');
  if(!overlay) return;
  if(checked){
    overlay.style.display = 'block';
    iniciarCamera();
  } else {
    overlay.style.display = 'none';
    fecharCamera();
  }
}

async function iniciarCamera(){
  const video = document.getElementById('rf_camera_live');
  const canvas = document.getElementById('rf_grade_canvas');
  if(!video || !canvas) return;
  try {
    _cameraStream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{exact:'environment'}, width:{ideal:1280}, height:{ideal:720} }
    });
    video.srcObject = _cameraStream;
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      desenharGradeCanvas(canvas);
    };
  } catch(err){
    // Camera denied - show fullscreen guide overlay instead
    mostrarGradeGuia();
  }
}

            video.style.transform = isFront ? '' : 'scaleX(-1)';

          })

  const captureBtn = document.createElement('button');

        rm.addEventListener('click',()=>{document.getElementById('rf_foto_hidden').value='';prev.innerHTML='';const b=document.getElementById('btn_analisar_ia');if(b)b.style.display='none';});

function fecharGradeGuia(){
  const overlay = document.getElementById('grade_guia_fullscreen');
  if(overlay){
    if(overlay._stream) overlay._stream.getTracks().forEach(t=>t.stop());
    overlay.remove();
  }
  const gr=document.getElementById('rf_usar_grade'); if(gr) gr.checked=false;
  const go=document.getElementById('rf_grade_overlay'); if(go) go.style.display='none';
}

function desenharGradeCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  const eyeY = h * 0.40;
  const eyeR = Math.min(w,h) * 0.07; // Círculos menores
  const eyeL = w * 0.38;  // OE mais próximo do centro
  const eyeR2 = w * 0.62; // OD mais próximo do centro

  // Grade central suave
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,eyeY); ctx.lineTo(w,eyeY); ctx.stroke();

  function circulo(x, y, r, label){
    // Círculo pulsante visual
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = Math.max(2, w*0.004);
    ctx.setLineDash([Math.max(6,w*0.015), Math.max(4,w*0.01)]);
    ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.stroke();
    ctx.setLineDash([]);
    // Ponto central
    ctx.fillStyle = '#10b981';
    ctx.beginPath(); ctx.arc(x,y,Math.max(5,w*0.008),0,Math.PI*2); ctx.fill();
    // Mira
    ctx.strokeStyle = 'rgba(16,185,129,0.55)';
    ctx.lineWidth = Math.max(1.5,w*0.003);
    ctx.beginPath(); ctx.moveTo(x-r*1.4,y); ctx.lineTo(x+r*1.4,y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x,y-r*1.4); ctx.lineTo(x,y+r*1.4); ctx.stroke();
    // Label
    ctx.fillStyle = '#10b981';
    ctx.font = 'bold '+Math.round(Math.max(14,w*0.032))+'px sans-serif';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.fillText(label, x, y+r+Math.max(18,w*0.04));
    ctx.shadowBlur = 0;
  }

  circulo(eyeL, eyeY, eyeR, 'OE');
  circulo(eyeR2, eyeY, eyeR, 'OD');

  // Linha DP
  ctx.strokeStyle = '#818cf8';
  ctx.lineWidth = Math.max(2,w*0.003);
  ctx.setLineDash([Math.max(8,w*0.018),Math.max(5,w*0.01)]);
  ctx.beginPath(); ctx.moveTo(eyeL,eyeY); ctx.lineTo(eyeR2,eyeY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#818cf8';
  ctx.font = 'bold '+Math.round(Math.max(13,w*0.028))+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor='#000'; ctx.shadowBlur=4;
  ctx.fillText('← DP →', w/2, eyeY - eyeR*0.5);
  ctx.shadowBlur=0;

  // Linha CO
  const coX = eyeL - eyeR*1.8;
  ctx.strokeStyle = '#C9A84C';
  ctx.lineWidth = Math.max(2,w*0.003);
  ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(coX,eyeY); ctx.lineTo(coX,h*0.80); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#C9A84C';
  const asz = Math.max(6,w*0.01);
  ctx.beginPath(); ctx.moveTo(coX-asz,h*0.78); ctx.lineTo(coX,h*0.83); ctx.lineTo(coX+asz,h*0.78); ctx.fill();
  ctx.font = 'bold '+Math.round(Math.max(12,w*0.026))+'px sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor='#000'; ctx.shadowBlur=4;
  ctx.fillText('CO', coX, eyeY+(h*0.80-eyeY)/2+5);
  ctx.shadowBlur=0;
}

function fecharCamera(){
  if(_cameraStream){
    _cameraStream.getTracks().forEach(t => t.stop());
    _cameraStream = null;
  }
  const video = document.getElementById('rf_camera_live');
  if(video) video.srcObject = null;
  fecharGradeGuia();
}

function desenharGradeCanvas(canvas){
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0,0,w,h);

  // Posições dos olhos (proporção do rosto típico)
  const eyeY = h * 0.42;
  const eyeR = w * 0.09;
  const eyeOE = w * 0.35; // olho esquerdo (direita da tela = OE do cliente)
  const eyeOD = w * 0.65; // olho direito (esquerda da tela = OD do cliente)
  const dash = [8, 5];

  // Grade de fundo
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,eyeY); ctx.lineTo(w,eyeY); ctx.stroke();

  // Círculo OE
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3;
  ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(eyeOE, eyeY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#10b981';
  ctx.beginPath(); ctx.arc(eyeOE, eyeY, 6, 0, Math.PI*2); ctx.fill();
  // Mira OE
  ctx.strokeStyle = 'rgba(16,185,129,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(eyeOE-eyeR*1.3,eyeY); ctx.lineTo(eyeOE+eyeR*1.3,eyeY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(eyeOE,eyeY-eyeR*1.3); ctx.lineTo(eyeOE,eyeY+eyeR*1.3); ctx.stroke();
  // Label OE
  ctx.fillStyle = '#10b981';
  ctx.font = 'bold '+Math.round(w*0.035)+'px DM Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('OE', eyeOE, eyeY + eyeR + w*0.045);

  // Círculo OD
  ctx.strokeStyle = '#10b981';
  ctx.lineWidth = 3;
  ctx.setLineDash(dash);
  ctx.beginPath(); ctx.arc(eyeOD, eyeY, eyeR, 0, Math.PI*2); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#10b981';
  ctx.beginPath(); ctx.arc(eyeOD, eyeY, 6, 0, Math.PI*2); ctx.fill();
  // Mira OD
  ctx.strokeStyle = 'rgba(16,185,129,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(eyeOD-eyeR*1.3,eyeY); ctx.lineTo(eyeOD+eyeR*1.3,eyeY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(eyeOD,eyeY-eyeR*1.3); ctx.lineTo(eyeOD,eyeY+eyeR*1.3); ctx.stroke();
  // Label OD
  ctx.fillStyle = '#10b981';
  ctx.font = 'bold '+Math.round(w*0.035)+'px DM Sans, sans-serif';
  ctx.fillText('OD', eyeOD, eyeY + eyeR + w*0.045);

  // Linha DP entre pupilas
  ctx.strokeStyle = '#818cf8';
  ctx.lineWidth = 2;
  ctx.setLineDash([8,5]);
  ctx.beginPath(); ctx.moveTo(eyeOE,eyeY); ctx.lineTo(eyeOD,eyeY); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#818cf8';
  ctx.font = 'bold '+Math.round(w*0.03)+'px DM Sans, sans-serif';
  ctx.fillText('← DP →', w/2, eyeY - eyeR*0.4);

  // Linha CO/Altura (vertical da pupila até base)
  const coX = eyeOE - eyeR*1.8;
  ctx.strokeStyle = '#C9A84C';
  ctx.lineWidth = 2;
  ctx.setLineDash([6,4]);
  ctx.beginPath(); ctx.moveTo(coX, eyeY); ctx.lineTo(coX, h*0.82); ctx.stroke();
  ctx.setLineDash([]);
  // Seta
  ctx.fillStyle = '#C9A84C';
  ctx.beginPath(); ctx.moveTo(coX-6, h*0.80); ctx.lineTo(coX, h*0.85); ctx.lineTo(coX+6, h*0.80); ctx.fill();
  ctx.font = 'bold '+Math.round(w*0.028)+'px DM Sans, sans-serif';
  ctx.fillText('CO/Alt', coX, eyeY + (h*0.82-eyeY)/2 + 5);

  // Instrução no topo
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, w, h*0.12);
  ctx.fillStyle = '#10b981';
  ctx.font = 'bold '+Math.round(w*0.032)+'px DM Sans, sans-serif';
  ctx.fillText('Alinhe os olhos nos círculos verdes', w/2, h*0.08);
}

function capturarFotoComGrade(){

  // Capture video frame WITHOUT the overlay grid
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = video.videoWidth || 1280;
  tempCanvas.height = video.videoHeight || 720;

function sugerirLentes(){
  const g = x => parseFloat(document.getElementById(x)?.value || '0') || 0;
  const odEsf = g('rf_odEsfera'), odCil = g('rf_odCilindro'), odAdd = g('rf_odAdicao');
  const oeEsf = g('rf_oeEsfera'), oeCil = g('rf_oeCilindro'), oeAdd = g('rf_oeAdicao');
  const div = document.getElementById('rf_sugestoes');
  if(!div) return;

  // Use the higher absolute value between eyes
  const maxEsf = Math.max(Math.abs(odEsf), Math.abs(oeEsf));
  const maxCil = Math.max(Math.abs(odCil), Math.abs(oeCil));
  const maxAdd = Math.max(Math.abs(odAdd), Math.abs(oeAdd));
  const temAdd = maxAdd > 0;
  const temCil = maxCil > 0;

  if(maxEsf === 0 && maxCil === 0) {
    div.innerHTML = '<div style="padding:10px;text-align:center;color:var(--dim);font-size:12px;background:var(--surface2);border-radius:8px">Preencha os graus acima para ver sugestões</div>';
    return;
  }

  // Tipo selecionado pelo atendente tem prioridade
  const tipoSelecionado = document.getElementById('rf_tipo_lente')?.value || '';

  // Auto-detect se não selecionado
  let tipoAuto = 'Visão Simples';
  if(temAdd) tipoAuto = 'Progressiva';
  const tipo = tipoSelecionado || tipoAuto;

  // Filter compatible lenses using selected tipo
  const sugestoes = TABELA_LAB.filter(item => {
    if(item.tipo === 'Servico' || item.tipo === 'Tratamento AR') return false;
    if(tipoSelecionado) {
      // Filtro exato pelo tipo selecionado
      return item.tipo === tipoSelecionado;
    } else {
      // Auto-detect: inclui tipos relacionados
      if(temAdd) return item.tipo === 'Progressiva' || item.tipo === 'Multifocal' || item.tipo === 'Bifocal';
      return item.tipo === 'Visão Simples';
    }
  });

  if(sugestoes.length === 0) {
    div.innerHTML = '<div style="padding:10px;text-align:center;color:var(--dim);font-size:12px">Nenhuma sugestão disponível para esses graus</div>';

  // Build result info header
  const esf_str = maxEsf.toFixed(2);

  let html = '<div style="margin-bottom:8px;padding:10px 12px;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);border-radius:8px;font-size:12px;color:var(--muted)">';

  html += ' &nbsp;|&nbsp; Cil max: <strong>'+cil_str+'</strong>';
  if(add_str) html += ' &nbsp;|&nbsp; Add: <strong>'+maxAdd.toFixed(2)+'</strong>';
  html += '</div>';

  html += '<div style="max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:8px">';
  html += '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  html += '<thead><tr style="background:var(--surface);position:sticky;top:0;z-index:1">';
  html += '<th style="padding:7px 10px;text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase">COD</th>';
  html += '<th style="padding:7px 10px;text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase">Lente</th>';
  html += '<th style="padding:7px 10px;text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase">Material</th>';
  html += '<th style="padding:7px 10px;text-align:right;color:#C9A84C;font-size:10px;text-transform:uppercase">Ante Risco</th>';
  html += '<th style="padding:7px 10px;text-align:right;color:#818cf8;font-size:10px;text-transform:uppercase">AR Blue</th>';
  html += '</tr></thead><tbody>';

    sugestoes.forEach((item, i) => {
    const bg = i % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.02)';
    const precoFmt = 'R$ ' + item.ar_risco.toFixed(2).replace('.',',');

    html += '<tr class="lente-row" data-cod="' + item.cod + '" data-preco="' + item.ar_risco + '" style="border-bottom:1px solid var(--border);background:' + bg + ';cursor:pointer">';

function filtrarTabela(){
  const tipo = document.getElementById('rf_filtro_tipo')?.value || '';
  const busca = (document.getElementById('rf_busca_lente')?.value || '').toLowerCase().trim();
  const div = document.getElementById('rf_tabela_resultado');
  if(!div) return;

  if(!tipo && !busca) {
    div.innerHTML = '<div style="padding:12px;text-align:center;color:var(--dim);font-size:13px">Digite para buscar ou selecione um tipo</div>';
    return;
  }

  const filtered = TABELA_LAB.filter(item => {
    const matchTipo = !tipo || item.tipo === tipo;
    const matchBusca = !busca || 
      item.lente.toLowerCase().includes(busca) ||
      item.cod.toLowerCase().includes(busca) ||
      item.material.toLowerCase().includes(busca) ||
      item.grade.toLowerCase().includes(busca);
    return matchTipo && matchBusca;
  });

  if(filtered.length === 0) {
    div.innerHTML = '<div style="padding:12px;text-align:center;color:var(--dim);font-size:13px">Nenhuma lente encontrada</div>';
    return;
  }

  const hasMultiTrat = filtered.some(i => i.ar_clean !== null);

  let html = '<table style="width:100%;border-collapse:collapse;font-size:12px">';
  html += '<thead><tr style="background:var(--surface);position:sticky;top:0">';
  html += '<th style="padding:7px 10px;text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase">COD</th>';
  html += '<th style="padding:7px 10px;text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase">Lente</th>';
  html += '<th style="padding:7px 10px;text-align:left;color:var(--dim);font-size:10px;text-transform:uppercase">Grade</th>';
  html += '<th style="padding:7px 10px;text-align:right;color:#C9A84C;font-size:10px;text-transform:uppercase">Ante Risco</th>';
  if(hasMultiTrat) {
    html += '<th style="padding:7px 10px;text-align:right;color:#10b981;font-size:10px;text-transform:uppercase">AR Clean</th>';
    html += '<th style="padding:7px 10px;text-align:right;color:#818cf8;font-size:10px;text-transform:uppercase">AR Blue</th>';
    html += '<th style="padding:7px 10px;text-align:right;color:#f472b6;font-size:10px;text-transform:uppercase">AR Bella/Dourado</th>';
  }
  html += '</tr></thead><tbody>';

  filtered.forEach((item, i) => {
    const bg = i % 2 === 0 ? 'transparent' : 'rgba(255,255,255,0.02)';
    html += '<tr style="border-bottom:1px solid var(--border);background:'+bg+'">';
    html += '<td style="padding:7px 10px;color:#64748b;font-weight:700">'+item.cod+'</td>';
    html += '<td style="padding:7px 10px;color:var(--text);font-weight:500">'+item.lente+'</td>';
    html += '<td style="padding:7px 10px;color:#94a3b8;font-size:11px">'+item.grade+'</td>';
    html += '<td style="padding:7px 10px;text-align:right;color:#C9A84C;font-weight:700">R$ '+item.ar_risco.toFixed(2).replace('.',',')+'</td>';
    if(hasMultiTrat) {
      html += '<td style="padding:7px 10px;text-align:right;color:#10b981">'+(item.ar_clean ? 'R$ '+item.ar_clean.toFixed(2).replace('.',',') : '—')+'</td>';
      html += '<td style="padding:7px 10px;text-align:right;color:#818cf8">'+(item.ar_blue ? 'R$ '+item.ar_blue.toFixed(2).replace('.',',') : '—')+'</td>';
      html += '<td style="padding:7px 10px;text-align:right;color:#f472b6">'+(item.ar_bella ? 'R$ '+item.ar_bella.toFixed(2).replace('.',',') : '—')+'</td>';
    }
    html += '</tr>';
  });
  html += '</tbody></table>';
  div.innerHTML = html;
}

function abrirCameraGuia(){
  var old=document.getElementById('cam-guia-overlay');
  if(old) old.remove();

  var ov=document.createElement('div');
  ov.id='cam-guia-overlay';
  ov.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:flex;flex-direction:column;';
  document.body.appendChild(ov);

  // Video
  var vid=document.createElement('video');
  vid.autoplay=true; vid.playsInline=true; vid.muted=true;
  vid.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1;';
  ov.appendChild(vid);

  // Canvas guia (por cima do vídeo, sem capturar eventos)
  var gc=document.createElement('canvas');
  gc.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;z-index:2;pointer-events:none;';
  ov.appendChild(gc);

  // Instrução
  var inf=document.createElement('div');
  inf.style.cssText='position:absolute;bottom:110px;left:0;right:0;z-index:3;text-align:center;color:#fff;font-size:13px;font-weight:700;text-shadow:0 2px 8px #000;pointer-events:none;padding:0 16px;';
  inf.textContent='Encaixe o rosto no oval • Olhos nos círculos azuis • ~40cm';
  ov.appendChild(inf);

  // Barra botões — z-index alto, bem acima do canvas
  var bar=document.createElement('div');
  bar.style.cssText='position:absolute;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 20px 24px;background:rgba(0,0,0,0.85);gap:12px;';
  ov.appendChild(bar);

  function fecharCam(){
    if(vid.srcObject) vid.srcObject.getTracks().forEach(function(t){t.stop();});
    var o=document.getElementById('cam-guia-overlay');
    if(o) o.remove();
  }

  var btnSair=document.createElement('button');
  btnSair.style.cssText='font-size:15px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);cursor:pointer;min-width:70px;';
  btnSair.textContent='✕ Sair';
  btnSair.addEventListener('touchend',function(e){e.preventDefault();fecharCam();});
  btnSair.addEventListener('click',fecharCam);
  bar.appendChild(btnSair);

  var btnFoto=document.createElement('button');
  btnFoto.style.cssText='font-size:18px;padding:18px 0;border-radius:50px;background:#C9A84C;color:#000;border:none;cursor:pointer;font-weight:900;flex:1;max-width:200px;';
  btnFoto.textContent='📸 Capturar';
  btnFoto.addEventListener('touchend',function(e){
    e.preventDefault();
    e.stopPropagation();
    tirarFotoGuia(vid);
    fecharCam();
  });
  btnFoto.addEventListener('click',function(e){
    e.stopPropagation();
    tirarFotoGuia(vid);
    fecharCam();
  });
  bar.appendChild(btnFoto);

  var btnGal=document.createElement('button');
  btnGal.style.cssText='font-size:15px;padding:14px 18px;border-radius:12px;background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);cursor:pointer;min-width:70px;';
  btnGal.textContent='🖼️ Galeria';
  btnGal.addEventListener('touchend',function(e){e.preventDefault();fecharCam();document.getElementById('rf_foto_gallery').click();});
  btnGal.addEventListener('click',function(){fecharCam();document.getElementById('rf_foto_gallery').click();});
  bar.appendChild(btnGal);

  // Iniciar câmera
  navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'},width:{ideal:1280},height:{ideal:960}}})
  .catch(function(){return navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});})
  .then(function(stream){
    vid.srcObject=stream;
    vid.play();
    // Desenhar guia em loop
    function drawGuide(){
      if(!document.getElementById('cam-guia-overlay')) return;
      var vw=ov.offsetWidth||window.innerWidth;
      var vh=ov.offsetHeight||window.innerHeight;
      gc.width=vw; gc.height=vh;
      var ctx=gc.getContext('2d');
      ctx.clearRect(0,0,vw,vh);
      var cx=vw/2, cy=vh*0.40;
      var ow=vw*0.78, oh=(vh-120)*0.78;
      // Escurecer fora do oval
      ctx.save();
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(0,0,vw,vh);
      ctx.globalCompositeOperation='destination-out';
      ctx.beginPath(); ctx.ellipse(cx,cy,ow/2,oh/2,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
      // Borda oval
      ctx.strokeStyle='#C9A84C'; ctx.lineWidth=3; ctx.setLineDash([12,5]);
      ctx.beginPath(); ctx.ellipse(cx,cy,ow/2,oh/2,0,0,Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
      // Linha olhos
      var ey=cy-oh*0.08;
      ctx.strokeStyle='rgba(100,180,255,0.85)'; ctx.lineWidth=1.5; ctx.setLineDash([6,4]);
      ctx.beginPath(); ctx.moveTo(cx-ow*0.46,ey); ctx.lineTo(cx+ow*0.46,ey); ctx.stroke();
      ctx.setLineDash([]);
      // Círculos pupilas
      var eOD=cx-ow*0.22, eOE=cx+ow*0.22, er=ow*0.065;
      [eOD,eOE].forEach(function(ex){
        ctx.strokeStyle='rgba(100,180,255,0.9)'; ctx.lineWidth=2;
        ctx.beginPath(); ctx.arc(ex,ey,er,0,Math.PI*2); ctx.stroke();
        ctx.strokeStyle='rgba(100,180,255,0.7)'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(ex-er*0.6,ey); ctx.lineTo(ex+er*0.6,ey);
        ctx.moveTo(ex,ey-er*0.6); ctx.lineTo(ex,ey+er*0.6); ctx.stroke();
      });
      // Labels OD OE
      ctx.font='bold 12px sans-serif'; ctx.fillStyle='rgba(100,200,255,0.9)'; ctx.textAlign='center';
      ctx.fillText('OD',eOD,ey-er-6); ctx.fillText('OE',eOE,ey-er-6);
      // Linha nariz
      ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
      ctx.beginPath(); ctx.moveTo(cx,cy-oh*0.44); ctx.lineTo(cx,cy+oh*0.44); ctx.stroke();
      ctx.setLineDash([]);
      // Cantos
      var cs=18;
      [[cx-ow/2,cy-oh/2,1,1],[cx+ow/2,cy-oh/2,-1,1],[cx-ow/2,cy+oh/2,1,-1],[cx+ow/2,cy+oh/2,-1,-1]]
      .forEach(function(c){
        ctx.strokeStyle='#C9A84C'; ctx.lineWidth=3;
        ctx.beginPath(); ctx.moveTo(c[0]+c[2]*cs,c[1]); ctx.lineTo(c[0],c[1]); ctx.lineTo(c[0],c[1]+c[3]*cs); ctx.stroke();
      });
      requestAnimationFrame(drawGuide);
    }
    requestAnimationFrame(drawGuide);
  }).catch(function(err){
    fecharCam();
    showToast('Erro câmera: '+err.message,'error');
    document.getElementById('rf_foto_file').click();
  });
}

      removeBtn.addEventListener('click', ()=>{
        document.getElementById('rf_foto_hidden').value = '';
        prev.innerHTML = '';

        if(btn) btn.style.display = 'none';
        const res = document.getElementById('rf_ia_resultado');
        if(res){ res.style.display='none'; res.innerHTML=''; }
        if(document.getElementById('rf_foto_file')) document.getElementById('rf_foto_file').value='';
        if(document.getElementById('rf_foto_gallery')) document.getElementById('rf_foto_gallery').value='';
      });
      wrap.appendChild(img);
      wrap.appendChild(removeBtn);
      prev.appendChild(wrap);

    // Show AI button
