<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resgate de Dados - Ótica Lclass</title>
<style>
body{font-family:Arial,sans-serif;background:#101114;color:#fff;margin:0;padding:24px}
.box{max-width:620px;margin:40px auto;background:#1b1d22;padding:24px;border-radius:16px}
h1{font-size:22px;margin-top:0}
.info{background:#24272d;padding:14px;border-radius:10px;margin:18px 0;line-height:1.6}
button{width:100%;padding:16px;border:0;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer}
#status{margin-top:16px;white-space:pre-line;line-height:1.6}
</style>
</head>
<body>
<div class="box">
<h1>Resgate de Dados — Ótica Lclass</h1>
<div class="info">
Esta página somente lê os dados da Ótica Lclass armazenados neste navegador.
Ela não apaga nem modifica nenhuma informação.
</div>
<button id="exportar">📥 Exportar backup deste dispositivo</button>
<div id="status"></div>
</div>
<script>
const CHAVES=['clientes','receitas','crediario','vendas','agenda','estoque'];

function ler(k){
  try{
    const raw=localStorage.getItem('otica_'+k);
    return raw===null ? [] : JSON.parse(raw);
  }catch(e){
    return [];
  }
}

document.getElementById('exportar').addEventListener('click',()=>{
  const dados={};
  CHAVES.forEach(k=>dados[k]=ler(k));

  const contagens={};
  CHAVES.forEach(k=>contagens[k]=Array.isArray(dados[k])?dados[k].length:0);

  const backup={
    sistema:'otica-lclass',
    versaoBackup:1,
    exportadoEm:new Date().toISOString(),
    origem:location.origin,
    dados
  };

  const blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='resgate-otica-lclass-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);

  document.getElementById('status').textContent=
    'Backup gerado.\n'+
    CHAVES.map(k=>k+': '+contagens[k]).join('\n');
});
</script>
</body>
</html>
